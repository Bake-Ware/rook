# A small plugin for tests/core2/test_worker_host.py: settings, a secret,
# and a cap this worker can't serve.
manifest: 1
plugin: echo
version: 1.0.0
doc: Says things back.
settings:
  greeting: { default: hello }
  token: { where: hub, secret: true }
  motto: { where: hub }
caps:
  say:
    doc: Echo the text.
    risk: read
    scope: self
    args: { text: { type: str, required: true } }
    aliases: [echo.speak]
    run: scripts/echo.py:say
  greet:
    doc: Greet someone.
    risk: read
    scope: self
    args: { name: { type: str, default: world } }
    run: scripts/echo.py:greet
  secret:
    doc: Echo the token (test only).
    risk: read
    scope: self
    run: scripts/echo.py:secret
  motto:
    doc: Echo the band motto.
    risk: read
    scope: self
    run: scripts/echo.py:motto
  windows:
    doc: Windows only.
    risk: read
    scope: self
    platforms: [windows]
    run: scripts/echo.py:say
