[env:rp2040-zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0dcdd94eead72fdf56ea59a3d7c8aa2f379
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
; Application identity, distinct from the RP2040 ROM bootloader (0003).
board_build.arduino.earlephilhower.usb_pid = 0x000A
board_build.usbstack = tinyusb
build_flags =
    -DUSE_TINYUSB
    -DROOK_OLED_SDA=28
    -DROOK_OLED_SCL=29
    -DROOK_OLED_HEIGHT=64
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    adafruit/Adafruit SSD1306@2.5.15
monitor_speed = 115200
