title: Desktop screenshots
doc: Capture this worker's screen as a JPEG.
platforms: [linux, windows, macos]
requires: { hardware: [display] }
caps:
  screen.capture:
    doc: Capture the screen (or a region of it) as a JPEG.
    args:
      quality: { type: int, default: 85, min: 1, max: 100 }
      x: { type: int, doc: Region left edge (set x, y, w and h together). }
      y: { type: int }
      w: { type: int }
      h: { type: int }
    timeout: 30s
    action:
      exec:
        try:
          - { argv: [grim, -t, jpeg, -q, "{{args.quality}}", [-g, "{{args.x}},{{args.y}} {{args.w}}x{{args.h}}"], "{{tmp}}/s.jpg"] }
          - { argv: [scrot, -q, "{{args.quality}}", -o, [-a, "{{args.x}},{{args.y}},{{args.w}},{{args.h}}"], "{{tmp}}/s.jpg"] }
          - { argv: [spectacle, -b, -n, -o, "{{tmp}}/s.jpg"] }
          - { argv: [gnome-screenshot, -f, "{{tmp}}/s.jpg"] }
          - { argv: [import, -window, root, -quality, "{{args.quality}}", "{{tmp}}/s.jpg"] }
        macos:
          argv: [screencapture, -x, -t, jpg, [-R, "{{args.x}},{{args.y}},{{args.w}},{{args.h}}"], "{{tmp}}/s.jpg"]
        windows:
          argv: [powershell, -NoProfile, -NonInteractive, -Command,
                 "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; $b = [System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save($env:ROOK_OUT, [System.Drawing.Imaging.ImageFormat]::Jpeg)"]
          env: { ROOK_OUT: "{{tmp}}/s.jpg" }
        output: "{{tmp}}/s.jpg"
      parse: bytes
