title: Cameras
doc: Still photos from this worker's cameras.
caps:
  capture:
    doc: Capture a still JPEG from a camera.
    args:
      camera: { type: int, default: 0, min: 0, doc: Camera index (/dev/video<N> on Linux). }
      quality: null
      resolution: { type: str, default: 1280x720, pattern: '^\d{2,5}x\d{2,5}$' }
    platforms: [linux, android]   # Windows used ffmpeg dshow with a device name: still Python
    timeout: 30s
    action:
      exec:
        try:
          - { argv: [fswebcam, -d, "/dev/video{{args.camera}}", --no-banner, -q, -r, "{{args.resolution}}", "{{tmp}}/c.jpg"] }
          - { argv: [ffmpeg, -y, -f, v4l2, -video_size, "{{args.resolution}}", -i, "/dev/video{{args.camera}}", -frames:v, "1", "{{tmp}}/c.jpg"] }
        android:
          argv: [termux-camera-photo, -c, "{{args.camera}}", "{{tmp}}/c.jpg"]
        output: "{{tmp}}/c.jpg"
      parse: bytes
