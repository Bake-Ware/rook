# deluge-console takes the whole command as ONE argument and re-parses it
# (splits on ';', then shlex), so argv-slot escaping does not protect it: the
# patterns below are the injection guard the Python plugin had in code. It
# also exits 0 when the daemon is down: fail_if turns that into an error.
title: Torrents (Deluge)
doc: Manage a Deluge torrent client through deluge-console.
settings:
  console: { type: str, where: worker, default: deluge-console, doc: Path to deluge-console. }
requires: { bins: [deluge-console] }
caps:
  list:
    doc: Current torrents (state letter, progress, name, id).
    action:
      exec: { argv: ["{{settings.console}}", info] }
      fail_if: { regex: "^Failed to connect" }
      parse: { regex: '^\[(?P<state>.)\]\s+(?P<progress>[\d.]+)%\s+(?P<name>.*?)\s+(?P<id>[0-9a-fA-F]{40})\s*$', each: true }
    result:
      type: list
      items: { type: map, fields: { state: {}, progress: { type: float }, name: {}, id: {} } }
    idempotent: true
  get:
    doc: One torrent in detail (save path and files); read the files with file.read.
    args:
      torrent_id: { type: str, required: true, pattern: '^(\*|[0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f-][^\s;''"\\\x00-\x1f\x7f]*)$', doc: Hash (or prefix) or name without spaces. }
    action:
      exec: { argv: ["{{settings.console}}", "info -v {{args.torrent_id}}"] }
      fail_if: { regex: "^Failed to connect" }
      parse: text
    idempotent: true
  add:
    args:
      torrent: { type: str, required: true, pattern: '^[^\s;''"\\\x00-\x1f\x7f-][^\s;''"\\\x00-\x1f\x7f]*$', doc: "Magnet link, .torrent URL or local path (no spaces or backslashes)." }
    timeout: 45s
    action:
      exec: { argv: ["{{settings.console}}", "add {{args.torrent}}"] }
      fail_if: { regex: "^Failed to connect" }
      parse: text
  pause:
    args:
      torrent_id: { type: str, default: "*", pattern: '^(\*|[0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f-][^\s;''"\\\x00-\x1f\x7f]*)$' }
    action:
      exec: { argv: ["{{settings.console}}", "pause {{args.torrent_id}}"] }
      fail_if: { regex: "^Failed to connect" }
      parse: text
  resume:
    args:
      torrent_id: { type: str, default: "*", pattern: '^(\*|[0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f-][^\s;''"\\\x00-\x1f\x7f]*)$' }
    action:
      exec: { argv: ["{{settings.console}}", "resume {{args.torrent_id}}"] }
      fail_if: { regex: "^Failed to connect" }
      parse: text
  remove:
    doc: Remove a torrent from Deluge and keep its downloaded files.
    effects: null
    args:
      data: null
      torrent_id: { type: str, required: true, pattern: '^([0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f*-][^\s;''"\\\x00-\x1f\x7f]*)$' }
    action:
      exec: { argv: ["{{settings.console}}", "rm {{args.torrent_id}}"] }
      fail_if: { regex: "^Failed to connect" }
      parse: text
  delete:
    doc: Remove a torrent AND erase its downloaded files for good.
    aliases: null
    args:
      data: null
      torrent_id: { type: str, required: true, pattern: '^([0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f*-][^\s;''"\\\x00-\x1f\x7f]*)$' }
    action:
      exec: { argv: ["{{settings.console}}", "rm --remove_data {{args.torrent_id}}"] }
      fail_if: { regex: "^Failed to connect" }
      parse: text
check: [torrent.list]
