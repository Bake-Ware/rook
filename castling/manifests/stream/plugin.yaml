caps:
  open:
    doc: 'Start a harness (shell|claude|codex|hermes) under a PTY and return its terminal `id` immediately.
      With `argv` (a list, no shell) or `cmd` (a string through /bin/sh -c, PowerShell on Windows) it
      runs that command instead of the login shell (harness shell only); `env` adds variables, and PAGER/GIT_PAGER
      default to cat so nothing waits on a pager. `task` (a Rook task id or slug) and `room` (a console
      room id) are recorded on the terminal and its session record; the hub claims the task. `resume`
      is a Claude/Codex session id to continue. `mcp_url`/`mcp_token` inject a Rook MCP connection (env
      ROOK_MCP_URL/ROOK_MCP_TOKEN; claude also gets --mcp-config, codex -c mcp_servers.rook.*). `session`
      is the hub''s Work session id, exported as ROOK_WORK_SESSION. `remote_control` (claude only) is
      a Remote Control label, so the session also shows in claude.ai. `handoff_pid` (with `resume`) is
      the process that holds the session now, such as a Claude Code moving itself here with /rook-move:
      the terminal is returned at once and the harness starts once that process has exited (up to 2 minutes).
      Without `handoff_pid`, a resume is refused while the session''s transcript changed in the last 2
      minutes or a Claude Code with an unreadable PID marker probably holds it; `force=true` overrides
      that guess (never the process evidence). Follow output with work.stream.read.'
