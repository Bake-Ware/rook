plugin: notification-desktop
version: 0.5.0-draft.1
title: Desktop notifications
doc: Pop up a notification on this worker's desktop.
package: devices
requires:
  hardware:
  - display
caps:
  notification.post:
    doc: Show a desktop notification on this worker.
    risk: write
