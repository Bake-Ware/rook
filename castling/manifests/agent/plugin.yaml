# DRAFT generated by castling/tools/convert.py; edit overlays/, not this file.
# Converted from: rook/hub/plugins/home/__init__.py, rook/hub/plugins/roles/__init__.py
manifest: 1
plugin: agent
version: 0.5.0-draft.1
package: agents
runs_on: hub
settings:
  enabled:
    type: bool
    where: hub
    doc: 'On: the home agent answers in hub chat and to home.ask.'
  name:
    type: str
    where: hub
    doc: Chat identity agent:<name>; people address it as @<name>.
  timezone:
    type: str
    where: hub
    doc: 'IANA name (America/Chicago) for the times the assistant says. Blank: the hub''s local time.'
  backend:
    type: str
    where: hub
    doc: 'openai: an OpenAI-compatible endpoint (below). claude-code, codex, opencode: that agent harness
      on an agent host (a worker where it is installed and signed in); see the Agent host group.'
  llm_provider:
    type: str
    where: hub
    doc: 'A provider from Intelligence sources > Model providers (llmanifold, or one added there). Set:
      its address and key are used, and the base URL and API key below are not. Blank: the endpoint below.'
  provider:
    type: str
    where: hub
    doc: 'openai: any OpenAI-compatible /v1 endpoint.'
  base_url:
    type: str
    where: hub
    doc: The endpoint's /v1 base, e.g. http://llm.example:1234/v1.
  model:
    type: str
    where: hub
    doc: A model id from the endpoint's /v1/models.
  api_key:
    type: str
    where: hub
    doc: '{{secret:<vault name>}}; blank when the endpoint needs no key. The key itself stays in the vault.'
  timeout_s:
    type: float
    where: hub
    doc: Request timeout (s)
  max_tokens:
    type: int
    where: hub
    doc: Longest reply (tokens)
  temperature:
    type: float
    where: hub
    doc: 'Blank: the endpoint''s default.'
  agent_host:
    type: str
    where: hub
    doc: The worker that runs the home agent's turns with its Claude Code, Codex or OpenCode (name or
      id). Change it to move the agent; nothing is lost (memory stays at the hub).
  agent_fallback_hosts:
    type: list
    where: hub
    doc: Tried in order when the agent host is offline, lacks the harness or is not logged in.
  agent_on_unavailable:
    type: str
    where: hub
    doc: 'fallback_backend: answer with the OpenAI-compatible endpoint when one is set. fail: say the
      agent is unavailable.'
  agent_timeout_s:
    type: float
    where: hub
    doc: Turn timeout (s)
  agent_callback_url:
    type: str
    where: hub
    doc: 'Where the agent host reaches the hub''s per-turn tool server. Blank: the hub''s public MCP URL.'
  claude_model:
    type: str
    where: hub
    doc: haiku, sonnet or opus (the current model of that family), or a full model id.
  claude_effort:
    type: str
    where: hub
    doc: 'Blank: Claude Code''s default for the model.'
  claude_auth:
    type: str
    where: hub
    doc: 'login: the host''s own claude login (its subscription). token: a long-lived token from `claude
      setup-token`, kept in the vault.'
  claude_token:
    type: str
    where: hub
    doc: '{{secret:<vault name>}} holding a `claude setup-token` token; used when sign-in is token.'
  codex_model:
    type: str
    where: hub
    doc: 'Blank: Codex''s default. List models asks the host''s Codex.'
  codex_effort:
    type: str
    where: hub
    doc: 'Blank: the model''s default.'
  opencode_model:
    type: str
    where: hub
    doc: 'provider/model from the host''s OpenCode providers. Blank: its default model. OpenCode''s free
      tier refuses custom agents; use your own provider.'
  persona:
    type: str
    where: hub
    doc: 'A persona profile id. Blank: the persona assigned to family ''home'' (or the default one).'
  system_prompt:
    type: str
    where: hub
    doc: Appended to the persona and the built-in instructions.
  context_messages:
    type: int
    where: hub
    doc: Room messages sent as context
  tools:
    type: bool
    where: hub
    doc: Lets the model search the knowledge wiki and, when memory is on, save and search its memory.
      Each call is journaled as the home agent. Leave off for endpoints that do not support tool calls.
  memory:
    type: bool
    where: hub
    doc: 'Remember people, facts, conversations and skills between conversations (Work > Memory). Off:
      it neither reads nor writes memory.'
  voice:
    type: str
    where: hub
    doc: 'The voice its huddle messages are read aloud in (the Speak button), from the hub''s voice engine.
      Blank: the band''s default voice.'
  page_tools:
    type: bool
    where: hub
    doc: 'On: a message from the dashboard''s chat carries the page you are on, what you selected and
      what is on screen, and the agent can open pages and point at things there, in your browser; on Overview,
      Start page, Work, Huddles, Knowledge, Memory and Help it can also type into text fields (never saving)
      and press things that only show or find (tabs, Open, Filter, Search). Anything that changes something
      stays yours to press. Off: it only reads your message.'
  front_door:
    type: bool
    where: hub
    doc: 'On: every request (voice, web, chat, MCP, huddles it chairs) is triaged: answer it, do it (quick,
      reversible, allowed by the trust map), dispatch a coding session, or open a huddle; anything else
      becomes a one-line ask in Approvals. Off: it only answers. docs/design/front-door.md.'
  front_dispatch_role:
    type: str
    where: hub
    doc: The role that owns sessions the house agent dispatches (it needs a code location, role.code_locations).
  ask_ttl_hours:
    type: float
    where: hub
    doc: An unanswered ask expires after this long; nothing is done.
  offer_remember:
    type: bool
    where: hub
    doc: After acting on your yes, ask once whether to remember it (a playbook rule, or a trust change
      you accept on the Trust page).
  front_max_calls:
    type: int
    where: hub
    doc: Tool calls per request
  onboard_review_days:
    type: int
    where: hub
    doc: A project the house agent set up comes back as "Still a toy?" after this long; a scoped exception
      it proposes expires then. docs/design/onboarding.md.
  onboard_quiet_days:
    type: int
    where: hub
    doc: When a project that borrowed something (e.g. a stopped service) has been quiet this long, the
      house agent offers to restore it.
  onboard_concept:
    type: str
    where: hub
    doc: 'The concept new projects are filed under (slug or id). Blank: house-projects, created on first
      use.'
  onboard_sweep_minutes:
    type: int
    where: hub
    doc: 'How often it looks for borrowed state to offer back and projects to review. 0: never.'
  access_prompts:
    type: bool
    where: hub
    doc: 'When a machine or band appears that some members don''t reach yet, ask the owners once who gets
      it, and hand a new person''s request for access to you as one question. Off: they wait on the People
      page. Checked as often as borrowed state.'
  persistent:
    type: bool
    where: hub
    doc: 'On: the house agent runs as always-on Claude Code sessions on the session host (Opus in its
      role directory, Haiku as its voice in voice/), and every request goes through its inbox. Off, or
      no session host connected: one turn at a time on the agent host, as before. docs/design/persistent-agents.md.'
  voice_lane:
    type: bool
    where: hub
    doc: 'Also run the voice (the conductor): a Haiku session in voice/ that the voice server streams
      from, routing to the house agent through the inbox.'
  persistent_model:
    type: str
    where: hub
    doc: Agent model
  persistent_effort:
    type: str
    where: hub
    doc: 'Blank: Claude Code''s default for the model.'
  web_search:
    type: bool
    where: hub
    doc: The house agent may search the web and read pages (Claude Code's WebSearch and WebFetch). The
      voice never has tools; it asks the agent. Another role gets them only with a tool grant of "web"
      on the trust map.
  voice_model:
    type: str
    where: hub
    doc: 'claude-haiku-5-5 (default) at effort low: the voice has no tools and routes with a hidden line
      at the end of what it says, so it speaks with no thinking first. claude-haiku-4-5: the fallback
      (thinking off too, a little less capable).'
  voice_effort:
    type: str
    where: hub
    doc: Voice effort
  brief_phone:
    type: str
    where: hub
    doc: 'A worker name (e.g. bakephone): its battery, next calendar items and important notifications
      go in the voice''s brief, read every 5 minutes (reads only), and it is the only phone where the
      agent may change the calendar or act on notifications (when that phone allows it). Never a family
      device. Blank: none.'
  voice_signoff:
    type: str
    where: hub
    enum:
    - short
    - none
    doc: 'short: a few words ("Talk soon.") before the phone closes the mic; none: it just stops.'
  scribe_ask:
    type: bool
    where: hub
    doc: 'When people talk among themselves with you there, the voice stops replying and takes notes (scribe),
      only if you are among the speakers. On: it asks you first.'
  scribe_keep_days:
    type: int
    where: hub
    doc: Transcripts of overheard conversations are deleted after this; the takeaways on each conversation's
      knowledge page stay. Audio is never kept.
  voice_engine:
    type: str
    where: hub
    enum:
    - house
    - local
    doc: 'house: the voice is this house agent''s voice session (Voice model). local: the voice server
      answers on its own models (voice-front, voice-back on kaiju): no Claude, no web search, no routing
      to the agent. The voice server reads this per connection; no change on its host. The phone''s Voice
      models screen sets it too.'
  btw_model:
    type: str
    where: hub
    doc: The model that answers side questions from the agent's context.
  compact_at_tokens:
    type: int
    where: hub
    doc: 'Above this context size it saves durable facts to memory, then compacts. 0: only Claude Code''s
      own auto-compaction.'
  voice_compact_at_tokens:
    type: int
    where: hub
    doc: Compact the voice at (tokens)
  fork_max:
    type: int
    where: hub
    doc: Side threads at once
  fold_auto:
    type: bool
    where: hub
    doc: A finished side thread's summary goes into the agent's next turn.
  persistent_idle_sleep_min:
    type: int
    where: hub
    doc: 'Stop the house agent''s processes after this long without input (they resume by id on the next
      one). 0: always on.'
  mcp_catalog:
    type: list
    where: hub
    doc: MCP server names the house agent may grant to roles at the person's request, besides the ones
      in the session host's own Claude Code config.
  link_token_sha256:
    type: str
    where: hub
    doc: sha256 of the token the session host dials in with; the token itself stays on the host.
  voice_token_sha256:
    type: str
    where: hub
    doc: sha256 of the token the voice server uses on the session host's voice lane.
  job_steps:
    type: bool
    where: hub
    doc: Job steps with agent "home" may run the home agent with a tool set that acts on behalf of the
      job (never more than the job may do). Chat never gets these tools.
  job_max_tool_calls:
    type: int
    where: hub
    doc: A job step's max_tool_calls overrides it (up to the same limit).
  max_tool_calls:
    type: int
    where: hub
    doc: How many tool calls a role turn may make when neither the role nor its preset category sets its
      own (engineering roles default to 30). Near the limit the role is told how many are left; past it,
      its tools answer "answer now with what you have".
  tool_result_chars:
    type: int
    where: hub
    doc: 'A role''s tool result is cut to this many characters, with a [truncated: N of M chars] marker
      at the cut.'
  code_locations:
    type: list
    where: hub
    doc: 'One line per repository: its name, the worker and the folder of its main checkout (and where
      new worktrees go). Every role turn is told these, so roles never guess folders; a session.start
      card''s folder must be under one of them when any are set. A role''s own coding sessions start only
      here: name first, then "worker <name>", the checkout''s folder, "worktrees go under <folder>" and
      the base (origin/master).'
  protected_workers:
    type: list
    where: hub
    doc: 'Workers (by name) where every call a role makes, reads included, needs a person''s approval
      card: family phones and tablets, the TVs. Roles never act on these on their own, whatever their
      autonomy.'
  session_model:
    type: str
    where: hub
    doc: 'The Claude Code model a role''s coding session runs on (sonnet, opus or an id). Blank: Claude
      Code''s default on that host.'
  session_stall_minutes:
    type: int
    where: hub
    doc: A role's coding session with no output for this many minutes is reported to the role and the
      huddle as stalled (once).
  session_max_minutes:
    type: int
    where: hub
    doc: A role's coding session still running after this many minutes is stopped and reported as blocked.
  session_test_commands:
    type: list
    where: hub
    doc: Commands a role's coding session may also run to test its work, one per line with any arguments
      after them (python3 -m pytest, npm test, cargo test). Each runs the repository's own code in the
      session's worktree, so list only what you would run yourself. rook-pytest is always allowed; shell
      control characters and git, gh, sudo or shell commands are ignored.
  sessions_per_role:
    type: int
    where: hub
    doc: How many coding sessions one role may have running at once.
  session_github_app_id:
    type: str
    where: hub
    doc: 'A GitHub App the hub mints per-session tokens from (one repository, contents and pull requests
      only, under an hour). With the installation and private key set, sessions run without the host''s
      own GitHub credentials. Blank: sessions keep the push guard only.'
  session_github_installation:
    type: str
    where: hub
    doc: The app's installation id on the repository's owner (from the app's installation page URL).
  session_github_app_key:
    type: str
    where: hub
    secret: true
    doc: The app's private key (PEM). Kept in the vault; sessions never see it.
caps:
  ask:
    doc: Ask the hub's home agent a question or give it a request; returns its answer.
    risk: write
    scope: multi-user
    args:
      question:
        type: str
        required: true
      context:
        type: str
        default: ''
      source:
        type: str
        default: ''
      id:
        type: str
    timeout: none
    aliases:
    - home.ask
    - role.ask
    run: scripts/home.py:HomeAgent.ask
records:
  agent:
    fields: {}
    caps:
    - list
    - get
    - history
    - create
    - update
    - delete
    aliases:
      list:
      - role.list
      get:
      - role.get
      history:
      - role.history
      delete:
      - role.delete
    history: true
hooks:
  start: scripts/home.py:HomeAgent.start
  stop: scripts/home.py:HomeAgent.stop
