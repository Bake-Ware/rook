    doc: Current screen as a JPEG (preview = 256x144 thumbnail).
    risk: read
    scope: local
    effects:
    - sensitive
    - physical
    args:
      preview:
        type: bool
        default: true
        doc: true = 256x144 thumbnail; false = full resolution.
      quality:
        type: int
        doc: JPEG quality; unset lets PiKVM pick.
        min: 1
        max: 100
    aliases:
    - pikvm.snap
    action:
      http:
        url: https://{{appliance.host}}/api/streamer/snapshot
        query:
          save: '0'
          load: '0'
          preview: '{{args.preview}}'
          quality: '{{args.quality}}'
        auth:
          basic:
          - '{{appliance.user}}'
          - '{{appliance.password}}'
        tls:
          verify: '{{appliance.verify_tls}}'
      fail_if:
        regex: \A\{\s*"ok"\s*:\s*false
      parse: bytes
  hid.type:
    doc: Type a string. `slow=True` adds inter-key delay on the PiKVM side.
    risk: exec
    scope: local
    effects:
    - physical
    args:
      text:
        type: str
        required: true
      slow:
        type: bool
        default: false
    aliases:
    - pikvm.type
    action:
      http:
        method: POST
        url: https://{{appliance.host}}/api/hid/print
        query:
          limit: '0'
          slow: '{{args.slow}}'
        headers:
          Content-Type: text/plain; charset=utf-8
        body: '{{args.text}}'
        auth:
          basic:
          - '{{appliance.user}}'
          - '{{appliance.password}}'
        tls:
          verify: '{{appliance.verify_tls}}'
  hid.key:
    doc: Press+release a key with optional modifier list (each is a key name).
    risk: exec
    scope: local
    effects:
    - physical
    args:
      key:
        type: str
        required: true
      mods:
        type: list
    aliases:
    - pikvm.key
    run: scripts/pikvm.py:PiKvmPlugin._key
  hid.move:
    doc: Absolute mouse position. `x` and `y` are in PiKVM units (-32768..32767 mapped across the captured
      frame).
    risk: exec
    scope: local
    effects:
    - physical
    args:
      x:
        type: int
        required: true
      y:
        type: int
        required: true
    aliases:
    - pikvm.mouse.move
    action:
      http:
        method: POST
        url: https://{{appliance.host}}/api/hid/events/send_mouse_move
        query:
          to_x: '{{args.x}}'
          to_y: '{{args.y}}'
        auth:
          basic:
          - '{{appliance.user}}'
          - '{{appliance.password}}'
        tls:
          verify: '{{appliance.verify_tls}}'
  hid.click:
    doc: Click a mouse button (press and release).
    risk: exec
    scope: local
    effects:
    - physical
    args:
      button:
        type: str
        default: left
        enum:
        - left
        - right
        - middle
    aliases:
    - pikvm.mouse.click
    action:
      http:
        method: POST
        url: https://{{appliance.host}}/api/hid/events/send_mouse_button
        query:
