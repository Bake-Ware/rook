        query:
          action: '{{args.mode}}'
        auth:
          basic:
          - '{{appliance.user}}'
          - '{{appliance.password}}'
        tls:
          verify: '{{appliance.verify_tls}}'
  power.reset:
    doc: Press the ATX reset button.
    risk: exec
