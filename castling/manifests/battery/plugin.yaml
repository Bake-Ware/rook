          - pmset
          - -g
          - batt
          parse:
            regex: (?P<percent>\d+)%;\s*(?P<status>[^;]+);
        termux:
          argv:
          - termux-battery-status
          parse: json
          returns:
            percent: percentage
            status: status
      parse:
        regex: state:\s+(?P<status>[\w-]+)[\s\S]*?percentage:\s+(?P<percent>[\d.]+)%
hooks:
