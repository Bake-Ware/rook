# DRAFT generated by castling/tools/convert.py; edit overlays/, not this file.
# Converted from: rook/hub/plugins/huddle/__init__.py
manifest: 1
plugin: huddle
version: 0.5.0-draft.1
package: agents
runs_on: hub
settings:
  enabled:
    type: bool
    where: hub
    default: true
    doc: 'Group rooms where agents post status and ask you questions, shown on Work > Huddle. Read at
      start: restart the hub to apply.'
  wake_on_answer:
    type: bool
    where: hub
    default: false
    doc: 'After you answer a question, start the asking agent again on the machine it says it runs on
      (hermes or agent.wake), with the agent''s own permissions. Off: it sees the answer on its next call.'
  reply_chars:
    type: int
    where: hub
    doc: 'Each role is asked to keep its answer under this many characters. Its answer is posted whole
      (a chat post past 8000 characters is cut, with a [truncated: N of M chars] marker).'
  role_retries:
    type: int
    where: hub
    doc: A role whose turn failed or ran out of tool calls is asked again this many times in a round,
      with a narrower question, before the chair closes.
  max_followups:
    type: int
    where: hub
    doc: How many times in one round the chair may call on roles again when the thread is not settled
      (a role failed, or a question is still open), before it closes and says what is still open.
  max_role_turns:
    type: int
    where: hub
    doc: At most this many roles answer in one round (the chair picks them; roles never call each other).
  retention_days:
    type: int
    where: hub
    doc: 'Archived chaired huddles are deleted this many days after they were archived (0: kept forever).
      Huddles that are not archived are kept.'
  default_roles:
    type: list
    where: hub
    doc: Roles a new huddle starts with when none are named (only those that exist on the Roles tab).
  votes:
    type: bool
    where: hub
    doc: 'The chair pins artifacts (a PR, a commit, test output, a document, a link) at an exact version
      for every role to read, and calls votes on merge, ready for QA, deploy and ship: gates first, then
      the required roles vote blind; the hub carries out a passed vote (docs/manual/conference-table.md).'
  vote_voters:
    type: json
    where: hub
    doc: Per action (merge, qa, deploy, ship) the seats that must all vote yes. A seat 'critic|skeptic'
      is the first of those roles that exists and may vote. Authors and the proposer never vote on their
      own work.
  vote_alternates:
    type: json
    where: hub
    doc: Who fills a seat when its role wrote the work (e.g. lead -> architect). With nobody to stand
      in, the seat counts as couldn't verify.
  vote_auto:
    type: list
    where: hub
    doc: Actions the hub carries out on its own after every gate and every required voter says yes (the
      trust ramp). Others (deploy, ship) ask you with one Yes / No / Explain line. Sacred targets always
      ask you.
  vote_github_secret:
    type: str
    where: hub
    doc: 'The vault secret the hub merges with (and reads GitHub with). Sessions and roles never see it.
      Blank: the hub reads public repositories anonymously and cannot merge. With an ''admins only'' ruleset
      on the default branch it must be a repository admin''s token (or on the ruleset''s bypass list).'
  vote_merge_method:
    type: str
    where: hub
    enum:
    - merge
    - squash
    - rebase
    doc: Merge method
  vote_require_ci:
    type: bool
    where: hub
    doc: The CI and tests gates fail when no check ran on the voted commit.
  vote_test_checks:
    type: list
    where: hub
    doc: Check names (globs) that count as the test run for the tests gate.
  vote_gate_wait_minutes:
    type: int
    where: hub
    doc: How long the gates wait for running checks before they fail.
  vote_deploy_targets:
    type: list
    where: hub
    doc: 'Deploy and ship votes name one: {id, title, dry_run: {worker, cap, args}, deploy: {worker, cap,
      args}}; ''{sha}'' in args is the voted commit. The dry run is the rollback gate; both run as the
      house agent under the trust map.'
  speak_devices:
    type: list
    where: hub
    doc: 'Workers a message''s Speak menu may play on (voice.speak, e.g. your phone). Blank: every online
      worker with voice.speak except the protected devices (role.protected_workers), and none when no
      devices are marked protected. Protected devices are never offered.'
caps:
  start:
    doc: 'Start a chaired huddle: you, the house agent in the chair and roles (ids; default huddle.default_roles;
      [] for a 1:1 with the chair). Returns {room, title, roles}.'
    risk: write
    scope: multi-user
    args:
      title:
        type: str
        default: ''
      roles:
        type: json
      band:
        type: str
    run: scripts/huddle.py:Huddle.start_
hooks:
  start: scripts/huddle.py:Huddle.start
  stop: scripts/huddle.py:Huddle.stop
