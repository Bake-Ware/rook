plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// The release key lives outside the repo (docs: android/README.md).
// With no key there, the release build signs with the debug key and says so.
def signingFile = new File(System.getProperty("user.home"), ".rook-android/signing.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace "systems.bake.rook.core"
    compileSdk 35

    defaultConfig {
        applicationId "systems.bake.rook.core"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile new File(signingFile.parentFile, signing.getProperty("storeFile"))
                storePassword signing.getProperty("storePassword")
                keyAlias signing.getProperty("keyAlias")
                keyPassword signing.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("No release key at ${signingFile}: signing the release APK with the debug key.")
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation project(":worker")
}
