plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}

// Deployment-specific settings (server, voice agent, Google client, wake word)
// come from -P properties, environment variables, or an untracked
// android/rook.properties, so the public source names no real server.
def rookProps = new Properties()
def rookPropsFile = rootProject.file("rook.properties")
if (rookPropsFile.exists()) rookPropsFile.withInputStream { rookProps.load(it) }
def rookSetting = { String name, String fallback ->
    (project.findProperty(name) ?: System.getenv(name) ?: rookProps.getProperty(name) ?: fallback).toString()
}

android {
    namespace "systems.bake.rook"
    compileSdk 34

    defaultConfig {
        applicationId "systems.bake.rook"
        minSdk 23          // Android 6.0+; some caps (gesture HID, unlock) need 24/26 — guarded at runtime
        targetSdk 34
        testInstrumentationRunner "systems.bake.rook.NativeSmokeInstrumentation"
        versionCode = (project.findProperty("ROOK_APK_VERSION_CODE") ?: "10").toInteger()
        versionName = (project.findProperty("ROOK_APK_VERSION_NAME") ?: "0.4.6").toString()

        // Chaquopy: only the ABIs you intend to run on. arm64 covers modern phones;
        // x86_64 is handy for the emulator. Trim to shrink the APK.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }

        // Default band settings — overridable at runtime in MainActivity and
        // persisted to SharedPreferences. Baked from build properties so the PSK
        // stays OUT of VCS: pass -PROOK_DEFAULT_HUB=... -PROOK_DEFAULT_PSK=... (or
        // the same env vars) at build time; falls back to the example placeholders.
        def rookHub = rookSetting("ROOK_DEFAULT_HUB", "hub.example.com:443")
        def rookPsk = rookSetting("ROOK_DEFAULT_PSK", "")
        if (rookPsk) throw new GradleException("Public APKs must not embed a band PSK; use Google sign-in or a pairing code.")
        buildConfigField "String", "DEFAULT_HUB", "\"${rookHub}\""
        buildConfigField "String", "DEFAULT_PSK", "\"${rookPsk}\""
        def voiceUrl = rookSetting("ROOK_VOICE_URL", "wss://voice.example.com/ws")
        def voiceTok = rookSetting("ROOK_VOICE_TOKEN", "")
        if (voiceTok) throw new GradleException("Public APKs must not embed a voice token.")
        // The Rook site: account login, pairing, and the only origin updates are accepted from.
        def rookServer = rookSetting("ROOK_SERVER", "https://rook.example.com")
        // Google sign-in is offered only when a web client ID is configured.
        def googleClient = rookSetting("ROOK_GOOGLE_WEB_CLIENT_ID", "")
        // Wake word: an openWakeWord model in assets/wakeword/ and the phrase it detects.
        // With no model configured the app works by tap-to-talk only.
        def wakeModel = rookSetting("ROOK_WAKE_MODEL", "")
        def wakePhrase = rookSetting("ROOK_WAKE_PHRASE", "")
        def assistantName = rookSetting("ROOK_ASSISTANT_NAME", "Rook")
        buildConfigField "String", "ROOK_SERVER", "\"${rookServer}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleClient}\""
        buildConfigField "String", "DEFAULT_VOICE_URL", "\"${voiceUrl}\""
        buildConfigField "String", "DEFAULT_VOICE_TOKEN", "\"${voiceTok}\""
        buildConfigField "String", "WAKE_MODEL", "\"${wakeModel}\""
        buildConfigField "String", "WAKE_PHRASE", "\"${wakePhrase}\""
        resValue "string", "voice_title", assistantName
        resValue "string", "hint_message", "Message ${assistantName}…"
        resValue "string", "wake_enabled", wakePhrase ? "Wake word: \u201c${wakePhrase}\u201d" : "Wake word (no model in this build)"
        resValue "string", "st_standby", wakePhrase ? "standby · \u201c${wakePhrase}\u201d" : "standby"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.11"

        pip {
            // Native deps — Chaquopy ships prebuilt wheels for these, so no NDK
            // compile of libsodium (the exact thing that broke under Termux).
            install "pynacl"
            install "aiohttp"
            install "websockets"
        }

        // worker_entry.start(...) is the bridge entrypoint the service calls.
    }

    sourceSets {
        getByName("main") {
            // src/main/python holds worker_entry.py + the rook_android.* native
            // plugins. The rook.worker and telesthete.protocol packages are
            // staged in by `python stage_worker.py` (run before each build).
            srcDir "src/main/python"
        }
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20160810"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.2"
}

tasks.register("stageWorker", Exec) {
    workingDir rootProject.projectDir
    commandLine "python3", "stage_worker.py"
}
tasks.named("preBuild").configure { dependsOn("stageWorker") }
