# Rook hub: the relay, and the hub (dashboard + MCP server in one process),
# from the published image.
#
#   cp .env.example .env    # then set ROOK_BAND_PSK and ROOK_WEB_PASS at least
#   docker compose up -d
#
# The image is ghcr.io/bake-ware/rook (amd64 and arm64), built by the release
# workflow with a prebuilt relay. Pin a release with ROOK_VERSION=0.2.0 in .env
# (default: latest). To build the image from this checkout instead:
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Values come from .env through ${...} interpolation only, so the bare-metal
# defaults in .env.example (127.0.0.1 addresses, ./data) never leak in here.

x-rook: &rook
  image: ${ROOK_IMAGE:-ghcr.io/bake-ware/rook}:${ROOK_VERSION:-latest}
  restart: unless-stopped
  volumes:
    - rook-data:/data

services:
  relay:
    <<: *rook
    command: ["telesthete-hub"]
    volumes: []
    environment:
      HUB_BIND: 0.0.0.0:7474
      # Rook peers keep alive every 20s; the relay's default TTL is 15s.
      HUB_PEER_TTL_SECS: "60"
      HUB_PRUNE_SECS: "10"
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "7474:7474/udp"

  # Dashboard + MCP server in one process (rook hub serve). Upgrading from the
  # two-service layout: `docker compose up -d --remove-orphans` (the old
  # dashboard and mcp containers held the same ports).
  hub:
    <<: *rook
    command: ["rook-hub", "--hub-host", "relay", "--hub-port", "7474",
              "--mcp-bind", "0.0.0.0:8765"]
    depends_on: [relay]
    environment:
      ROOK_DATA_DIR: /data
      ROOK_BIND: 0.0.0.0
      ROOK_PORT: "7005"
      ROOK_WEB_PASS: ${ROOK_WEB_PASS:?set ROOK_WEB_PASS in .env}
      ROOK_WEB_USER: ${ROOK_WEB_USER:-}
      ROOK_BAND_PSK: ${ROOK_BAND_PSK:?set ROOK_BAND_PSK in .env (docker run --rm ghcr.io/bake-ware/rook python -m rook.remote.psk)}
      ROOK_BAND_NAME: ${ROOK_BAND_NAME:-rook-band}
      # Public addresses templated into installer scripts.
      ROOK_DOMAIN: ${ROOK_DOMAIN:-localhost:7005}
      ROOK_HUB_PUBLIC: ${ROOK_HUB_PUBLIC:-localhost:8765}
      ROOK_MCP_STATIC_TOKEN: ${ROOK_MCP_STATIC_TOKEN:-}
      ROOK_MCP_PUBLIC_URL: ${ROOK_MCP_PUBLIC_URL:-}
      # Host headers other than localhost and ROOK_DOMAIN that may reach /mcp
      # (e.g. 192.168.1.10:8765).
      ROOK_ALLOWED_HOSTS: ${ROOK_ALLOWED_HOSTS:-}
      ROOK_KNOWLEDGE: ${ROOK_KNOWLEDGE:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7005/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
    ports:
      # Dashboard, /mcp and /band.
      - "7005:7005"
      # The MCP server alone (/mcp, /band), as the old mcp service published it.
      - "8765:8765"

volumes:
  rook-data:
