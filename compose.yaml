# Rook hub: relay + dashboard + MCP server.
#
#   cp .env.example .env    # then set ROOK_BAND_PSK and ROOK_WEB_PASS at least
#   docker compose up -d --build
#
# Values come from .env through ${...} interpolation only, so the bare-metal
# defaults in .env.example (127.0.0.1 addresses, ./data) never leak in here.

x-rook: &rook
  build: .
  image: rook-hub:local
  restart: unless-stopped
  volumes:
    - rook-data:/data

services:
  relay:
    <<: *rook
    command: ["telesthete-hub"]
    volumes: []
    environment:
      HUB_BIND: 0.0.0.0:7474
      # Rook peers keep alive every 20s; the relay's default TTL is 15s.
      HUB_PEER_TTL_SECS: "60"
      HUB_PRUNE_SECS: "10"
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "7474:7474/udp"

  dashboard:
    <<: *rook
    command: ["rook-dashboard", "--hub-host", "relay", "--hub-port", "7474"]
    depends_on: [relay]
    environment:
      ROOK_DATA_DIR: /data
      ROOK_BIND: 0.0.0.0
      ROOK_PORT: "7005"
      ROOK_WEB_PASS: ${ROOK_WEB_PASS:?set ROOK_WEB_PASS in .env}
      ROOK_WEB_USER: ${ROOK_WEB_USER:-}
      ROOK_BAND_PSK: ${ROOK_BAND_PSK:?set ROOK_BAND_PSK in .env (python -m rook.remote.psk)}
      ROOK_BAND_NAME: ${ROOK_BAND_NAME:-rook-band}
      # Public addresses templated into installer scripts.
      ROOK_DOMAIN: ${ROOK_DOMAIN:-localhost:7005}
      ROOK_HUB_PUBLIC: ${ROOK_HUB_PUBLIC:-localhost:8765}
    ports:
      - "7005:7005"

  mcp:
    <<: *rook
    command: ["rook-mcp", "--hub", "relay:7474", "--bind", "0.0.0.0:8765"]
    depends_on: [relay]
    environment:
      ROOK_DATA_DIR: /data
      ROOK_BAND_PSK: ${ROOK_BAND_PSK:?set ROOK_BAND_PSK in .env}
      ROOK_MCP_AUTH_PASSWORD: ${ROOK_MCP_AUTH_PASSWORD:-}
      ROOK_MCP_STATIC_TOKEN: ${ROOK_MCP_STATIC_TOKEN:-}
      ROOK_MCP_PUBLIC_URL: ${ROOK_MCP_PUBLIC_URL:-}
      # Host headers other than localhost that may reach /mcp (e.g. 192.168.1.10:8765).
      ROOK_ALLOWED_HOSTS: ${ROOK_ALLOWED_HOSTS:-}
      ROOK_KNOWLEDGE: ${ROOK_KNOWLEDGE:-0}
    ports:
      - "8765:8765"

volumes:
  rook-data:
