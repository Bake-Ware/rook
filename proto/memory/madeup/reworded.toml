# Round four: ways of asking about things already held, in words the stored text does not use.
# `heal-test` asks each cold (recall only), then live (the house agent may search in its own words),
# dreams, and asks again. relevant: an item counts as found when its text has every word of one group.

[[question]]
text = "Is the kitchen speaker still always listening?"
relevant = [["push to talk"], ["wake word"]]
[[question]]
text = "How do I get Rook's attention these days?"
relevant = [["push to talk"], ["wake word"]]
