# The Rook remote's own manifest (builtin: implemented in the firmware,
# announced by the device, never pushed). scripts/gen_manifest.py turns it
# into the canonical JSON the firmware embeds and serves from core.manifests;
# the announce carries its hash.
manifest: 1
plugin: remote
version: 0.11.4
title: Rook remote
doc: A handheld button remote with a small screen. Button presses arrive as remote.button events; agents can show text on it, ask a question and get the answer from a button press, or wait for the next press.
package: core
builtin: true
license: Apache-2.0
source: https://github.com/Bake-Ware/rook

caps:
  state:
    doc: The remote's buttons (names, which are held), the last presses, the device its buttons are for (target, of targets), its mode (remote, menu, chat or game) and the menu tab open (tab, of Devices, Assistant, Games, Settings), what the screen shows, Wi-Fi and hub status, the device on its own network it is driving (local), free memory and the firmware update's state.
    risk: read
    scope: local
    idempotent: true
    result: { type: map }
  display:
    doc: Show text on the remote's screen (held upright, 16 lines of 5 characters; newlines split lines, long lines wrap). seconds > 0 goes back to the status screen after that long; 0 keeps it until replaced.
    risk: write
    scope: local
    args:
      text: { type: str, required: true }
      seconds: { type: int, default: 0, min: 0, max: 86400 }
    result: { type: map }
  chat:
    doc: "The conversation with the house agent on the remote's screen: the last dozen things said, in bubbles (the person's on the right, the agent's on the left, notes bare), scrolled with up and down; it is the remote's menu's Assistant tab, where OK opens the paired remote's microphone like its Assistant key. text adds one, said by who (you: the person, agent, or note), and brings the conversation up; status sets the line under it (Thinking...; blank: none); clear empties it. Answers the conversation as it stands: {messages: [{who, text}]}."
    risk: write
    scope: local
    args:
      who: { type: str, enum: [you, agent, note], default: agent }
      text: { type: str }
      status: { type: str }
      clear: { type: bool, default: false }
    result: { type: map }
  screen:
    doc: "The screen's picture right now: {width, height, rotation (quarter turns clockwise it is shown at), dark (the panel is off), says (the same in words), data}. data is base64 of the panel's own buffer before rotation: one byte for each 8 pixels down a column (lowest bit on top), columns left to right, in bands of 8 rows."
    risk: read
    scope: local
    idempotent: true
    result: { type: map }
  press:
    doc: "Press a key as if on the Bluetooth remote paired to this one (up, down, left, right, ok, back, home, input, vol_up...): it does whatever that key does now, in the menu, the game or the conversation, or goes to the device the remote drives. Wakes the remote."
    risk: write
    scope: local
    args:
      button: { type: str, required: true }
    result: { type: map }
  ask:
    doc: Ask the person holding the remote a question and wait for their answer. The screen shows the prompt and the options; they step through options with the navigation buttons and pick one with OK. Answers {choice, index, button}, or {timeout true} when nobody answered in time.
    risk: write
    scope: local
    args:
      prompt: { type: str, required: true }
      options: { type: list, items: { type: str }, doc: "The choices; blank: Yes and No." }
      timeout: { type: int, default: 60, min: 5, max: 600, doc: Seconds to wait for an answer. }
    result: { type: map }
  wait:
    doc: Wait for the next button press on the remote. Answers {button, action, held_ms}, or {timeout true}. buttons narrows it to those button names.
    risk: read
    scope: local
    args:
      timeout: { type: int, default: 30, min: 1, max: 600, doc: Seconds to wait. }
      buttons: { type: list, items: { type: str } }
    result: { type: map }
  bt:
    doc: The Bluetooth remote paired to this one (most Android TV remotes). Its keys arrive as remote.button events too, with source bt; a key that means what one of this remote's buttons means has that button's name, any other is bt_c<usage> or bt_k<code>. action pair looks for a remote in pairing mode for 30 seconds and bonds with it; forget drops it; blank answers its state (off, idle, pairing, waiting, connected), name, last raw report, its GATT services and whether it has a microphone the remote can use (voice). find makes a paired remote with a buzzer beep so it can be found (level 1 to 3, quiet to loud; Google's Find My Remote service), quiet stops it; find in the answer says whether it has the service.
    risk: write
    scope: local
    args:
      action: { type: str, enum: [status, pair, forget, find, quiet], default: status }
      level: { type: int, min: 1, max: 3, default: 3 }
      names: { type: map, doc: "What its keys are called, raw key name (bt_c3) to the name it is sent under (up). Replaces the whole list." }
    result: { type: map }
  ir:
    doc: "Raw access to the paired remote's IR-over-BLE service (D343BFC0-5A21-4F05-BC7D-AF01F617B664, on the onn remote), to find its IR code format by experiment. Characteristics by suffix: c1 IR_PROG_CONTROL (01 start a session, 00 finish), c2 IR_KEY_ID (an Android keycode, 2 bytes little-endian), c3 IR_CODE (the code, split over writes), c4 IR_SUPPRESS (keycodes, 2 bytes each, that stay BLE), c5 IR_KEY_EVENT (notifies 00 down / 01 up, then the keycode). action write writes code (hex) to char, chunked at the MTU (code blank and key given: the key's 2 bytes); program does start, key, code in 20-byte writes, finish; suppress writes keys to c4; clear writes an empty suppress list and forgets the key events seen; blank only reports. Every write is with response: writes lists one line per write, '<char> <hex>: ok', or 'att 0x..' (the remote refused) or 'err N'. events lists the IR_KEY_EVENT notifications of the last 5 s (ago_ms, down or up, key, raw hex); those keys also arrive as remote.button ir_<keycode hex> when no HID key came with them. Android keycodes: POWER 26, VOLUME_UP 24, VOLUME_DOWN 25, MUTE 164, TV_INPUT 178. The remote can also send IR itself, from an IR LED on one of its own GPIOs (pin HIGH = LED on; the pin idles low): action pin sets that GPIO (-1: none; kept across restarts; the screen's pins are refused, a strapping pin is set with a warning) and answers it. action send sends, with the hardware carrier, either protocol nec with address (0..255, or a 16-bit extended address above 255), command (0..255) and repeats (repeat frames 108 ms apart), or raw: microsecond durations, mark first, alternately mark and space, at carrier Hz. A send is refused when it would last over 500 ms or has a mark over 20 ms, and is an error when no pin is set. It answers what was sent (sent), pin, duration_us, carrier_hz and edges. Every answer has ir_pin, the pin set (-1: none)."
    risk: write
    scope: local
    args:
      action: { type: str, enum: [status, write, program, suppress, clear, pin, send], default: status }
      char: { type: str, doc: "c1..c5, for write." }
      key: { type: int, min: 0, max: 65535, doc: An Android keycode. }
      code: { type: str, max: 2048, doc: "Bytes in hex (spaces and colons are ignored)." }
      keys: { type: list, items: { type: int }, doc: "Android keycodes, for suppress." }
      pin: { type: int, min: -1, max: 48, doc: "The IR LED's GPIO, for pin (-1: none)." }
      protocol: { type: str, enum: [nec], doc: For send. }
      address: { type: int, min: 0, max: 65535, doc: "The NEC address (over 255: extended)." }
      command: { type: int, min: 0, max: 255, doc: The NEC command. }
      repeats: { type: int, min: 0, max: 4, default: 0, doc: NEC repeat frames after the first. }
      raw: { type: list, max: 1024, items: { type: int }, doc: "Microsecond durations, mark first, for send." }
      carrier: { type: int, min: 20000, max: 100000, default: 38000, doc: "The carrier in Hz, for raw." }
    result: { type: map }
  wifi:
    doc: "The Wi-Fi networks the remote knows, in the order it joins them: on starting up or losing its network it scans once and tries each saved network it hears, first to last, moving on when one fails and going round again when all have. Names match whatever their case. Blank lists their names (saved, in that order) and the one in use. action add saves ssid with password at the top of the list; forget drops ssid. prefer moves a saved network (by name) to the top and keeps it there; it is an error when no saved network has that name. A person can do the same on the remote, in its Wi-Fi menu: OK on a network joins it (with the on-screen keyboard for its password), OK held on a saved one makes it the preferred one."
    risk: write
    scope: self
    args:
      action: { type: str, enum: [list, add, forget], default: list }
      ssid: { type: str }
      password: { type: str }
      prefer: { type: str, doc: A saved network's name to move to the top of the list (joined first from now on). }
    result: { type: map }
  map:
    doc: Name the buttons and the devices, and say how soon the remote rests. names lists one name per button, in the order remote.state lists them; blank keeps the current names. targets lists the devices the remote's own menu offers (the handheld's input button opens it, the bridge's Guide key tapped); the one picked there, or stepped to with the paired remote's profile key, rides every remote.button event as target.
    risk: write
    scope: self
    effects: [persists]
    args:
      names: { type: list, items: { type: str } }
      targets: { type: list, items: { type: str } }
      screen_off: { type: int, min: 0, max: 86400, doc: "Seconds left alone before the screen goes dark (30; 0: never)." }
      tz: { type: str, max: 64, doc: "The remote's time zone for its clock, as POSIX TZ (CST6CDT,M3.2.0,M11.1.0 for US Central); blank: UTC." }
      sleep: { type: int, min: 0, max: 86400, doc: "Seconds left alone before the remote sleeps: Wi-Fi off, so the hub cannot reach it until a key wakes it (300; 0: never)." }
    result: { type: map }

  scan:
    doc: Look for devices on the Wi-Fi network the remote has joined (SSDP and mDNS, about 15 seconds) and answer what it found. Each device has an id (its MAC address when known), name, model, address, the kinds it answered as (roku, webos, cast, androidtv, airplay, dial, samsung, wled...), the driver the remote has for it (roku or webos; blank when it can only be seen), what that driver supports, and whether it is paired. The remote also scans on its own a few seconds after joining a network.
    risk: read
    scope: external
    result: { type: map }
  devices:
    doc: What the last scan found, without scanning again, and the device the remote's buttons are driving now (selected), if any.
    risk: read
    scope: local
    idempotent: true
    result: { type: map }
  device:
    doc: Act on a device the scan found, straight from the remote over the local network, no hub in between. device is its id, name or address. action key presses key (up, down, left, right, ok, back, home, menu, vol_up, vol_down, mute, play, pause, rewind, forward, power, or the device's own key name in its own spelling); launch starts app (youtube, netflix, prime, disney, hulu, appletv, plex, or the device's own app id; a Roku also takes an app's name); power turns it off, or wakes it when it is off; pair has an LG TV show its prompt and waits a minute for someone to accept (a Roku needs none); forget drops the pairing; select makes the remote's own buttons drive this device from now on, and release hands them back to the hub's target.
    risk: write
    scope: external
    args:
      device: { type: str, required: true }
      action: { type: str, enum: [key, launch, power, pair, forget, select, release], default: key }
      key: { type: str }
      app: { type: str }
    result: { type: map }
  update:
    doc: Update the remote's firmware over the air. url is where the build is (http or https, reachable from the network the remote is on) and sha256 its SHA-256 in hex; the remote downloads it into its spare slot, checks the hash, answers started and restarts into it. The new build has five minutes to reach the hub, or the remote goes back to the build before. Blank answers the running version, the update's state (idle, downloading, failed, restarting), and whether the build is still on trial.
    risk: exec
    scope: self
    args:
      url: { type: str }
      sha256: { type: str }
    result: { type: map }

emits:
  remote.update.check:
    doc: Someone picked Update in the remote's menu. The hub's remote-update plugin answers over the band, with remote.update when it holds a newer build for this board.
    payload:
      worker: { type: str, required: true, doc: This remote's name. }
      version: { type: str, required: true, doc: The firmware it runs. }
      board: { type: str, required: true, doc: "bridge-c3 or s3: which build it takes." }
  remote.voice:
    doc: Someone finished saying something into the microphone of the Bluetooth remote paired to this one (its Assistant key). The audio came before it, in parts remote.voice.part events with the same id.
    payload:
      id: { type: str, required: true }
      parts: { type: int, required: true, doc: How many remote.voice.part events carried it. }
      bytes: { type: int }
      codec: { type: str, doc: "adpcm8k or adpcm16k: Google's voice-over-BLE frames (ATVV) of IMA ADPCM, mono." }
      worker: { type: str, doc: This remote's name. }
      ms: { type: int, doc: How long the microphone was open. }
  remote.voice.part:
    doc: A piece of what is being said (see remote.voice).
    payload:
      id: { type: str, required: true }
      seq: { type: int, required: true }
      data: { type: str, required: true, doc: "Base64 of the audio bytes the remote sent, in order." }
  remote.button:
    doc: A button on the remote was pressed (action press) or held down (action long, once while held). Not sent for the key that opens the remote's menu (input on the handheld; Guide on the bridge, where Guide held opens the conversation and input goes to the TV), nor the paired remote's profile key (it steps to the next device), nor while the menu or the game is up.
    payload:
      button: { type: str, required: true, doc: The button's name. }
      action: { type: str, required: true, doc: press or long. }
      index: { type: int, doc: The button's position in remote.state. }
      held_ms: { type: int }
      target: { type: str, doc: The device picked in the remote's menu (an appliance's name). }
      source: { type: str, doc: "bt when the key was pressed on the Bluetooth remote paired to this one." }
      local: { type: bool, doc: "true when target is a device on the remote's own network that it has already driven itself (remote.device select): nothing is left for a job to do." }
