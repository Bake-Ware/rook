# The Rook remote's own manifest (builtin: implemented in the firmware,
# announced by the device, never pushed). scripts/gen_manifest.py turns it
# into the canonical JSON the firmware embeds and serves from core.manifests;
# the announce carries its hash.
manifest: 1
plugin: remote
version: 0.3.1
title: Rook remote
doc: A handheld button remote with a small screen. Button presses arrive as remote.button events; agents can show text on it, ask a question and get the answer from a button press, or wait for the next press.
package: core
builtin: true
license: Apache-2.0
source: https://github.com/Bake-Ware/rook

caps:
  state:
    doc: The remote's buttons (names, which are held), the last presses, the device its buttons are for (target, of targets), its mode (remote, menu or game), what the screen shows, Wi-Fi and hub status.
    risk: read
    scope: local
    idempotent: true
    result: { type: map }
  display:
    doc: Show text on the remote's screen (held upright, 16 lines of 5 characters; newlines split lines, long lines wrap). seconds > 0 goes back to the status screen after that long; 0 keeps it until replaced.
    risk: write
    scope: local
    args:
      text: { type: str, required: true }
      seconds: { type: int, default: 0, min: 0, max: 86400 }
    result: { type: map }
  ask:
    doc: Ask the person holding the remote a question and wait for their answer. The screen shows the prompt and the options; they step through options with the navigation buttons and pick one with OK. Answers {choice, index, button}, or {timeout true} when nobody answered in time.
    risk: write
    scope: local
    args:
      prompt: { type: str, required: true }
      options: { type: list, items: { type: str }, doc: "The choices; blank: Yes and No." }
      timeout: { type: int, default: 60, min: 5, max: 600, doc: Seconds to wait for an answer. }
    result: { type: map }
  wait:
    doc: Wait for the next button press on the remote. Answers {button, action, held_ms}, or {timeout true}. buttons narrows it to those button names.
    risk: read
    scope: local
    args:
      timeout: { type: int, default: 30, min: 1, max: 600, doc: Seconds to wait. }
      buttons: { type: list, items: { type: str } }
    result: { type: map }
  bt:
    doc: The Bluetooth remote paired to this one (most Android TV remotes). Its keys arrive as remote.button events too, with source bt; a key that means what one of this remote's buttons means has that button's name, any other is bt_c<usage> or bt_k<code>. action pair looks for a remote in pairing mode for 30 seconds and bonds with it; forget drops it; blank answers its state (off, idle, pairing, waiting, connected), name and last raw report.
    risk: write
    scope: local
    args:
      action: { type: str, enum: [status, pair, forget], default: status }
      names: { type: map, doc: "What its keys are called, raw key name (bt_c3) to the name it is sent under (up). Replaces the whole list." }
    result: { type: map }
  map:
    doc: Name the buttons and the devices. names lists one name per button, in the order remote.state lists them; blank keeps the current names. targets lists the devices the remote's own menu offers (its input button opens it); the one picked there rides every remote.button event as target.
    risk: write
    scope: self
    effects: [persists]
    args:
      names: { type: list, items: { type: str } }
      targets: { type: list, items: { type: str } }
    result: { type: map }

emits:
  remote.button:
    doc: A button on the remote was pressed (action press) or held down (action long, once while held). Not sent for the input button (it opens the remote's menu), nor while the menu or the game is up.
    payload:
      button: { type: str, required: true, doc: The button's name. }
      action: { type: str, required: true, doc: press or long. }
      index: { type: int, doc: The button's position in remote.state. }
      held_ms: { type: int }
      target: { type: str, doc: The device picked in the remote's menu (an appliance's name). }
      source: { type: str, doc: "bt when the key was pressed on the Bluetooth remote paired to this one." }
