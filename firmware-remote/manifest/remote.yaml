# The Rook remote's own manifest (builtin: implemented in the firmware,
# announced by the device, never pushed). scripts/gen_manifest.py turns it
# into the canonical JSON the firmware embeds and serves from core.manifests;
# the announce carries its hash.
manifest: 1
plugin: remote
version: 0.12.10
title: Rook remote
doc: A handheld button remote with a small screen. Button presses arrive as remote.button events; agents can show text on it, ask a question and get the answer from a button press, or wait for the next press.
package: core
builtin: true
license: Apache-2.0
source: https://github.com/Bake-Ware/rook

caps:
  state:
    doc: "The remote's buttons, the last presses, the device its buttons are for (target), its mode and menu tab, what the screen shows, Wi-Fi and hub status, the network device it drives (local), the IR profile picked and how many it keeps, free memory (heap, heap_block, stack_free: the least the band task's stack has had), the event queue (events_sent, events_queued, events_bytes, events_dropped), the update's state, the firmware's version and build, and its health: reset (why it last started: power_on, software, panic, task_watchdog, brownout...), boots, crashes (starts after a panic or a watchdog) and brownouts (starts after the supply sagged), kept across restarts, battery (not measured: the XIAO C3 has no divider to read it), wifi.tx_dbm (the transmit power in use) and wifi.off (net_off), heap_check and heap_bad (where a heap check first found the heap broken, see remote.map heap_check), oom and throws (failed allocations and C++ exceptions this boot), last_fault (the last of those before the latest restart: out of memory with its size and task, a throw, terminate), and coredump {size, summary} when a crash left one (summary: task, pc, cause, the code addresses on its stack and the build; remote.coredump reads it out)."
    risk: read
    scope: local
    idempotent: true
    result: { type: map }
  display:
    doc: Show text on the remote's screen (held upright, 16 lines of 5 characters; newlines split lines, long lines wrap). seconds > 0 goes back to the status screen after that long; 0 keeps it until replaced.
    risk: write
    scope: local
    args:
      text: { type: str, required: true }
      seconds: { type: int, default: 0, min: 0, max: 86400 }
    result: { type: map }
  chat:
    doc: "The conversation with the house agent on the remote's screen: the last dozen things said, in bubbles (the person's on the right, the agent's on the left, notes bare), scrolled with up and down; it is the remote's menu's Assistant tab, where OK opens the paired remote's microphone like its Assistant key. text adds one, said by who (you: the person, agent, or note), and brings the conversation up; status sets the line under it (Thinking...; blank: none); clear empties it. Answers the conversation as it stands: {messages: [{who, text}]}."
    risk: write
    scope: local
    args:
      who: { type: str, enum: [you, agent, note], default: agent }
      text: { type: str }
      status: { type: str }
      clear: { type: bool, default: false }
    result: { type: map }
  screen:
    doc: "The screen's picture right now: {width, height, rotation (quarter turns clockwise it is shown at), dark (the panel is off), says (the same in words), data}. data is base64 of the panel's own buffer before rotation: one byte for each 8 pixels down a column (lowest bit on top), columns left to right, in bands of 8 rows."
    risk: read
    scope: local
    idempotent: true
    result: { type: map }
  press:
    doc: "Press a key as if on the Bluetooth remote paired to this one (up, down, left, right, ok, back, home, input, vol_up...): it does whatever that key does now, in the menu, the game or the conversation, or goes to the device the remote drives. Wakes the remote."
    risk: write
    scope: local
    args:
      button: { type: str, required: true }
    result: { type: map }
  ask:
    doc: Ask the person holding the remote a question and wait for their answer. The screen shows the prompt and the options; they step through options with the navigation buttons and pick one with OK. Answers {choice, index, button}, or {timeout true} when nobody answered in time.
    risk: write
    scope: local
    args:
      prompt: { type: str, required: true }
      options: { type: list, items: { type: str }, doc: "The choices; blank: Yes and No." }
      timeout: { type: int, default: 60, min: 5, max: 600, doc: Seconds to wait for an answer. }
    result: { type: map }
  wait:
    doc: Wait for the next button press on the remote. Answers {button, action, held_ms}, or {timeout true}. buttons narrows it to those button names.
    risk: read
    scope: local
    args:
      timeout: { type: int, default: 30, min: 1, max: 600, doc: Seconds to wait. }
      buttons: { type: list, items: { type: str } }
    result: { type: map }
  bt:
    doc: "The Bluetooth remotes bonded to this one (most Android TV remotes; up to 3, one connected at a time: another bonded remote that wakes takes over when the one connected has gone to sleep, or, with switch on, once it has been quiet 2 s, the one let go not taken back for 20 s). Keys arrive as remote.button events with source bt: named as this remote's buttons where they mean the same, else bt_c<usage> or bt_k<code>; names renames raw keys (name one settings to make it the gear key). action pair bonds with the first remote heard in pairing mode within 30 s, or with address (from heard); a fourth pushes out the one used least lately. forget drops address, or every remote when address is left out. find makes the connected one beep (level 1-3), quiet stops it. Blank answers state (off, idle, pairing, waiting, connected), name and address (the one connected, else the one used last), bonds (address, name, connected), switch, last_report, pair_error, services, voice, find, and heard (address, name, rssi, pairing) while Settings > Pair BT is open. That list shows the bonded remotes (*) then the others heard; OK bonds with a new one (asking first when it would push one out), the settings key on a bonded one offers Forget. A bridge with nothing bonded bonds by itself with the first HID remote in pairing mode."
    risk: write
    scope: local
    args:
      action: { type: str, enum: [status, pair, forget, find, quiet], default: status }
      level: { type: int, min: 1, max: 3, default: 3 }
      switch: { type: bool, doc: "With more than one remote bonded, keep listening while one is connected so another that wakes takes over at once (off: it takes over once the connected one sleeps). Kept; off by default." }
      address: { type: str, max: 17, doc: "For pair: the remote to bond with (aa:bb:cc:dd:ee:ff, as heard lists it; left out, the first heard in pairing mode). For forget: the one to drop (left out: all)." }
      names: { type: map, doc: "What its keys are called, raw key name (bt_c3) to the name it is sent under (up). Merged into the names kept: each name given adds or replaces that key's, a blank or null one takes that key's name out; keys not given keep theirs." }
    result: { type: map }
  ir:
    doc: "IR from the remote, and the device profiles it keeps. Profiles: each has a name, an icon (tv, projector, speaker, streaming, light, phone, car, game, generic), an optional link to a network device (remote.devices id, name or address) and keys (power, vol_up, vol_down, mute, input, up, down, left, right, ok, back, home, menu, play, pause, rewind, forward, ch_up, ch_down, info, exit, stop, next, prev, 0-9, and any other name the remote reports in remote.button, such as bt_c77: [a-z0-9_], up to 15 characters, up to 32 such a profile), each an action: ir {protocol: nec, address, command} or {raw: [us...], carrier}; lan {lan: true | \"<key>\"} sent to the linked device; cap {cap, worker, args}, carried to the hub in the key's remote.button event (via cap, call); or rook {rook: true}, the press to the hub and nothing else (via rook; hub jobs on remote.button act on it). A key with no action goes to the linked device. The picked profile handles every key of the paired remote, no hub needed. profiles lists them (name, link, link_name, icon, keys, lan_keys, cap_keys, rook_keys, bytes) with selected, icons and limits; profile_save sets name's link (blank: none), icon and keys (null removes one; merge false replaces all); profile_delete, profile_select, profile_release; profile_send does key of name (blank: selected) now. Limits: 8 profiles, 1536 bytes each, 4096 in all, 256 durations a raw code, cap args 240 bytes. pin sets the IR LED GPIO (-1: none); send sends nec (address, command, repeats) or raw at carrier (refused over 500 ms or a mark over 20 ms). Raw IR-over-BLE (onn remote, D343BFC0-...): write code (hex) to char c1-c5, program (start, key, code, finish), suppress keys, clear; events lists IR_KEY_EVENTs of the last 5 s. Every answer has ir_pin."
    risk: write
    scope: local
    args:
      action: { type: str, enum: [status, write, program, suppress, clear, pin, send, profiles, profile_save, profile_delete, profile_select, profile_release, profile_send], default: status }
      char: { type: str, doc: "c1..c5, for write." }
      key: { type: json, doc: "An Android keycode (0..65535), for write and program; a key's name, for profile_send (a named key or any name the remote reports, such as bt_c77)." }
      code: { type: str, max: 2048, doc: "Bytes in hex (spaces and colons are ignored)." }
      keys: { type: json, doc: "Android keycodes (a list), for suppress; for profile_save, a map of key name to {protocol: nec, address, command}, {raw: [...], carrier}, {lan: true | key}, {cap, worker, args}, {rook: true} or null." }
      name: { type: str, max: 20, doc: "A profile's name, for the profile actions." }
      link: { type: str, max: 40, doc: "For profile_save: the network device that keys with no action (and lan actions) go to (blank: none)." }
      merge: { type: bool, default: true, doc: "For profile_save: false replaces the whole profile." }
      list: { type: bool, default: false, doc: "With profile_save, profile_delete, profile_select, profile_release: answer the whole profiles listing too (else just the profile changed, profiles, bytes, bytes_max)." }
      icon: { type: str, max: 20, doc: "For profile_save: the profile's picture, tv, projector, speaker, streaming, light, phone, car, game or generic (blank: none, shown as generic; left out: as it was)." }
      pin: { type: int, min: -1, max: 48, doc: "The IR LED's GPIO, for pin (-1: none)." }
      protocol: { type: str, enum: [nec], doc: For send. }
      address: { type: int, min: 0, max: 65535, doc: "The NEC address (over 255: extended)." }
      command: { type: int, min: 0, max: 255, doc: The NEC command. }
      repeats: { type: int, min: 0, max: 4, default: 0, doc: "NEC repeat frames after the first, for send and profile_send." }
      raw: { type: list, max: 1024, items: { type: int }, doc: "Microsecond durations, mark first, for send." }
      carrier: { type: int, min: 20000, max: 100000, default: 38000, doc: "The carrier in Hz, for raw." }
    result: { type: map }
  wifi:
    doc: "The Wi-Fi networks the remote knows, in the order it tries them (each heard, first to last, round again when all fail; names match in any case). Blank lists them and the one in use; add saves ssid with password at the top; forget drops ssid; prefer moves a saved network to the top. The remote's own Wi-Fi menu does the same (OK joins; the settings key offers Join, Move up, Move down, Forget)."
    risk: write
    scope: self
    args:
      action: { type: str, enum: [list, add, forget], default: list }
      ssid: { type: str }
      password: { type: str }
      prefer: { type: str, doc: A saved network's name to move to the top of the list (joined first from now on). }
    result: { type: map }
  map:
    doc: "Name the buttons and the devices, and say how soon the remote rests. names: one per button, in remote.state's order (blank keeps the name). targets: the hub's names for the devices its keys are for; the one picked rides remote.button as target while no profile is picked. screen_off and sleep are also set on the remote in Settings > Sleep."
    risk: write
    scope: self
    effects: [persists]
    args:
      names: { type: list, items: { type: str } }
      targets: { type: list, items: { type: str } }
      screen_off: { type: int, min: 0, max: 86400, doc: "Seconds left alone before the screen goes dark (30; 0: never)." }
      net_off: { type: bool, doc: "Turn the remote's Wi-Fi off for good (IR only: the keys keep sending their IR codes; no hub, no band, no updates) or back on. Turning it off over the band is the last thing the hub hears until it is turned on again on the remote (Settings > Wi-Fi). Kept." }
      heap_check: { type: bool, doc: "Check the whole heap at a few places (band sends and reads, Bluetooth, the main loop, Wi-Fi off) and keep where it is first found broken: remote.state heap_bad, kept across the restart. A few ms each; for hunting a corruption. Kept." }
      tz: { type: str, max: 64, doc: "The remote's time zone for its clock, as POSIX TZ (CST6CDT,M3.2.0,M11.1.0 for US Central); blank: UTC." }
      sleep: { type: int, min: 0, max: 86400, doc: "Seconds left alone before the remote sleeps: Wi-Fi off, so the hub cannot reach it until a key wakes it (300; 0: never)." }
    result: { type: map }

  scan:
    doc: Look for devices on the Wi-Fi network the remote has joined (SSDP and mDNS, about 15 seconds) and answer what it found. Each device has an id (its MAC address when known), name, model, address, the kinds it answered as (roku, webos, cast, androidtv, airplay, dial, samsung, wled...), the driver the remote has for it (roku or webos; blank when it can only be seen), what that driver supports, and whether it is paired. The remote also scans on its own a few seconds after joining a network.
    risk: read
    scope: external
    result: { type: map }
  devices:
    doc: What the last scan found, without scanning again, and the device the remote's buttons are driving now (selected), if any; with the IR profiles the remote keeps (profiles; remote.ir) and the one its buttons are for (selected_profile).
    risk: read
    scope: local
    idempotent: true
    result: { type: map }
  device:
    doc: Act on a device the scan found, straight from the remote over the local network, no hub in between. device is its id, name or address. action key presses key (up, down, left, right, ok, back, home, menu, vol_up, vol_down, mute, play, pause, rewind, forward, power, or the device's own key name in its own spelling); launch starts app (youtube, netflix, prime, disney, hulu, appletv, plex, or the device's own app id; a Roku also takes an app's name); power turns it off, or wakes it when it is off; pair has an LG TV show its prompt and waits a minute for someone to accept (a Roku needs none); forget drops the pairing; select makes the remote's own buttons drive this device from now on, and release hands them back to the hub's target.
    risk: write
    scope: external
    args:
      device: { type: str, required: true }
      action: { type: str, enum: [key, launch, power, pair, forget, select, release], default: key }
      key: { type: str }
      app: { type: str }
    result: { type: map }
  update:
    doc: "Update the firmware over the air: url (http or https) and sha256 of the build; the remote downloads it into its spare slot, checks the hash, answers started and restarts into it. A stalled or broken download is resumed (Range) up to 5 tries, Bluetooth scanning paused. The new build is kept once it has settled (Wi-Fi, and on a bridge its bonded remote back) or reached the hub; else after five minutes it goes back. Settings > Update reads http://rook.bakeforge.com/firmware/latest-<board>.json itself and asks the hub (remote.update.check) only when it can't. Blank answers version, build, state (idle, checking, newest, downloading, failed, restarting), trial, and after a download tries, heap_min, failed_heap, failed_block."
    risk: exec
    scope: self
    args:
      url: { type: str }
      sha256: { type: str }
    result: { type: map }

  coredump:
    doc: "The core dump the last crash left in the remote's coredump partition (ESP-IDF ELF format; remote.state's coredump has its size and a summary). Answers length bytes of it from offset as base64 data, with size (0: there is none); read it piece by piece, then erase it with erase true (answers erased)."
    risk: write
    scope: self
    args:
      offset: { type: int, min: 0, max: 1048576, default: 0 }
      length: { type: int, min: 1, max: 3072, default: 1536, doc: "Bytes in this piece (base64 makes it a third bigger)." }
      erase: { type: bool, default: false }
    result: { type: map }
emits:
  remote.update.check:
    doc: Someone picked Update in the remote's menu and the remote could not read the update feed itself (feed_error says why). The hub's remote-update plugin answers over the band, with remote.update when it holds a newer build for this board.
    payload:
      worker: { type: str, required: true, doc: This remote's name. }
      version: { type: str, required: true, doc: The firmware it runs. }
      board: { type: str, required: true, doc: "bridge-c3, s3 or gamepad-s3: which build it takes." }
      build: { type: str, doc: "The build's three-word moniker." }
      feed_error: { type: str, doc: Why the update feed could not be read. }
  remote.voice:
    doc: Someone finished saying something into the microphone of the Bluetooth remote paired to this one (its Assistant key). The audio came before it, in parts remote.voice.part events with the same id.
    payload:
      id: { type: str, required: true }
      parts: { type: int, required: true, doc: How many remote.voice.part events carried it. }
      bytes: { type: int }
      codec: { type: str, doc: "adpcm8k or adpcm16k: Google's voice-over-BLE frames (ATVV) of IMA ADPCM, mono." }
      worker: { type: str, doc: This remote's name. }
      ms: { type: int, doc: How long the microphone was open. }
  remote.voice.part:
    doc: A piece of what is being said (see remote.voice).
    payload:
      id: { type: str, required: true }
      seq: { type: int, required: true }
      data: { type: str, required: true, doc: "Base64 of the audio bytes the remote sent, in order." }
  remote.button:
    doc: "A button was pressed (press) or held (long). Not sent for the key that opens the menu (input; Guide on the bridge), the profile key, or while the menu or a game is up. A press the hub acts on (via cap or rook, or no profile picked) is sent at once on its own, and dropped if it cannot go within 2 s (remote.state presses_dropped); others come in batches."
    payload:
      button: { type: str, required: true, doc: The button's name. }
      action: { type: str, required: true, doc: press or long. }
      index: { type: int, doc: The button's position in remote.state. }
      held_ms: { type: int }
      target: { type: str, doc: The device picked in the remote's menu (an appliance's name). }
      source: { type: str, doc: "bt when the key was pressed on the Bluetooth remote paired to this one." }
      local: { type: bool, doc: "true when target is a profile or a device on the remote's own network that the remote dispatched the key to itself (remote.ir profiles, remote.device select)." }
      profile: { type: str, doc: "The profile picked, when the key went through one." }
      via: { type: str, doc: "What the key did: ir (a code sent), lan (a key sent to a network device), cap (call carries the profile's cap action; the remote did nothing itself), rook (the press is for the hub's jobs; nothing else)." }
      call: { type: map, doc: "With via cap: the profile's cap action for this key, {cap, worker, args}, for the hub to make (a worker cannot start a call)." }
