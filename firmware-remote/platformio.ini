; Rook remote: Seeed XIAO ESP32-S3 + PCF8574 (buttons) + SSD1306 128x32.
; Build:  pio run          Flash: pio run -t upload
; After editing manifest/remote.yaml: python3 scripts/gen_manifest.py
[env:remote]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_USE_DOUBLE=1
    -DARDUINOJSON_USE_LONG_LONG=1
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.0
    h2zero/NimBLE-Arduino@~1.4.3

; The bridge: a XIAO ESP32-C3 with a 128x64 OLED and no buttons of its own.
; It hosts a Bluetooth remote (it looks for one to pair until it has one) and
; puts its keys on the band.   Build: pio run -e bridge
[env:bridge]
extends = env:remote
board = seeed_xiao_esp32c3
build_flags =
    ${env:remote.build_flags}
    -DROOK_BRIDGE=1
