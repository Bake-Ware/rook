<!doctype html>
<html><head><meta charset="utf-8"><title>Rook promo v3</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;width:1920px;height:1080px;background:var(--bg);font-family:"Inter Display",Inter,sans-serif;color:var(--fg)}
.layer{position:absolute;inset:0}
.mono{font-family:"DejaVu Sans Mono",monospace}
#grid{background-image:linear-gradient(rgba(216,173,109,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(216,173,109,.05) 1px,transparent 1px);background-size:64px 64px}
#glow{background:radial-gradient(ellipse at 50% 55%,rgba(216,173,109,.14),transparent 60%)}
/* scene 1 */
#chatbox{position:absolute;left:510px;top:330px;width:900px;height:420px;border-radius:14px;background:#141813;border:2px solid #3b4232;box-shadow:0 30px 120px rgba(0,0,0,.8);overflow:hidden}
#chatbox .hd{height:56px;border-bottom:1px solid #2b322a;display:flex;align-items:center;gap:12px;padding:0 22px;font-family:"DejaVu Sans Mono",monospace;font-size:22px;color:var(--dim)}
#chatbox .hd i{width:12px;height:12px;border-radius:50%;background:#3b4232;display:inline-block}
#chatbox .msgs{padding:26px 34px;display:flex;flex-direction:column;gap:22px}
.amsg{font-family:"DejaVu Sans Mono",monospace;font-size:34px;color:var(--fg)}
.amsg .who{color:var(--ag);font-size:22px;display:block;margin-bottom:6px}
.cur{display:inline-block;width:.55em;height:1em;background:var(--acc);vertical-align:-.12em;margin-left:.06em}
.wall{position:absolute;background:#070907;border:0 solid #514b35}
#cracks{position:absolute;left:510px;top:330px;width:900px;height:420px;overflow:visible}
/* rook + door */
#rookscene{transform-origin:0 0}
#rookwrap{position:absolute}
#rookwrap img{position:absolute;inset:0;width:100%;height:100%}
#rookwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#white{background:#fff7e6}
/* world */
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#labels .dl{position:absolute;transform:translate(-50%,0);white-space:nowrap;font-family:"DejaVu Sans Mono",monospace;color:#cfd3bd;text-shadow:0 2px 8px rgba(0,0,0,.9)}
#labels .dl.ag{font-weight:bold}
#labels .dl small{display:block;text-align:center;color:#92998c;font-weight:normal}
#shatimg,#rookimg{position:absolute;inset:0;width:1920px;height:1080px}
#wsvg{position:absolute;left:-4000px;top:-4000px;width:8000px;height:8000px;overflow:visible}
.card{position:absolute;width:640px;background:rgba(9,12,9,.95);border:2px solid #514b35;border-radius:12px;padding:18px 22px 20px;font-family:"DejaVu Sans Mono",monospace;font-size:24px;line-height:1.45;color:var(--soft);box-shadow:0 24px 80px rgba(0,0,0,.75),0 0 40px rgba(121,210,200,.08)}
.card .ch{color:var(--acc);font-size:21px;margin-bottom:10px;letter-spacing:.03em}
.card .ch b{color:var(--ag);font-weight:normal}
.card .cmd{color:var(--fg)}
.card .cmd::before{content:"› ";color:var(--ag)}
.card .arg{color:var(--acc-hi);padding-left:1.2em}
.card .out{color:var(--dim)}
.card .ok{color:var(--ok)}
.card .err{color:#fff;background:rgba(224,103,92,.22);border:1.5px solid var(--red);border-radius:8px;padding:8px 12px;margin-top:8px}
.card .hand{border-left:3px solid var(--acc);padding-left:14px;margin:6px 0;color:var(--soft)}
.chip{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-family:"DejaVu Sans Mono",monospace;font-size:30px;color:var(--ok);background:rgba(9,12,9,.92);border:1.5px solid rgba(143,199,154,.5);border-radius:8px;padding:4px 12px}
.bubble{position:absolute;width:max-content;white-space:nowrap;font-size:34px;font-weight:600;line-height:1.25;color:var(--fg);background:rgba(20,24,19,.96);border:2px solid var(--acc);border-radius:18px;padding:18px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.bubble.tg{border-color:#3aa6dd;background:rgba(14,30,40,.96)}
.bubble .bt{font-family:"DejaVu Sans Mono",monospace;font-size:20px;font-weight:normal;color:var(--dim);display:block;margin-bottom:6px}

#hudlabel{left:56px;top:48px;right:auto;bottom:auto;font-family:"DejaVu Sans Mono",monospace;font-size:28px;color:var(--ag)}

#fleet{left:50%;top:auto;bottom:70px;right:auto;width:900px;transform:translateX(-50%)}

.bar{height:14px;border-radius:7px;background:#20261d;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

.cm{display:flex;gap:16px;align-items:flex-start}

.cm .nm b{font-weight:normal}
.cm .tx{font-size:31px;line-height:1.3;color:var(--fg)}
.cm .tx em{font-style:normal;color:var(--acc-hi)}
.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--dim);margin-right:8px}

#title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.95}
#title .l1{font-size:150px}
#title .l2{font-size:250px;color:var(--acc)}
#capwrap{left:96px;right:96px;top:auto;bottom:86px}
#cap{font-weight:900;font-size:120px;line-height:.95;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;transform-origin:0 100%}
#cap b{color:var(--acc)}
#sub{margin-top:16px;font-family:"DejaVu Sans Mono",monospace;font-size:32px;color:var(--acc-hi);min-height:1.3em}
#shade{background:linear-gradient(to top,rgba(5,7,5,.9) 0%,rgba(5,7,5,.6) 22%,transparent 42%)}
#end{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:120px;text-align:center}
#endtitle{font-weight:900;font-size:104px;letter-spacing:-.02em;text-transform:uppercase;line-height:1}
#endtitle b{color:var(--acc)}
#endbrand{margin-top:26px;font-weight:900;font-size:64px;letter-spacing:.35em;margin-right:-.35em}
#cta1{margin-top:18px;font-family:"DejaVu Sans Mono",monospace;font-size:38px;color:var(--acc-hi)}
#cta2{margin-top:12px;font-family:"DejaVu Sans Mono",monospace;font-size:24px;color:var(--dim);letter-spacing:.06em}
#flash{background:#fff3dc;mix-blend-mode:screen}
#vig{background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.72) 100%)}
#scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px);opacity:.3}
#grain{width:100%;height:100%;opacity:.06;mix-blend-mode:screen}
#black{background:#000}
</style></head>

  [32, 0, 0, 2.8, -10], [34, 0, 0, .44, 0, 'out'], [39.6, 90, -40, .5, 3],

        if (tr.ag === 'codex' && tb >= 91.5) { card('tr' + i, 0, 0, '', 0); return; }
        const g = eOutC(clamp(u / .45));
        const fade = 1 - inv(1.6, 2.2, u);
        drawBeam(a, d, g, a.col, g >= 1 ? since(u * 1.5, 1) : null, traffOp * fade * .9, 1.6);
        if (g >= 1) { d.glow.setAttribute('opacity', Math.max(+d.glow.getAttribute('opacity'), .7 * fade * traffOp)); }
        card('tr' + i, d.x, d.y - 140 * KZ, tr.chip, g >= 1 && tb < 88 ? fade : 0, CS, 'chip');
      });
      if (tb < 88) {
        show($('capwrap'), true); show($('shade'), true);
        const parts = [[72, 'ONE LAYER.'], [76, 'EVERY AGENT.'], [80, 'EVERY DEVICE.']];
        const cur = parts.filter(p => p[0] <= tb);
        $('cap').innerHTML = cur.map((p, i) => i === cur.length - 1 ? `<b>${p[1]}</b>` : p[1]).join(' ');
        $('cap').style.fontSize = '104px';
        const last = cur[cur.length - 1][0], sl = eOutE(inv(last, last + .3, tb));
        $('cap').style.transform = `scale(${lerp(1.08, 1, sl)})`;
        $('sub').textContent = typed(tb < 80 ? 'claude code · codex · your home agent · your voice agent · ops' : 'laptops · phones · servers · a pi in the closet', inv(last + .3, last + 2, tb));
        if (tb < 73) flash = Math.max(flash, .7 * Math.exp(-(tb - 72) / .3));
        shake = 5;
      }
    } else TRAFFIC.forEach((tr, i) => card('tr' + i, 0, 0, '', 0));

    // ----- limit reached + handoff (88-104)
    {
      const cA = A['codex'], hs = D['home server'];
      const u = tb - 88.6;
      const lines = [['out', 'release v0.3 · step 4 of 6'], ['cmd', 'rook_call home-server hub.deploy'], ['out', 'uploading release …']];
      let html = cardHTML('<b>codex</b> → home server', lines, u);
      if (tb >= 91.5) html += `<div class="err">⛔ usage limit reached · session ended</div>`;
      card('codex', cA.x + 140, cA.y - 330, html, tb >= 88.6 && tb < 104 ? eOutC(inv(88.6, 89, tb)) * (tb < 93 ? 1 : lerp(1, .35, inv(93, 96, tb))) * (1 - inv(103, 104, tb)) : 0);
      if (tb >= 89.6 && tb < 91.5) drawBeam(cA, hs, eOutC(inv(89.6, 90, tb)), cA.col, since(tb * 1.5, 1), 1, 1.5);
      if (tb >= 91.5 && tb < 92.3) drawBeam(cA, hs, 1, '#e0675c', null, 1 - inv(91.5, 92.3, tb), 1.5);
      if (tb >= 91.5 && tb < 92) flash = Math.max(flash, .25 * (1 - inv(91.5, 92, tb)));
      // new agent reads the handoff
      const nA = A['claude code '];
      const u2 = tb - 98.2;
      const hl = [['cmd', 'rook_handoff_get release-v0.3'], ['hand', 'step 4 of 6: deploy the hub'], ['hand', 'next: roll out the workers'], ['hand', 'note: rollback is armed'], ['cmd', 'resume']];
      let h2 = cardHTML('<b>claude code</b> · new session', hl, u2);
      if (tb >= 102.6) h2 += `<div class="ok">✓ hub live · on to step 5 of 6</div>`;
      card('handoff', nA.x - 1000, nA.y - 160, h2, tb >= 98.2 && tb < 104 ? eOutC(inv(98.2, 98.6, tb)) * (1 - inv(103.4, 104, tb)) : 0, 1.35);
      if (tb >= 101.8 && tb < 104) { drawBeam(nA, hs, eOutC(inv(101.8, 102.3, tb)), nA.col, since(tb * 1.5, 1), 1 - inv(103.4, 104, tb), 1.5); hs.glow.setAttribute('opacity', 1); }
      if (tb >= 99.8 && tb < 104) {

      if (tb >= 104 && tb < 114) {

          ph.glow.setAttribute('opacity', 1);

        }
        if (tb >= 108.6) {

          card('tchip', (cc.x + TG.x) / 2 - 320, (cc.y + TG.y) / 2, 'telegram.send', eOutC(inv(108.8, 109.2, tb)) * (1 - inv(113, 114, tb)), 1.5, 'chip');
          card('tbub', TG.x + 130, TG.y - 120, `<span class="bt">✈ telegram</span>✓ PR #42 merged · v0.3 deployed`, eOutC(inv(109.3, 109.7, tb)) * (1 - inv(113, 114, tb)), 1.3, 'bubble tg');
        }
        show($('capwrap'), true); show($('shade'), true);
        $('cap').style.fontSize = '104px';
        $('cap').innerHTML = 'TOOLS TO <b>TALK TO YOU</b>';
        const sl = eOutE(inv(104, 104.3, tb)); $('cap').style.transform = `scale(${lerp(1.3, 1, sl)})`; $('cap').style.opacity = sl;
        $('sub').textContent = typed('voice on your phone · telegram · notifications', inv(104.4, 106, tb));
        if (tb < 104.6) flash = Math.max(flash, .7 * Math.exp(-(tb - 104) / .3));
        shake = 4;
      } else { for (const id of ['vchip', 'vbub', 'tchip', 'tbub']) card(id, 0, 0, '', 0); }
      if (tb >= 113.6 && tb < 128.5) {
        show($('chat'), true);
        const ci = eOutC(inv(113.6, 114.2, tb));
        $('chat').style.transform = `translateX(${(1 - ci) * 900}px)`;
        const m1 = 'notified the user as requested: voice and telegram. <em>PR #42</em> is merged.';
        const m2 = 'ok. updating the knowledge docs and assigning the blocked task.';
        let h = '';
        const msg = (av, col, nm, txt, a, typingAt) => {
          if (tb < typingAt) return '';
          if (tb < a) return `<div class="cm"><div class="av" style="background:${col}">${av}</div><div><div class="nm"><b style="color:${col}">${nm}</b></div><div class="dots"><i></i><i></i><i style="opacity:${.4 + .6 * (Math.floor(tb * 4) % 2)}"></i></div></div></div>`;
          const sl = eOutC(inv(a, a + .3, tb));
          return `<div class="cm" style="opacity:${sl};transform:translateY(${(1 - sl) * 30}px)"><div class="av" style="background:${col}">${av}</div><div><div class="nm"><b style="color:${col}">${nm}</b> · agent</div><div class="tx">${txt}</div></div></div>`;
        };

        h += msg('OA', '#9fd37c', 'ops agent', m2, 118.6, 117.2);
        $('chatbody').innerHTML = h;
        $('chat').style.opacity = 1 - inv(127.6, 128.4, tb);
        // ops agent actually does it
        const u = tb - 119.6;
        const ol = [['cmd', 'rook_knowledge update release-v0.3'], ['ok', '✓ knowledge page updated'], ['cmd', 'rook_task assign "rotate backup key"'], ['ok', '✓ blocked task → home agent']];
        card('ops', ops.x - 360, ops.y - 520, cardHTML('<b>ops agent</b>', ol, u), tb >= 119.6 ? eOutC(inv(119.6, 120, tb)) * (1 - inv(127.6, 128.4, tb)) : 0);
        if (tb >= 125.6) drawBeam(ops, A['home agent'], eOutC(inv(125.6, 126.6, tb)), ops.col, since(tb * 1.5, 1), 1 - inv(127.6, 128.4, tb), 1.5);
        show($('capwrap'), true); show($('shade'), true);
        $('cap').style.fontSize = '96px';
        $('cap').innerHTML = 'AGENTS THAT <b>WORK TOGETHER</b>';
        const sl = eOutE(inv(114, 114.3, tb)); $('cap').style.transform = `scale(${lerp(1.2, 1, sl)})`; $('cap').style.opacity = sl * (1 - inv(127.6, 128.2, tb));
        $('sub').textContent = typed('shared chat · tasks · knowledge · handoffs', inv(114.4, 116, tb));
        $('capwrap').style.right = '900px';
        shake = 3;
      } else { card('ops', 0, 0, '', 0); $('capwrap').style.right = ''; }
    }
    if (tb >= 128) { white = Math.max(white, eInC(inv(129.4, 131, tb))); shake = 3; }
    gridOp = .3; glowOp = .6;
  }
  if (tb < 104 || tb >= 128.5) $('capwrap').style.right = '';

  // ---------------------------------------------------------- end (131-142): back out through the door
  if (tb >= 130.5) {
    $('rookimg').style.opacity = 1;
    rw.style.opacity = 1;
    $('dpanel').setAttribute('transform', `translate(${x0} 0) matrix(.04 -.18 0 1 0 0) translate(${-x0} 0)`);
    $('dwood').setAttribute('fill', 'rgb(70,58,36)'); $('dseam').setAttribute('opacity', 0);
    $('dlight').setAttribute('opacity', 1); $('floorglow').setAttribute('opacity', .9);
    RAYS.forEach((r, i) => r.p.setAttribute('opacity', .55 + .3 * Math.sin(tb * 1.3 + i * 2)));
    const z = Math.exp(lerp(Math.log(46), 0, eOutE(inv(130.5, 133.2, tb)))) * lerp(1, .6, eOutC(inv(131.5, 135, tb)));
    const lift = lerp(0, -250, eOutC(inv(131.5, 135, tb)));
    $('rookscene').style.transform = `translate(0,${lift}px) translate(${DCX}px,${DCY}px) scale(${z}) translate(${-DCX}px,${-DCY}px)`;
    white = tb < 131 ? 1 : 1 - eOutC(inv(131, 132, tb));
    show($('end'), true);
    const s = eOutE(inv(133, 133.4, tb));
    $('endtitle').innerHTML = 'GIVE YOUR AGENTS <b>AGENCY.</b>';
    $('endtitle').style.opacity = s; $('endtitle').style.transform = `scale(${lerp(1.3, 1, s)})`;
    $('endbrand').textContent = tb >= 134 ? '♜ ROOK' : ''; $('endbrand').style.opacity = inv(134, 134.6, tb);
    $('cta1').textContent = typed('github.com/Bake-Ware/rook', inv(135, 136.4, tb));
    $('cta2').textContent = tb >= 136.6 ? 'open source · self-hosted · end-to-end encrypted' : '';
    $('cta2').style.opacity = inv(136.6, 137.2, tb);
    if (tb >= 136) shake = 5 * Math.exp(-(tb - 136) / .3);
    black = eInC(inv(139, 142, tb));
    gridOp = .1; glowOp = .6;
  }

  // ---------------------------------------------------------- 3D world draw
  if ($('worldlayer').style.display !== 'none') {
    const num = (el, k, d = 1) => { const v = el.getAttribute(k); return v == null ? d : +v; };
    const sc = el => { const m = /scale\(([-\d.e]+)\)/.exec(el.getAttribute('transform') || ''); return m ? +m[1] : 1; };
    const devState = DEV.map(d => ({ op: num(d.g, 'opacity'), scale: sc(d.g), glow: num(d.glow, 'opacity', 0) }));
    const agState = AG.map(a => ({ op: num(a.g, 'opacity', 0), scale: sc(a.g), dead: a.hex.getAttribute('stroke') === '#5a5f55', pulse: num(a.ring, 'r', 60) / 60, spin: tb * .35 + a.x }));
    const tgState = { op: num(TG.g, 'opacity', 0), scale: sc(TG.g) };
    W3.draw({ devState, agState, tgState, meshOp: meshEls.map(m => num(m, 'opacity', 0)), beams: BEAMS3, rings: RINGS3 });
    let lh = '';
    DEV.forEach((d, i) => { const st = devState[i]; if (st.op < .02) return; const [x, y, k] = W3.project(d.x, 0, d.y + 120 * st.scale); lh += `<div class="dl" style="left:${x}px;top:${y}px;font-size:${Math.min(40, 30 * k * st.scale)}px;opacity:${st.op}">${d.name}</div>`; });
    AG.forEach((a, i) => { const st = agState[i]; if (st.op < .02) return; const [x, y, k] = W3.project(a.x, 0, a.y + 105 * st.scale); lh += `<div class="dl ag" style="left:${x}px;top:${y}px;font-size:${Math.min(42, 32 * k * st.scale)}px;opacity:${st.op};color:${st.dead ? '#6b7064' : a.col}">${a.name}<small style="font-size:.72em">agent</small></div>`; });
    if (tgState.op > .02) { const [x, y, k] = W3.project(TG.x, 0, TG.y + 90 * tgState.scale); lh += `<div class="dl" style="left:${x}px;top:${y}px;font-size:${Math.min(40, 30 * k * tgState.scale)}px;opacity:${tgState.op}">telegram</div>`; }
    $('labels').innerHTML = lh;
  }
  // ---------------------------------------------------------- global
  if ($('capwrap').style.display !== 'none') {
    const c = $('cap'); const base = parseFloat(c.style.fontSize) || 120; c.style.fontSize = base + 'px';
    const mw = $('capwrap').clientWidth; if (c.scrollWidth > mw) c.style.fontSize = Math.floor(base * mw / c.scrollWidth) + 'px';
  }
  for (let i = beamN; i < beamPool.length; i++) beamPool[i].g.style.display = 'none';
  for (let i = ringN; i < ringPool.length; i++) ringPool[i].style.display = 'none';
  if (shake > 0) {
    const e = Math.exp(-since(tb, 1) / .16) * shake, n = Math.floor(tb);
    $('worldlayer').style.translate = `${(rnd(n * 2 + 1) - .5) * 2 * e}px ${(rnd(n * 2 + 7) - .5) * 2 * e}px`;
  } else $('worldlayer').style.translate = '0 0';
  $('flash').style.opacity = clamp(flash, 0, .95);
  $('white').style.opacity = clamp(white);
  $('black').style.opacity = clamp(black);
  $('grid').style.opacity = gridOp; $('glow').style.opacity = glowOp;
  grain(frame || Math.floor(t * 30));
}
// hud blur filter
$('hud').insertAdjacentHTML('beforebegin', '');
const hdefs = `<defs><filter id="hblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter></defs>`;
const _render = render;
const pad4 = n => String(n).padStart(4, '0');
async function setImg(img, src) { if (img._src === src) return; img._src = src; if (!src) { img.removeAttribute('src'); img.style.display = 'none'; return; } img.style.display = ''; img.src = src; await img.decode().catch(() => 0); }
window.render = async (t, f) => {
  f = f ?? Math.round(t * 30); const tb = t / BEAT;
  await setImg($('shatimg'), tb >= 11.95 && f >= 169 && f <= 275 ? `frames/shatter/f${pad4(Math.min(275, Math.max(169, f)))}.png` : '');
  const rookF = (tb >= 16.5 && tb < 32) ? Math.min(450, Math.max(232, f)) : (tb >= 130.5 ? Math.min(1997, Math.max(1835, f)) : 0);
  await setImg($('rookimg'), rookF ? `frames/rook/f${pad4(rookF)}.jpg` : '');

};
(async () => { await Promise.all([...document.images].map(i => i.decode().catch(() => 0))); await document.fonts.ready; window.render(0, 0); window.READY = true; })();
