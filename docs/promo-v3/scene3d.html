    const polys = (r1 > 300) ? [[poly[0], poly[1], poly[1].clone().lerp(poly[2], .5), poly[0].clone().lerp(poly[3], .5)], [poly[0].clone().lerp(poly[3], .5), poly[1].clone().lerp(poly[2], .5), poly[2], poly[3]]] : [poly];
    for (const p0 of polys) {
      let c = clip(p0); if (c.length < 3) continue;
      const cx = c.reduce((s, p) => s + p.x, 0) / c.length, cy = c.reduce((s, p) => s + p.y, 0) / c.length;
      const shape = new THREE.Shape(c.map(p => new THREE.Vector2(p.x - cx, p.y - cy)));
      const g = new THREE.ExtrudeGeometry(shape, { depth: 6, bevelEnabled: false });
      const uv = g.getAttribute('uv'), pos = g.getAttribute('position');
      for (let k = 0; k < pos.count; k++) uv.setXY(k, (pos.getX(k) + cx) / BW, (pos.getY(k) + cy) / BH);
      g.translate(0, 0, -6);
      const m = new THREE.Mesh(g, [shardMat, sideMat]); m.position.set(X0 + cx, Y0 + cy, 0); m.visible = false; scene.add(m);
      const n = shards.length, dir = new THREE.Vector2(cx - IMP.x, cy - IMP.y), dist = dir.length(); dir.normalize();
      shards.push({ m, cx: X0 + cx, cy: Y0 + cy, dir, dist, sp: 350 + rnd(n) * 700 - dist * .2, vz: 300 + rnd(n + 9) * 1500 * Math.exp(-dist / 500), ax: new THREE.Vector3(rnd(n + 1) - .5, rnd(n + 2) - .5, rnd(n + 3) - .5).normalize(), w: (rnd(n + 4) - .5) * 14, delay: dist / 2600 });
    }
  }
  setTime = (tb) => {
    const s = (tb - 16) * BEAT; // seconds after the break
    crackMat.uniforms.uT.value = tb;
    const shake = tb > 13.6 && tb < 16 ? Math.exp(-((tb - 13.6) % .5) / .08) * 3 : 0;
    camera.position.set((rnd(Math.floor(tb * 8)) - .5) * shake, (rnd(Math.floor(tb * 8) + 3) - .5) * shake, CZ); camera.lookAt(0, 0, 0);
    if (s < 0) { pane.visible = true; cracks.visible = true; shards.forEach(x => x.m.visible = false); flashL.intensity = 0; }
    else {
      pane.visible = false; cracks.visible = false;
      flashL.position.set(X0 + IMP.x, Y0 + IMP.y, 300); flashL.intensity = 3 * Math.exp(-s / .25);
      shards.forEach(x => {
        const t = Math.max(0, s - x.delay); x.m.visible = true;
        const sp = x.sp * (1 - Math.exp(-t * 3)) / 3 * 3;
        x.m.position.set(x.cx + x.dir.x * sp * t * .9, x.cy + x.dir.y * sp * t * .9 - 520 * t * t, x.vz * t * (1 - .25 * t));
        x.m.setRotationFromAxisAngle(x.ax, x.w * t * .35);
        const fade = 1 - inv(1.2, 1.7, s);
        x.m.visible = fade > 0;
        x.m.scale.setScalar(1);
      });
    }
    renderer.render(scene, camera);
  };
}
window.setTime = setTime;
window.READY = true;
</script>
