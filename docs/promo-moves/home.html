<!doctype html>
<!-- Rook Moves review: every clip with its latest render, its notes for Claude, and links into the director. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rook Moves</title>
<style>
@font-face{font-family:'Inter Display';src:url(fonts/InterDisplay-Black.otf);font-weight:900}
@font-face{font-family:'Inter Display';src:url(fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:'Inter Display';src:url(fonts/InterDisplay-Regular.otf);font-weight:400}
@font-face{font-family:'DejaVu Sans Mono';src:url(fonts/DejaVuSansMono.ttf);font-weight:400}
:root{--bg:#0e110e;--panel:#151a14;--panel2:#1b2119;--fg:#e2e3d9;--soft:#cfd3bd;--dim:#92998c;--acc:#d8ad6d;--hi:#f0c98c;--ok:#8fc79a;
  --line:#2b322a;--edge:#514b35;--mono:'DejaVu Sans Mono',monospace;--sans:'Inter Display',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);padding:40px 16px 80px}
main{max-width:1180px;margin:0 auto}
header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:8px}
h1{font:900 44px/1 var(--sans);letter-spacing:-.02em;text-transform:uppercase}
h1 b{color:var(--hi)}
.sub{color:var(--dim);font:400 14px var(--mono);margin-bottom:32px}
.sum{color:var(--soft);font:400 14px var(--mono);margin-left:auto}
.clip{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
@media (max-width:820px){.clip{grid-template-columns:1fr}}
.media{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media button{position:absolute;inset:0;background:transparent;border:0;cursor:pointer}
.media button::after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;
  background:rgba(9,12,9,.75);border:1.5px solid var(--hi);color:var(--hi);font-size:24px;line-height:61px;text-align:center;padding-left:4px}
.media .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font:400 14px var(--mono)}
.num{font:400 13px var(--mono);color:var(--acc);letter-spacing:.15em}
h2{font:600 26px/1.15 var(--sans);margin:2px 0 4px}
.tag{color:var(--soft);font-style:normal}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.chip{font:400 12.5px var(--mono);color:var(--soft);border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px}
.chip.warn{border-color:var(--edge);color:var(--hi)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
a.btn,button.btn{font:400 13.5px var(--mono);color:var(--fg);background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:6px 12px;text-decoration:none;cursor:pointer}
a.btn:hover,button.btn:hover{border-color:var(--hi);color:var(--hi)}
h3{font:400 12.5px var(--mono);color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin:6px 0 8px}
.notes{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.notes li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.notes a.t{font:400 13px var(--mono);color:var(--hi);text-decoration:none;white-space:nowrap;padding-top:1px}
.notes a.t:hover{text-decoration:underline}
.notes .x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1}
.notes .x:hover{color:#e0675c}
.notes .txt{white-space:pre-wrap;color:var(--soft)}
.empty{color:var(--dim);font:400 13px var(--mono);margin-bottom:14px}
textarea{width:100%;min-height:64px;resize:vertical;font:400 15px/1.45 var(--sans);color:var(--fg);background:#101410;border:1px solid var(--edge);border-radius:8px;padding:8px 10px}
textarea:focus{outline:none;border-color:var(--hi)}
.saved{font:400 12px var(--mono);color:var(--ok);height:16px;margin-top:4px}
</style></head>
<body><main>
<header><h1>Rook <b>Moves</b></h1><span class="sum" id="sum"></span></header>
<p class="sub">Your notes here and in the director page go to Claude. Clip notes cover the whole clip; timed notes link into the director at that moment.</p>
<div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = ts => ts ? new Date(ts * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const getNotes = n => fetch(`notes/${n}`).then(r => r.json()).catch(() => []);
const putNotes = (n, notes) => fetch(`notes/${n}`, { method: 'POST', body: JSON.stringify(notes, null, 1) });

async function load() {
  const clips = await fetch('clips').then(r => r.json());
  const total = clips.reduce((a, c) => a + c.notes.filter(x => x.text?.trim()).length, 0);
  $('#sum').textContent = `${clips.length} clips · ${total} note${total === 1 ? '' : 's'}`;
  $('#list').innerHTML = clips.map(c => {
    const timed = c.notes.filter(x => typeof x.t === 'number' && x.text?.trim()).sort((a, b) => a.t - b.t);
    const general = c.notes.filter(x => typeof x.t !== 'number').map(x => x.text).join('\n\n');
    const newer = c.keys && c.rendered && c.keys > c.rendered;
    return `<section class="clip" data-n="${c.n}">
      <div class="media">${c.video
        ? `<img src="thumb/${c.n}" alt="Still from clip ${c.n}"><button aria-label="Play clip ${c.n}" data-play="${c.n}"></button>`
        : `<div class="none">not rendered yet</div>`}</div>
      <div>
        <div class="num">CLIP ${c.n}</div>
        <h2>${esc(c.title)}</h2>
        <em class="tag">${esc(c.tagline)}</em>
        <div class="meta">
          ${c.body ? `<span class="chip">${mmss(c.body)} + bookends</span>` : ''}
          ${c.rendered ? `<span class="chip">rendered ${when(c.rendered)}</span>` : ''}
          ${c.keys ? `<span class="chip ${newer ? 'warn' : ''}">camera keys saved ${when(c.keys)}${newer ? ' · not in the render yet' : ''}</span>` : ''}
        </div>
        <div class="btns">
          <a class="btn" href="index.html?clip=${c.n}&director=1">Open in director</a>
          ${c.video ? `<a class="btn" href="video/${c.n}" download>Download mp4</a>` : ''}
        </div>
        <h3>Timed notes</h3>
        ${timed.length ? `<ul class="notes">${timed.map(x => `<li>
            <a class="t" href="index.html?clip=${c.n}&director=1&t=${x.t}&note=1">@ ${x.t.toFixed(2)}s</a>
            <span class="txt">${esc(x.text)}</span>
            <button class="x" title="Delete note" data-del="${x.t}">×</button></li>`).join('')}</ul>`
          : `<p class="empty">None yet. Add them in the director at any key or moment.</p>`}
        <h3>Clip notes</h3>
        <textarea data-gen="${c.n}" placeholder="Anything about this clip as a whole (saves as you type)">${esc(general)}</textarea>
        <div class="saved" id="saved${c.n}"></div>
      </div></section>`;
  }).join('');
}

document.addEventListener('click', async e => {
  const play = e.target.closest('[data-play]');
  if (play) {
    const n = play.dataset.play, box = play.parentElement;
    box.innerHTML = `<video src="video/${n}" controls autoplay playsinline></video>`;
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    const n = +del.closest('.clip').dataset.n, t = +del.dataset.del;
    const notes = (await getNotes(n)).filter(x => !(typeof x.t === 'number' && Math.abs(x.t - t) < .02));
    await putNotes(n, notes); load();
  }
});
const timers = {};
document.addEventListener('input', e => {
  const n = e.target.dataset?.gen; if (!n) return;
  clearTimeout(timers[n]);
  timers[n] = setTimeout(async () => {
    const text = e.target.value.trim();
    const notes = (await getNotes(n)).filter(x => typeof x.t === 'number');
    if (text) notes.unshift({ t: null, text, updated: new Date().toISOString() });
    const res = await putNotes(n, notes);
    $('#saved' + n).textContent = res.ok ? 'saved' : 'save failed';
    setTimeout(() => { const el = $('#saved' + n); if (el) el.textContent = ''; }, 1500);
  }, 600);
});
load();
</script></body></html>
