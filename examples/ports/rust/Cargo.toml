[package]
name = "rook-port"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal Rook worker in Rust: joins a band via the relay, announces caps, answers calls, posts to hub chat rooms."
publish = false

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
hkdf = "0.12"
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "rook-port"
path = "src/main.rs"
