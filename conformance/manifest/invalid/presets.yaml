manifest: 1
plugin: thing
version: 1.0.0
caps:
  door.open: { doc: Open the door., risk: write, scope: local, effects: [physical], run: scripts/x.py:f }
  logs.wipe: { doc: Wipe logs., risk: admin, scope: local, run: scripts/x.py:f }
  logs.read: { doc: Read logs., risk: read, scope: local, run: scripts/x.py:f }
presets:
  child: { grants: [thing.door.open, thing.logs.read, shell.exec], max_risk: admin }
  guest: { grants: ["thing.logs.*"] }
