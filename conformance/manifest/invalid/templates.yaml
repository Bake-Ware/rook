manifest: 1
plugin: thing
version: 1.0.0
settings:
  host: { default: localhost }
appliance:
  discover:
    - http: { url: "https://{{host}}:{{port}}/{{settings.hots}}" }
    - http: { url: "https://{{worker.hostname}}/" }
    - http: { url: "https://{{host}/" }
caps:
  get: { doc: Get., risk: read, scope: local, run: scripts/get.py:get }
routes:
  hook: { path: /hook, run: scripts/get.py:hook, auth: { hmac: "{{secret:bad name}}" } }
