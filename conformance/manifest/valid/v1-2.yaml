# Manifest 1.2 additions: provides as a list (the cap is declared under the
# contract's name) and record aliases per verb.
manifest: 1
plugin: kvm2
version: 1.0.0
runs_on: hub
settings:
  hook_secret: { secret: true }
  bot_token: { secret: true }
caps:
  screen.capture:
    doc: A picture of the screen.
    risk: read
    scope: local
    run: scripts/kvm.py:capture
  hid.type:
    doc: Type text.
    risk: exec
    scope: local
    args: { text: { type: str, required: true } }
    run: scripts/kvm.py:type_
provides: [screen.capture, hid.type]
records:
  macro:
    fields: { name: { type: str, required: true } }
    history: true
    aliases: { list: [kvm2.macros], history: [kvm2.macro_log] }
