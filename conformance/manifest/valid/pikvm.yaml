# An appliance plugin: discovery, instance settings, caps whose scripts get the instance.
manifest: 1
plugin: pikvm
version: 1.0.0
package: devices
appliance:
  discover: [ { http: { url: "https://{{host}}/api/info", match: kvmd } } ]
  settings: { password: { secret: true, setup: Ask the user for the PiKVM web password. } }
caps:
  power.set:
    doc: Press the ATX power button.
    risk: write
    scope: local
    effects: [physical]
    args: { action: { type: str, enum: [on, off, off_hard, reset_hard], required: true } }
    run: scripts/pikvm.py:power
  screen.get:
    doc: Current screen as JPEG.
    risk: read
    scope: local
    effects: [sensitive]
    run: scripts/pikvm.py:screen
check: [pikvm.screen.get]
