# The hub's index of every stream on the band (castling-streams, N28):
# terminals and processes on workers, agent and voice sessions in hub
# plugins. Implemented by the hub (rook/core2/hub/streams.py, index in
# rook/streams/index.py). Read a stream itself where it lives: stream.read
# on its worker, or its plugin's caps for a hub one (row.plugin).
manifest: 1
plugin: stream
version: 0.5.0
title: Streams
doc: Find any stream on the band (terminals, processes, agent and voice sessions) and where it lives.
package: core
builtin: true
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook

caps:
  list:
    doc: >-
      Streams you may see, latest activity first: {streams: [{id, kind, title, worker, plugin?,
      producer, participants, person, agent, attrs, types, input, durable, created, closed,
      last_at, last_seq, size, online}], next}. Pass next back as offset (null: no more). Owners
      see every stream; a person the ones they take part in; an agent acting alone the ones it
      takes part in that have no person.
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    args:
      kind: { type: str, doc: "terminal, process, session, voice, ..." }
      worker: { type: str, doc: "Only the streams on this worker (rook: the hub's own)." }
      participant: { type: str, doc: "Only the ones person:x or agent:y takes part in." }
      open: { type: bool, default: false, doc: Only streams still open. }
      limit: { type: int, min: 1, max: 200, default: 50 }
      offset: { type: int, min: 0, default: 0 }
    result:
      type: map
      fields:
        streams: { type: list }
        next: { type: int }
  get:
    doc: One stream's row (as in list), if you may see it.
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    args:
      stream: { type: str, required: true, pattern: "^s_[0-9a-f]{16}$" }
    result: { type: map }
  search:
    doc: >-
      Streams whose title, producer, kind, participants or attrs (cwd, command, ...) contain
      query, latest activity first, paged like list. What a stream says is not indexed: read it.
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    args:
      query: { type: str, required: true, min: 1, max: 200 }
      kind: { type: str }
      worker: { type: str }
      open: { type: bool, default: false }
      limit: { type: int, min: 1, max: 200, default: 50 }
      offset: { type: int, min: 0, default: 0 }
    result:
      type: map
      fields:
        streams: { type: list }
        next: { type: int }
