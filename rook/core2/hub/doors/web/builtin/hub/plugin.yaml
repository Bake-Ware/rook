# What the hub knows about itself and its workers, for pages (castling-dashboard).
# Implemented by the hub (rook.core2.hub.doors.web.caps).
manifest: 1
plugin: hub
version: 0.5.0
title: Hub
doc: The hub and its workers.
package: core
builtin: true
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook

settings:
  # castling-switchover-decisions, "Usable first, security later" (Bake, Oct 31).
  security:
    type: str
    enum: ["off", "on"]
    default: "off"
    where: hub
    doc: >-
      off: nothing waits on a person. No gate runs and no call is held (each journal entry says
      security: off) and elevation is not gated. Rights still apply; the vault stays encrypted and
      secrets stay masked in the journal. on: gates and holds apply.

caps:
  status:
    doc: "What the hub runs: its id, band, core version, doors, plugins and (for owners) its people and agents with their grants."
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    result: { type: map }
  workers:
    doc: Every worker the hub knows, online or not, with its plugins and what it can't serve.
    on: hub
    risk: read
    scope: multi-machine
    idempotent: true
    result: { type: map }
  manifests:
    doc: "The manifest of every plugin in use: the hub's own and those its workers announce (latest known). With section, only plugins that have it, and only that section (jobs, personas, ...)."
    on: hub
    risk: read
    scope: multi-machine
    idempotent: true
    args:
      section: { type: str, doc: "A manifest section, e.g. jobs; blank: whole manifests." }
    result: { type: map }
  setup:
    doc: >-
      First-run setup: whether it is finished. While it isn't, the site opens straight into the house
      agent's chat, which walks the owner through setting up (the first-run skill). done=true when the
      walk-through is over; done=false starts it again. Blank done: just say where it stands.
    on: hub
    risk: write
    scope: multi-user
    effects: [persists]
    args:
      done: { type: bool, doc: "true: setup is finished; false: not (the site opens on the setup chat again)." }
    result: { type: map }
  sacred:
    doc: "Make a machine sacred (every call there that isn't a read is a hard stop) or normal again; kept in hub.yaml's sacred list."
    on: hub
    risk: admin
    scope: multi-machine
    effects: [persists]
    args:
      worker: { type: str, required: true, doc: "The machine's name or id." }
      sacred: { type: bool, default: true, doc: "false: normal again." }
    result: { type: map }
  joins:
    doc: "Machines asking to join the band (the installer with no token), waiting for someone to let them in: devices, each with id, name, address and age."
    on: hub
    risk: read
    scope: multi-machine
    idempotent: true
    result: { type: map }
  join:
    doc: "Let a machine that asked to join in (it becomes a worker owned by you), or refuse it."
    on: hub
    risk: write
    scope: multi-machine
    effects: [persists]
    args:
      request: { type: str, required: true, doc: "Its id from hub.joins." }
      refuse: { type: bool, default: false, doc: "true: say no." }
    result: { type: map }
  join_code:
    doc: "A one-time code (ten minutes) for a machine to join with no tap: run python -m rook.core2.worker enroll '<qr>' there. Also POST /enroll/code."
    on: hub
    risk: write
    scope: multi-machine
    result: { type: map }
  door:
    doc: "The kill switch: close a door (mcp, http, web) so it refuses everything, or open it again. Closing mcp also refuses agents' tokens on every door. Owners, or a hub component closing one (the security plugin); kept across restarts. Also POST /doors/<name>."
    on: hub
    risk: admin
    scope: multi-user
    effects: [persists]
    args:
      door: { type: str, required: true, pattern: "^[a-z][a-z0-9_-]{0,31}$" }
      open: { type: bool, required: true, doc: "false closes the door, true opens it." }
    result: { type: map }

pages:
  workers: { title: Workers, file: pages/workers.html, caps: [hub.workers, hub.joins, hub.join], events: ["worker.*", "plugin.*"], nav: { section: Hub } }

components:
  workers: { title: Workers, file: components/workers.js, doc: "The band's workers: online or not, last seen.", caps: [hub.workers], props: { only: { type: list, items: { type: str }, doc: "Worker names to show; blank: all." } } }

docs: { manual: docs/manual.md }
