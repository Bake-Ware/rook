# The dashboard's own caps (castling-dashboard): pages are a content kind
# plugins ship (manifest `pages:`); agents also make pages here, kept in the
# hub's data folder with a markdown note saying why they exist. Every page
# action is a cap, so a person, an agent, a job or a trigger can call it.
# Components are the canned tier any agent arranges into a page (layout).
# Implemented by the hub (rook.core2.hub.doors.web.caps).
manifest: 1
plugin: page
version: 0.5.0
title: Pages
doc: The hub site's pages. List, open, make, change, archive and restore them.
package: core
builtin: true
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook

caps:
  list:
    doc: >-
      Your sidebar: {pinned: [page...], segments: [{segment, open, pages: [page...]}]}, segments in order
      Agents, Machines, Work, Hub, then any other by name; each page with its segment, how often you
      opened it (opens) and whether it is pinned. archived=true: {pages: [...]}, the archived ones.
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    args:
      archived: { type: bool, default: false, doc: "List the archived pages instead." }
    result: { type: map }
  view:
    doc: Open a page (the dashboard calls this when a person opens one). Returns what it may call and hear.
    on: hub
    risk: read
    scope: multi-user
    args:
      page: { type: str, required: true, doc: "plugin/name, e.g. hub/workers or page/uptime." }
    result: { type: map }
  get:
    doc: One page's details and, for a page an agent made, its note (why it exists, its history).
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    args:
      page: { type: str, required: true }
    result: { type: map }
  create:
    doc: >-
      Make a page on the hub site: either one self-contained HTML file (inline script and style), or a
      layout of ready-made components (page.components lists them). It runs sandboxed and reaches data
      only through window.rook.call on the caps it declares (a layout: its components' caps), as whoever
      views it and never more than its author may. The note says why it exists.
    on: hub
    risk: write
    scope: multi-user
    effects: []
    args:
      name: { type: str, required: true, doc: "Lowercase letters, digits, - and _; the page is page/<name>." }
      title: { type: str, required: true }
      html: { type: str, doc: "The whole page; or give layout instead." }
      layout:
        type: list
        max: 50
        doc: "Components top to bottom: [{component: hub/workers, props: {...}, title?, wide?}]."
        items: { type: map }
      note: { type: str, required: true, doc: "Markdown: why the page exists, who asked, what it watches." }
      caps: { type: list, items: { type: str }, doc: "Cap patterns the page may call." }
      events: { type: list, items: { type: str }, doc: "Event patterns the page hears." }
      segment: { type: str, doc: "Sidebar segment; blank: Pages." }
    result: { type: map }
  update:
    doc: Change a page an agent made. Each change is added to its note's history.
    on: hub
    risk: write
    scope: multi-user
    effects: []
    args:
      page: { type: str, required: true }
      change: { type: str, required: true, doc: "What changed and why, for the history." }
      title: { type: str }
      html: { type: str }
      layout: { type: list, max: 50, items: { type: map }, doc: "A new layout (replaces html)." }
      note: { type: str, doc: "A new note body (the history is kept)." }
      caps: { type: list, items: { type: str } }
      events: { type: list, items: { type: str } }
      segment: { type: str }
    result: { type: map }
  archive:
    doc: Take a page off the site. Nothing is lost; restore brings it back.
    on: hub
    risk: write
    scope: multi-user
    effects: []
    undo: page.restore
    args:
      page: { type: str, required: true }
      reason: { type: str }
    result: { type: map }
  restore:
    doc: Put an archived page back on the site.
    on: hub
    risk: write
    scope: multi-user
    effects: []
    args:
      page: { type: str, required: true }
    result: { type: map }
  public:
    doc: >-
      Make a page public: anyone opens it at /public/<page> (the url in the result) without signing in, a
      read-only view with no chat or sidebar, for reports and reference. Its calls act as whoever made
      it public. public=false makes it private again.
    on: hub
    risk: write
    scope: multi-user
    effects: []
    args:
      page: { type: str, required: true }
      public: { type: bool, default: true, doc: "false: private again." }
    result: { type: map }
  components:
    doc: The ready-made components a page layout can use, with their props and the caps they call.
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    result: { type: map }
  site:
    doc: What the site shows you first - your start page.
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    result: { type: map }
  start:
    doc: >-
      Set the page the site opens on: yours when you act for a person, else the hub's own (everyone
      without one of their own). Blank goes back to the default.
    on: hub
    risk: write
    scope: multi-user
    effects: []
    args:
      page: { type: str, doc: "plugin/name; blank: the default." }
    result: { type: map }
  arrange:
    doc: >-
      Change your sidebar (or the hub's own, acting for nobody): {page, pinned} pins or unpins a page;
      {segment, open} opens or folds a segment, which then stays that way. Returns the sidebar as page.list does.
    on: hub
    risk: write
    scope: multi-user
    effects: []
    args:
      page: { type: str, doc: "plugin/name." }
      pinned: { type: bool }
      segment: { type: str, doc: "A segment's name, e.g. Work." }
      open: { type: bool }
    result: { type: map }

components:
  text: { title: Note, file: components/text.js, doc: "Words on the page: a heading, a reminder, what this page is for. Blank lines split paragraphs.", props: { text: { type: str, required: true } } }
  value:
    title: Value
    file: components/value.js
    doc: "Any cap's result: one field as a big number or text, or a list as a table. Name the cap in the page's caps too."
    props:
      cap: { type: str, required: true }
      args: { type: map }
      worker: { type: str, doc: "Where the cap runs; blank: wherever the hub finds it." }
      field: { type: str, doc: "A dotted path into the result, e.g. workers or battery.level." }
      every: { type: int, min: 0, doc: "Seconds between refreshes; 0: once." }

emits:
  page.created:
    doc: Someone made a page (page.create).
    payload: { page: { type: str }, title: { type: str }, note: { type: str }, by: { type: str }, person: { type: str } }
  page.updated:
    doc: Someone changed a page they made (page.update).
    payload: { page: { type: str }, change: { type: str }, by: { type: str }, person: { type: str } }

docs: { manual: docs/manual.md }
