# The worker's own caps (castling-caps: info, log and selfupdate move into
# core). Implemented inside the worker binary (rook/core2/worker/builtins.py),
# announced like any plugin, never pushed. The rest of 0.4's selfupdate is
# binned or elsewhere: deauth is core.trust.set with a removed membership and
# hold is a setting. worker.update/rollback: docs/castling-updates.md.
manifest: 1
plugin: worker
version: 0.5.0
title: Worker
doc: Liveness, status, the local record of calls this worker ran, and restart.
package: core
builtin: true
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
caps:
  ping:
    doc: Liveness check. Answers {pong, at} (the worker's clock).
    risk: read
    scope: self
    idempotent: true
    aliases: [info.ping]
    result:
      type: map
      fields:
        pong: { type: bool }
        at: { type: float }
  status:
    doc: >-
      One read of this worker: name, id, version, core, OS facts, uptime, the bands it is on
      (with hub contact), plugins loaded and caps unavailable (with why), open streams, and its
      core release (running, current, previous, a trial waiting to prove itself, the last failure).
    risk: read
    scope: self
    idempotent: true
    result: { type: map }
  log:
    doc: >-
      What this worker actually ran, from its own record (newest last): one entry per call a hub
      ticket let through, with cap, person, agent, session, why, ok or the error, and how long it
      took. Filter by cap prefix, person, agent, since (epoch seconds) or failures only.
    risk: read
    scope: self
    effects: [sensitive]
    idempotent: true
    aliases: [log.audit]
    args:
      limit: { type: int, default: 50, min: 1, max: 500 }
      cap: { type: str, doc: "Only caps starting with this (shell., tv.power)." }
      person: { type: str }
      agent: { type: str }
      since: { type: float, min: 0 }
      failed: { type: bool, default: false, doc: Only calls that failed. }
    result:
      type: map
      fields:
        entries: { type: list }
  restart:
    doc: >-
      Restart this worker process in place with its current config. Every live terminal, process
      and browser session on it ends, so whoever runs them loses their work.
    risk: admin
    scope: local
    effects: [destructive]
    result:
      type: map
      fields:
        restarting: { type: bool }
  update:
    doc: >-
      Update this worker's core to a hub-signed release: pull it, check its signature and files,
      install its requirements, smoke-check it, then restart into it on trial. The new core must
      reach its home hub within two minutes (and within three starts), or the worker drops it
      and restarts on the core it had. Refused while terminals or streams are open here.
    risk: admin
    scope: self
    effects: [persists]
    timeout: 20m
    args:
      bundle: { type: map, required: true, doc: "The release's Drop descriptor: id, size, sha256." }
    result:
      type: map
      fields:
        version: { type: str }
        from: { type: str, doc: "The core it replaces; blank: the installed one." }
        restarting: { type: bool }
  rollback:
    doc: >-
      Go back to the kept previous core (the installed one when no release was kept) and
      restart. Refused while terminals or streams are open here.
    risk: admin
    scope: self
    effects: [persists]
    result:
      type: map
      fields:
        version: { type: str, doc: "The core it restarts on; blank: the installed one." }
        from: { type: str }
        restarting: { type: bool }
