# The agents package core (castling-agents): one agent mechanism. An agent is
# a persona (personas: below, or made by a person) + a backend (the
# agent.backend contract: Claude Code or Codex) + a persistent
# session per party it talks with (a rook.streams session stream) + a private
# notepad + read-only memory, which a dream cycle (System Three) curates from
# the notepad when the agent goes idle. Always-on agents never sleep on idle
# and get a periodic dream pass instead.
#
# Every ready-made role below, and every persona another installed plugin
# ships, is created on install; skills are markdown in a manifest's skills:
# or knowledge pages of kind skill. Each agent is its own identity on the hub
# (agent:<name>) with its grants: alone it has only them, for a person only
# what both may. Code: scripts/agents.py.
manifest: 1
plugin: agent
version: 0.5.3
title: Agents
doc: Agents with a persona, a backend, persistent sessions, a private notepad and curated memory.
package: agents
segment: Agents
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
# agent.backend only for turns: the backend setting's provider, or the one an
# agent is pinned to (any plugin that provides the contract).
# A person's direct message to the band's Telegram or Discord bot goes to
# chat_agent as that person; the reply goes back to them by the same bot,
# through its notify channel (the notify.channel.send contract).
# hub.manifests: the personas and skills every installed plugin ships;
# knowledge.get: skills kept as knowledge pages (kind skill), with the workbench.
# hub.workers, setting.list: whether a worker serving agent.backend (or the
# worker a hub-run one names) is online (agent.site, agent.engines).
# *.models: an engine's own list of models (agent.models).
uses: ["agent.backend", "notify.channel.send", "hub.manifests", "knowledge.get", "hub.workers", "setting.list",
       "*.models"]

settings:
  warm: { type: duration, default: 10m, doc: How long an agent that isn't always-on stays awake after its last message. }
  turn_timeout: { type: duration, default: 20m, doc: Longest one agent turn may take. }
  dream_every: { type: duration, default: 6h, doc: How often an always-on agent gets a dream pass. }
  chat_agent: { default: house, doc: "The agent that answers people's direct messages to the band's Telegram and Discord bots (once they linked their account); blank: none does." }
  backend: { type: str, where: hub, doc: "The agent.backend provider an agent with backend default uses, e.g. agents-claude-code.turn (the installer sets it); blank: the first installed." }
  house: { type: str, default: house, doc: "The agent that reaches the person: questions agents ask them (approval.ask) go to it; blank: they wait in approval.list only." }
  house_name: { type: str, where: hub, doc: "The house agent's name: what it calls itself and what the hub site calls it (first-run setup asks it; Your account changes it); blank: Rookie. Its identity stays agent:<house>." }
  # The hub site (shell: below). The look and feel is each person's; blank
  # means not chosen yet, so first-run setup asks it.
  dock: { type: str, where: hub, default: house, doc: "The agent in the hub site's chat dock; blank: no dock." }
  sound: { type: bool, where: person, doc: "Your look and feel: Rookie's sounds (a chiptune blip as it changes state). Off until you answer; set by agent.look." }
  rookie: { type: str, where: person, doc: "Your look and feel: Rookie's style beside the house agent (a skin shell/rookie.js ships; none hides it); blank: pixel. Set by agent.look." }
  rookie_theme: { type: str, where: person, doc: "Your look and feel: Rookie's colour theme (one shell/rookie.js ships); blank: its first. Set by agent.look." }

# Stored as kit records (castling-plugins "Records"; castling-caps rule 6):
# the kit gives the storage, history and the agent.* and
# agent.memory.* caps. Notes have no caps of their own: agent.note writes
# one, and only the agent itself sees its notepad (in its prompt).
records:
  agent:
    fields:
      name: { type: str, required: true, unique: true, pattern: "^[a-z][a-z0-9_-]{0,39}$", doc: "Its name on the band (agent:<name>)." }
      persona: { type: str, doc: "The persona it started from (house, pm, lead, ...): its defaults fill what you leave out." }
      title: { type: str }
      summary: { type: str, doc: The roster line every agent sees. }
      prompt: { type: markdown, doc: What the agent is and how it works. }
      skills: { type: list, items: { type: str } }
      grants: { type: list, items: { type: str }, doc: "Cap patterns it may use as agent:<name> (plus agent.backend, its own turns); acting for a person it gets only what both may, alone only these." }
      backend: { type: str, pattern: "^(default|[a-z][a-z0-9-]*\\.[a-z][a-z0-9_.]*)$", doc: "default (the backend setting's provider) or one provider's cap, e.g. agents-claude-code.turn." }
      model: { type: map, items: { type: str }, doc: "Per-system model: {two: opus, three: haiku}; default: the backend's model and model_three settings." }
      always_on: { type: bool, doc: "Never sleeps on idle (house); others wake when addressed." }
      cwd: { type: str, doc: "The folder its backend works in; blank: the backend's own." }
      awake: { type: bool, doc: "Whether it is awake now (the agents plugin keeps this)." }
      dreamed: { type: float, doc: "When its last dream cycle ran (the agents plugin keeps this)." }
    search: [name, title, summary]
    history: true
    caps: [list, get, search, create, update, archive, delete, history]
    risk: { create: admin, update: admin, archive: admin, delete: admin }
  note:
    fields:
      agent: { type: str, required: true }
      text: { type: str, required: true }
    index: [agent]
    caps: []
  memory:
    fields:
      agent: { type: str, required: true, doc: The agent it belongs to. }
      text: { type: str, required: true }
    index: [agent]
    search: [text]
    private: true
    caps: [list, get, search, create, update, archive, delete]
    risk: { create: admin, update: admin, archive: admin, delete: admin }

caps:
  wake:
    doc: Wake an agent so it picks up messages waiting in its sessions.
    risk: write
    scope: multi-user
    run: scripts/agents.py:wake
    args:
      name: { type: str, required: true }
    result: { type: map }
  sleep:
    doc: Put an agent to sleep now (it dreams if its notepad has anything new).
    risk: write
    scope: multi-user
    run: scripts/agents.py:sleep
    args:
      name: { type: str, required: true }
    result: { type: map }
  chat.send:
    doc: Message an agent in your session with it, waking it if it sleeps; with wait, answers its reply.
    risk: write
    scope: multi-user
    timeout: 30m
    run: scripts/agents.py:chat_send
    args:
      agent: { type: str, required: true }
      text: { type: str, required: true }
      wait: { type: bool, default: true, doc: "Wait for the reply; false: answer at once, read it later with agent.chat.read." }
    result: { type: map }
  chat.read:
    doc: Your session with an agent, after a cursor (owners may read anyone's with party).
    risk: read
    scope: multi-user
    idempotent: true
    timeout: 75s          # wait may hold the call up to 60 s
    run: scripts/agents.py:chat_read
    args:
      agent: { type: str, required: true }
      after: { type: int, default: 0, min: 0, doc: "The last seq you saw; pass back next." }
      limit: { type: int, default: 50, min: 1, max: 500 }
      wait: { type: float, default: 0, min: 0, max: 60, doc: Seconds to wait for something new. }
      party: { type: str, doc: "Owners: whose session (person:<name> or agent:<name>)." }
    result: { type: map }
  note:
    doc: Write to an agent's private notepad (the agent itself, or an owner). Durable things go here; the dream cycle curates them into memory (agent.memory.*).
    risk: write
    scope: self
    run: scripts/agents.py:note
    args:
      agent: { type: str, required: true }
      text: { type: str, required: true }
    result: { type: map }
  dream:
    doc: Run an agent's dream cycle now; System Three curates its notepad into lasting memory.
    risk: write
    scope: self
    timeout: 30m
    run: scripts/agents.py:dream
    args:
      name: { type: str, required: true }
    result: { type: map }
  skill:
    doc: A skill's playbook (markdown) by name, to read before following it.
    risk: read
    scope: self
    idempotent: true
    run: scripts/agents.py:skill
    args:
      name: { type: str, required: true }
    result: { type: map }

  site:
    doc: >-
      What the hub site's chat dock needs: the agent in it (the dock setting), whether it can answer
      yet (a worker serving agent.backend is online), your look and feel (agent.look) and whether
      first-run setup is done (agent.setup).
    risk: read
    scope: multi-user
    idempotent: true
    run: scripts/agents.py:site
    result: { type: map }
  engines:
    doc: >-
      The engines agents can run on (the agent.backend providers, by the cap an agent's backend names), which
      one is the default (the backend setting, else the first installed), and whether each can run a turn now
      (why not, when it can't).
    risk: read
    scope: multi-user
    idempotent: true
    run: scripts/agents.py:engines
    result: { type: map }
  models:
    doc: >-
      The models one engine offers (its models cap): names its model setting and an agent's model take, and
      its default (blank: the engine's own). Any other model id the engine knows works too.
    risk: read
    scope: local
    idempotent: true
    timeout: 1m
    run: scripts/agents.py:models
    args:
      engine: { type: str, doc: "An engine as agent.engines lists it (agents-claude-code.turn); blank: the default." }
    result: { type: map }
  setup:
    doc: >-
      First-run setup: whether it is finished. While it isn't, the site opens straight into the house
      agent's chat, which walks the owner through setting up (the first-run skill); install has the
      facts the installer left. done=true when the walk-through is over; done=false starts it again.
      Blank done: just say where it stands.
    risk: write
    scope: multi-user
    effects: []
    run: scripts/agents.py:setup
    args:
      done: { type: bool, doc: "true: setup is finished; false: not (the site opens on the setup chat again)." }
    result: { type: map }
  look:
    doc: >-
      Look and feel on the hub site, the first four first-run questions in this order: sound (yes/no),
      Rookie's style, Rookie's theme, Rookie's name. The name is the house agent's name (the setting
      house_name). Give any of them to set it; blank: just say what you have. chosen says which were
      answered, next is the first one that wasn't (null when all were).
    risk: write
    scope: multi-user
    effects: []
    run: scripts/agents.py:look
    args:
      sound: { type: bool, doc: "Rookie's sounds on or off." }
      rookie: { type: str, doc: "Rookie's style, one of styles (e.g. pixel, kawaii; none hides it)." }
      theme: { type: str, doc: "Rookie's colour theme, one of themes (e.g. stone, gameboy)." }
      name: { type: str, doc: "Rookie's name: the house agent's name from now on." }
    result: { type: map }

# The house agent beside every page of the hub site: the chat dock, Rookie
# (its avatar), the work pane and the guided first run, and the look pickers
# on Your account. The shell loads these files and lets them call these caps.
# rookie.js is Rookie by Bake (castling-wave12/rookie.js, sha256 fd17c3ee...),
# vendored unchanged as a drop-in: replace the file to update it; agent.look
# reads its SKINS and THEMES. rookie-map.js is the 0.5 wiring (events ->
# states), chat-widgets.js the [[...]] blocks in the agent's messages.
shell:
  style: { file: shell/dock.css }
  rookie: { file: shell/rookie.js }
  rookie-map: { file: shell/rookie-map.js }
  chat-widgets: { file: shell/chat-widgets.js }
  dock: { file: shell/dock.js, caps: [agent.chat.send, agent.chat.read, agent.site, agent.look, secret.list, secret.set] }
  look: { file: shell/look.js, caps: [agent.look] }

# Children and guests may talk to agents (inside their presets' limits).
presets:
  child: { grants: ["agent.chat.*"] }
  guest: { grants: ["agent.chat.*"] }

hooks:
  start: scripts/agents.py:start
  stop: scripts/agents.py:stop
  every: [ { interval: 30m, run: scripts/agents.py:tick } ]
  on:
    - { event: telegram.message, run: scripts/agents.py:inbound }
    - { event: discord.message, run: scripts/agents.py:inbound }
    # castling-caps C4: a question for the person is routed through the house agent.
    - { event: approval.asked, run: scripts/agents.py:on_asked }
    - { event: task.signoff_requested, run: scripts/agents.py:on_signoff_requested }
    - { event: agent.agent.created, run: scripts/agents.py:on_created }
    - { event: agent.agent.updated, run: scripts/agents.py:on_updated }
    - { event: agent.agent.archived, run: scripts/agents.py:on_archived }

# The ready-made roles this package ships (castling-agents "Skills and
# defaults"): created on install, each with its skills. Any plugin's manifest
# can ship personas and skills (castling-dashboard); every installed one's are
# made into agents too, so the workbench's team roles (project manager, lead,
# QA, writer, archivist, producer) come with the workbench. Lean toward
# agency: broad grants, and acting for a person an agent gets only what both
# may.
personas:
  house:
    title: House agent
    summary: "The person's personal assistant and guardian of the house: knows how and when to reach them."
    prompt: personas/house.md
    skills: [first-run, reach-the-user, presence, attention, hub-pages, consult, notepad, housekeeping, plugins]
    grants: ["*"]
    always_on: true

skills:
  first-run: skills/first-run.md
  reach-the-user: skills/reach-the-user.md
  presence: skills/presence.md
  consult: skills/consult.md
  notepad: skills/notepad.md
  hub-pages: skills/hub-pages.md
  housekeeping: skills/housekeeping.md
  plugins: skills/plugins.md

# The Agents page: each agent's engine, model and persona, the default
# engine, and the attention pass when the attention job is on this hub.
pages:
  agents:
    title: Agents
    file: pages/agents.html
    caps: [agent.list, agent.get, agent.update, agent.engines, agent.models, setting.set, job.templates, job.install, job.list, job.update]
    events: ["agent.agent.*"]

docs: { manual: docs/manual.md }
