# GitHub through its REST API (stdlib only): pull requests, commits, checks,
# reviews, diffs and files, and github.merge, which is how work lands on 0.5
# (castling-workbench: sign-off replaces merge votes). A merge goes through
# only when the task's sign-off is satisfied for its project's trust level
# and the gates pass, at the head SHA the caller names, with the hub's token
# from the vault. Code: scripts/github.py.
manifest: 1
plugin: github
version: 0.5.0
title: GitHub
doc: Read pull requests, checks and diffs on GitHub, and merge one once its task is signed off and its gates pass.
package: workbench
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
# merge reads the task, its sign-off, its project's trust level and its
# concepts' sign-off norm as the caller; review records the caller's sign-off.
uses: ["task.get", "task.link", "task.signoff", "task.signoff.list", "project.get", "project.trust.list", "concept.pool"]

settings:
  token:
    secret: true
    where: hub
    doc: The vault name of a GitHub token (fine-grained, contents + pull requests write on the repos it merges).
    setup: Make a fine-grained token on GitHub, store it in the vault and set this to its vault name.
  api: { type: url, default: "https://api.github.com", where: hub, doc: The REST API base URL. }
  logins: { type: map, items: { type: str }, default: {}, where: hub, doc: "GitHub login -> who it is on the band (agent:qa, person:bake): an approving PR review by a known login counts as that one's sign-off." }
  repos: { type: map, items: { type: str }, default: {}, where: hub, doc: "owner/name -> project id: that project's trust level and sign-off norm apply to merges into the repo whatever project the task is in (the stricter of the two)." }

caps:
  pr:
    doc: "A pull request: {number, title, body, state, merged, draft, mergeable, mergeable_state, head, head_ref, base, base_sha, author, url, merge_sha}."
    risk: read
    scope: external
    idempotent: true
    timeout: 60s
    run: scripts/github.py:pr
    args:
      repo: { type: str, required: true, doc: "owner/name" }
      number: { type: int, required: true, min: 1 }
    result: { type: map }
  commit:
    doc: "A commit by sha or ref: {sha, message, author, parents, files}."
    risk: read
    scope: external
    idempotent: true
    timeout: 60s
    run: scripts/github.py:commit
    args:
      repo: { type: str, required: true }
      ref: { type: str, required: true }
    result: { type: map }
  checks:
    doc: "A commit's check runs and commit statuses: {runs: [{name, status, conclusion}], statuses: [{context, state}], state}."
    risk: read
    scope: external
    idempotent: true
    timeout: 60s
    run: scripts/github.py:checks
    args:
      repo: { type: str, required: true }
      sha: { type: str, required: true }
    result: { type: map }
  reviews:
    doc: "A pull request's reviews: [{login, who, state, commit, body}] (who: the band identity the logins setting gives)."
    risk: read
    scope: external
    idempotent: true
    timeout: 60s
    run: scripts/github.py:reviews
    args:
      repo: { type: str, required: true }
      number: { type: int, required: true, min: 1 }
    result: { type: list }
  review:
    doc: >-
      Review a pull request for a task as yourself, at the head you read (sha): approve, or ask
      for changes with what to fix (body). Records your sign-off on the task (answering the request
      made to you, or to role:<your name>) and posts the review on the pull request.
    risk: write
    scope: external
    timeout: 60s
    run: scripts/github.py:review
    args:
      repo: { type: str, required: true }
      number: { type: int, required: true, min: 1 }
      sha: { type: str, required: true, pattern: "^[0-9a-f]{40}$" }
      task: { type: str, required: true }
      approve: { type: bool, required: true }
      body: { type: str, required: true, min: 1, max: 20000, doc: "What you checked, or what to fix." }
    result: { type: map }
  diff:
    doc: "The unified diff base...head: {text, bytes, truncated} (cut at 8 MB)."
    risk: read
    scope: external
    idempotent: true
    timeout: 60s
    run: scripts/github.py:diff
    args:
      repo: { type: str, required: true }
      base: { type: str, required: true }
      head: { type: str, required: true }
    result: { type: map }
  file:
    doc: "A file's text at a ref: {text, bytes, truncated} (cut at 8 MB)."
    risk: read
    scope: external
    idempotent: true
    timeout: 60s
    run: scripts/github.py:file
    args:
      repo: { type: str, required: true }
      path: { type: str, required: true }
      ref: { type: str, required: true }
    result: { type: map }
  merge:
    doc: >-
      Land a pull request for a task. Refused, with every reason, unless the PR is open with sha as
      its head and the task's sign-off is satisfied: the project's trust level decides whether the
      person signs (sacred) or nobody need (ship-it); otherwise a reviewer other than the author,
      unless the project's concepts say sign-off: none. A decline, a sign-off still waiting or a
      GitHub "changes requested" blocks it; GitHub reviews by known logins count. CI, tests and the
      diff are the reviewers' checks. Merges only at sha with the hub's token and links the merge
      commit to the task.
    risk: write
    scope: external
    effects: [persists]
    timeout: 90s
    run: scripts/github.py:merge
    args:
      repo: { type: str, required: true }
      number: { type: int, required: true, min: 1 }
      sha: { type: str, required: true, pattern: "^[0-9a-f]{40}$", doc: The head you checked; GitHub refuses if it moved. }
      task: { type: str, required: true, doc: The task the work is for (its sign-off decides). }
      method: { type: str, enum: [merge, squash, rebase], default: merge }
    result: { type: map }

docs: { manual: docs/manual.md }
