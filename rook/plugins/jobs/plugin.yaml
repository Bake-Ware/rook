# Jobs: a time or an event fires ONE call (castling design, "Jobs"). Logic
# lives in a hub plugin script cap the job calls; there is no workflow here.
# Triggers: cron, every, on an event (+ filter), manual. A job runs as its
# creator or as a persona (owners only); its call goes through dispatch (why,
# rights, journal). A call fired by an event gets event: {name,
# payload} when its cap takes an event arg. Runs are records. No
# checkpointing: a run cut off by a hub restart is marked failed.
#
# Templates: every plugin's manifest `jobs:` section (hub.manifests). An
# `enabled: true` job that runs as a persona is installed active; the rest are
# offered for a person to install (they then run as that person).
manifest: 1
plugin: job
version: 0.5.0
title: Jobs
doc: Scheduled, event and manual jobs, each firing one cap call.
package: core
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
# A job's call is bounded by its identity (its creator or persona), not by
# this list: dispatch intersects the two.
uses: ["*"]

settings:
  timezone: { type: str, default: UTC, doc: "IANA zone for cron schedules (e.g. America/Chicago)." }
  timeout: { type: duration, default: 10m, doc: How long a run may take unless the job says otherwise. }
  tick: { type: duration, default: 1s, doc: How often the scheduler looks for due jobs. }

records:
  job:
    fields:
      name: { type: str, required: true, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
      doc: { type: str }
      trigger: { type: map, required: true, doc: "One of cron, every, on (+ filter), manual." }
      call: { type: str, required: true, doc: The cap to call. }
      worker: { type: str, doc: "Where call runs (blank: the worker that serves it)." }
      args: { type: map, doc: The call's args. }
      run_as: { type: str, enum: [creator, persona], default: creator }
      persona: { type: str, doc: "The persona a persona job runs as (agent:<persona>)." }
      enabled: { type: bool, default: true }
      catch_up: { type: bool, default: false, doc: "Run once at start for a schedule missed while the hub was down." }
      timeout: { type: duration }
      source: { type: str, doc: "plugin/job: the manifest job this one came from." }
      source_version: { type: str }
      edited: { type: bool, default: false, doc: "Changed by a person: plugin updates leave it alone." }
    index: [name, source]
    history: true
    private: true
    caps: [list, get, history, archive]
  run:
    fields:
      job: { type: ref, to: job, required: true }
      name: { type: str, doc: The job's name when it ran. }
      trigger: { type: str, enum: [cron, every, event, manual, catch_up] }
      scheduled: { type: float, doc: The schedule slot this run is for. }
      by: { type: str, doc: Who started it (manual runs). }
      as_who: { type: str, doc: The identity its calls ran as. }
      state: { type: str, enum: [running, ok, failed], required: true }
      started: { type: float }
      ended: { type: float }
      result: { type: json }
      error: { type: str }
      event: { type: map, doc: "{name, payload}: the event that started it." }
    index: [job, state]
    private: true
    retain: 30d
    caps: [list, get]

caps:
  create:
    doc: "Make a job: a trigger and one call (+ worker, args). as: persona and on triggers are for owners."
    risk: write
    scope: multi-user
    effects: []
    run: scripts/jobs.py:create
    args:
      name: { type: str, required: true, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
      doc: { type: str }
      trigger: { type: map, required: true, doc: "{cron: '0 8 * * *'} | {every: 5m} | {on: worker.online, filter: {name: kaiju}} | {manual: true}" }
      call: { type: str, required: true, doc: "The cap; fired by an event, it gets event: {name, payload} if it takes an event arg." }
      worker: { type: str }
      args: { type: map }
      as: { type: str, enum: [creator, persona], default: creator }
      persona: { type: str }
      enabled: { type: bool, default: true }
      catch_up: { type: bool, default: false }
      timeout: { type: duration }
    result: { type: map }
  update:
    doc: Change a job (pass its current revision). The same owner-only rules as create.
    risk: write
    scope: multi-user
    effects: []
    run: scripts/jobs.py:update
    args:
      id: { type: str, required: true, doc: The job's id or name. }
      revision: { type: int, required: true }
      name: { type: str, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
      doc: { type: str }
      trigger: { type: map }
      call: { type: str }
      worker: { type: str }
      args: { type: map }
      as: { type: str, enum: [creator, persona] }
      persona: { type: str }
      enabled: { type: bool }
      catch_up: { type: bool }
      timeout: { type: duration }
    result: { type: map }
  run:
    doc: Run a job now, as the job's own identity. With wait, answers when the run ends.
    risk: write
    scope: multi-user
    timeout: 30m
    run: scripts/jobs.py:start_run
    args:
      job: { type: str, required: true, doc: Its id or name. }
      wait: { type: bool, default: false }
    result: { type: map }
  templates:
    doc: Ready-made jobs from every plugin's manifest, with whether each is installed.
    risk: read
    scope: multi-user
    idempotent: true
    run: scripts/jobs.py:templates
    result: { type: list }
  install:
    doc: Install a ready-made job (plugin/job from job.templates) as yours.
    risk: write
    scope: multi-user
    effects: []
    run: scripts/jobs.py:install
    args:
      template: { type: str, required: true, doc: "plugin/job" }
      name: { type: str, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
      enabled: { type: bool, default: true }
    result: { type: map }

hooks:
  start: scripts/jobs.py:start
  stop: scripts/jobs.py:stop
  on: [ { event: "*", run: scripts/jobs.py:on_event } ]

pages:
  jobs: { title: Jobs, file: pages/jobs.html, caps: [job.list, job.update, job.run, job.run.list, job.templates, job.install], events: ["job.*"], nav: { section: Hub } }

docs: { manual: docs/manual.md }
