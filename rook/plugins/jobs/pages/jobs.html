<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobs</title>
<style>
  section { margin-bottom: 20px; }
  .detail td { background: var(--card); }
</style>
</head>
<body>
<p id="err" class="bad" hidden></p>
<section>
  <h2>Jobs</h2>
  <div class="scroll"><table>
    <thead><tr><th>Job</th><th>When</th><th>Calls</th><th>Runs as</th><th>Last run</th><th>On</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
  </table></div>
</section>
<section>
  <h2>Ready-made</h2>
  <div class="scroll"><table>
    <thead><tr><th>Job</th><th>When</th><th>Calls</th><th></th></tr></thead>
    <tbody id="templates"></tbody>
  </table></div>
</section>
<script>
"use strict";
const esc = rook.esc;
let jobs = [], last = {}, runs = {};
const open = new Set();

function when(t) {
  if (!t) return "";
  if (t.cron) return `on schedule <code>${esc(t.cron)}</code>`;
  if (t.every) return `every ${esc(t.every)}`;
  if (t.on) {
    const f = Object.entries(t.filter || {}).map(([k, v]) => `${k} ${Array.isArray(v) ? v.join(" or ") : v}`);
    return `when ${esc(t.on)} happens${f.length ? ` (${esc(f.join(", "))})` : ""}`;
  }
  return "only by hand";
}

function result(r) {
  if (!r) return '<span class="muted">never</span>';
  const state = r.state === "ok" ? '<span class="ok">ok</span>'
    : r.state === "failed" ? `<span class="bad">failed: ${esc(r.error)}</span>` : '<span class="warn">running</span>';
  return `<span class="muted" title="${esc(rook.time(r.started))}">${rook.ago(r.started)}</span> ${state}`;
}

function render() {
  const rows = document.getElementById("rows");
  if (!jobs.length) { rows.innerHTML = '<tr><td colspan="7" class="muted">No jobs.</td></tr>'; return; }
  rows.innerHTML = jobs.map((j) => {
    const as = j.run_as === "persona" ? `agent:${j.persona}` : j.person || j.creator;
    let html = `<tr class="click" data-id="${esc(j.id)}"><td>${esc(j.name)}<div class="muted">${esc(j.doc)}</div></td>
      <td>${when(j.trigger)}</td><td><code>${esc(j.call)}</code>${j.worker ? ` <span class="muted">on ${esc(j.worker)}</span>` : ""}</td>
      <td>${esc(as)}</td><td>${result(last[j.id])}</td>
      <td><input type="checkbox" data-toggle="${esc(j.id)}"${j.enabled ? " checked" : ""}></td>
      <td><button data-run="${esc(j.id)}">Run now</button></td></tr>`;
    if (open.has(j.id)) {
      const list = runs[j.id];
      html += `<tr class="detail"><td colspan="7">${!list ? "Loading…" : !list.length ? '<span class="muted">No runs.</span>'
        : list.map((r) => `<div>${result(r)} <span class="muted">${esc(r.trigger)}${r.by ? ` by ${esc(r.by)}` : ""}</span>
          ${r.state === "ok" && r.result != null ? `<pre>${esc(JSON.stringify(r.result, null, 2))}</pre>` : ""}</div>`).join("")}</td></tr>`;
    }
    return html;
  }).join("");
}

async function lastRun(id) {
  return (await rook.call("job.run.list", { where: { job: id }, order: "-started", limit: 1 }))[0];
}

async function loadRuns(id) {
  runs[id] = await rook.call("job.run.list", { where: { job: id }, order: "-started", limit: 20 });
}

async function load() {
  try {
    jobs = await rook.call("job.list", { order: "name", limit: 500 });
    const got = await Promise.all(jobs.map((j) => lastRun(j.id)));
    last = Object.fromEntries(jobs.map((j, i) => [j.id, got[i]]));
    await Promise.all([...open].map(loadRuns));
    render();
  } catch (x) {
    document.getElementById("rows").innerHTML = `<tr><td colspan="7" class="bad">${esc(x.message)}</td></tr>`;
  }
  try {
    const ts = await rook.call("job.templates");
    document.getElementById("templates").innerHTML = ts.length ? ts.map((t) => `<tr>
      <td>${esc(t.template)}<div class="muted">${esc(t.doc)}</div></td><td>${when(t.trigger)}</td>
      <td><code>${esc(t.call)}</code></td>
      <td>${t.installed ? '<span class="muted">installed</span>' : `<button data-install="${esc(t.template)}">Install</button>`}</td></tr>`).join("")
      : '<tr><td colspan="4" class="muted">None.</td></tr>';
  } catch (x) {
    document.getElementById("templates").innerHTML = `<tr><td colspan="4" class="bad">${esc(x.message)}</td></tr>`;
  }
}

async function act(b, fn) {
  const err = document.getElementById("err");
  b.disabled = true;
  try { await fn(); err.hidden = true; } catch (x) { err.textContent = x.message; err.hidden = false; }
  load();
}

document.getElementById("rows").addEventListener("click", async (e) => {
  const run = e.target.closest("button[data-run]");
  const toggle = e.target.closest("input[data-toggle]");
  if (run) return act(run, () => rook.call("job.run", { job: run.dataset.run }));
  if (toggle) {
    const j = jobs.find((x) => x.id === toggle.dataset.toggle);
    return act(toggle, () => rook.call("job.update", { id: j.id, revision: j.revision, enabled: toggle.checked }));
  }
  const tr = e.target.closest("tr.click");
  if (!tr) return;
  const id = tr.dataset.id;
  if (open.delete(id)) return render();
  open.add(id);
  render();
  try { await loadRuns(id); } catch (x) { runs[id] = []; }
  render();
});

document.getElementById("templates").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-install]");
  if (b) act(b, () => rook.call("job.install", { template: b.dataset.install }));
});

let soon = null;
rook.on("job.*", () => { soon = soon || setTimeout(() => { soon = null; load(); }, 2000); });
load();
</script>
</body>
</html>
