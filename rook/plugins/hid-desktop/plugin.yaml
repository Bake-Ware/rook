# Keyboard and mouse on a worker's desktop, run on the hub: the input tools
# run on the worker through shell.exec (scripts/hid.py). On Linux hid.type and
# hid.move try xdotool, wtype, ydotool in turn (xdotool failing on a Wayland
# session falls through); key, click and drag use the first one installed. On
# Windows it is PowerShell (SendKeys, Cursor, user32's keybd_event/mouse_event).
manifest: 1
plugin: hid-desktop
version: 0.6.0
title: Desktop keyboard and mouse
doc: Type, press keys, move, click and drag on a worker's desktop (xdotool, wtype or ydotool on Linux; PowerShell on Windows).
package: devices
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
runs_on: hub
platforms: [linux, windows]
uses: [shell.exec, shell.which]
caps:
  hid.type:
    on: worker
    doc: Type text into whatever has focus, as a keyboard would (a newline presses Enter).
    risk: exec
    scope: local
    effects: [physical]
    timeout: 90s
    args:
      text: { type: str, required: true }
      enter: { type: bool, default: false, doc: Press Enter after the text. }
    run: scripts/hid.py:type_
  hid.move:
    on: worker
    doc: Move the pointer to pixel (x, y) of the desktop (top-left origin).
    risk: exec
    scope: local
    effects: [physical]
    args:
      x: { type: int, required: true, min: 0 }
      y: { type: int, required: true, min: 0 }
    run: scripts/hid.py:move
  hid.key:
    on: worker
    doc: Press and release a key with modifiers held (released in reverse).
    risk: exec
    scope: local
    effects: [physical]
    timeout: 10s
    args:
      key:
        type: str
        required: true
        pattern: "^[A-Za-z0-9_]{1,24}$"
        doc: "enter, escape, tab, backspace, space, delete, insert, home, end, pageup, pagedown, up, down, left, right, f1..f12, a letter or digit; on Linux also an X keysym name (Print, XF86AudioPlay)."
      mods: { type: list, items: { type: str, enum: [ctrl, shift, alt, meta] }, default: [] }
    run: scripts/hid.py:key
  hid.click:
    on: worker
    doc: Click a mouse button. With x and y, first move the pointer to that pixel (top-left origin).
    risk: exec
    scope: local
    effects: [physical]
    timeout: 10s
    args:
      x: { type: int, min: 0 }
      y: { type: int, min: 0 }
      button: { type: str, enum: [left, right, middle], default: left }
    run: scripts/hid.py:click
  hid.drag:
    on: worker
    doc: Press a button at (x1, y1), move to (x2, y2) over `duration`, release.
    risk: exec
    scope: local
    effects: [physical]
    timeout: 20s
    args:
      x1: { type: int, required: true, min: 0 }
      y1: { type: int, required: true, min: 0 }
      x2: { type: int, required: true, min: 0 }
      y2: { type: int, required: true, min: 0 }
      duration: { type: duration, default: 300ms, max: 10 }
      button: { type: str, enum: [left, right, middle], default: left }
    run: scripts/hid.py:drag
  hid.status:
    on: worker
    doc: "The input tools this worker uses: {backend (keyboard), pointer, platform}; null when none is installed."
    risk: read
    scope: local
    idempotent: true
    result:
      type: map
      fields: { backend: { type: str }, pointer: { type: str }, platform: { type: str } }
    run: scripts/hid.py:status
provides: [hid.type, hid.key, hid.click, hid.drag]
docs: { manual: docs/manual.md }
