# Huddles (castling-streams, castling-agents): a group thread where people
# and agents in roles work something out. A huddle is a durable `huddle`
# stream plus a record (title, roles, project). A post that names a role
# (@qa) also goes to that agent through agents.chat.send, sent as the poster.
#
# No chair, pins or votes: work lands by sign-off on its task and
# github.merge (rook/plugins/github; castling-workbench).
#
# Code: scripts/huddle.py.
manifest: 1
plugin: huddle
version: 0.5.0
title: Huddles
doc: Group threads where people and agents in roles work something out.
package: agents
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
uses: ["agents.chat.send"]

records:
  huddle:
    fields:
      title: { type: str, required: true }
      roles: { type: list, items: { type: str }, doc: "The agents in it (agents package names: pm, lead, qa, ...); @<role> in a post reaches them." }
      project: { type: str, doc: The project it is about (id or slug). }
      stream: { type: str, required: true, doc: The huddle's stream. }
      state: { type: str, enum: [open, closed], required: true }
    index: [state, project]
    search: [title]
    caps: [list, get, search]

caps:
  start:
    doc: Open a huddle with some roles (agent names) about a project.
    risk: write
    scope: multi-user
    effects: [persists]
    run: scripts/huddle.py:start
    args:
      title: { type: str, required: true }
      roles: { type: list, items: { type: str, pattern: "^[a-z][a-z0-9_-]{0,39}$" }, max: 20 }
      project: { type: str }
    result: { type: map }
  post:
    doc: "Say something in a huddle. @<role> (one of its roles) or @all sends it to those agents too."
    risk: write
    scope: multi-user
    run: scripts/huddle.py:post
    args:
      huddle: { type: str, required: true }
      text: { type: str, required: true, max: 8000 }
    result: { type: map }
  read:
    doc: "A huddle's thread after a cursor: {events, next, closed}; pass next back. wait holds an empty read up to that many seconds."
    risk: read
    scope: multi-user
    idempotent: true
    timeout: 75s
    run: scripts/huddle.py:read
    args:
      huddle: { type: str, required: true }
      after: { type: int, default: 0, min: 0 }
      limit: { type: int, default: 100, min: 1, max: 500 }
      wait: { type: float, default: 0, min: 0, max: 60 }
    result: { type: map }
  close:
    doc: Close a huddle (its creator or an owner). Its thread stays readable.
    risk: write
    scope: multi-user
    run: scripts/huddle.py:close
    args:
      huddle: { type: str, required: true }
    result: { type: map }

hooks:
  start: scripts/huddle.py:start_hook
  stop: scripts/huddle.py:stop_hook

docs: { manual: docs/manual.md }
