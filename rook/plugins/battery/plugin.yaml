# One cap, worked out on the hub: the worker only runs the OS's own tool
# through shell.exec (scripts/battery.py).
manifest: 1
plugin: battery
version: 0.6.0
title: Battery
doc: Charge level and charging state of a worker's battery.
package: devices
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
runs_on: hub
platforms: [linux, windows, termux]
uses: [shell.exec]
caps:
  status:
    doc: "The battery's charge in percent and its state: charging, discharging, fully-charged, ... (the OS's own word; Termux says it in capitals)."
    on: worker
    risk: read
    scope: local
    idempotent: true
    timeout: 20s
    result:
      type: map
      fields:
        percent: { type: float }
        status: { type: str }
    run: scripts/battery.py:status
docs: { manual: docs/manual.md }
