# Change records (castling-changes; castling-caps C2): records only.
#
# A lasting change gets a record: what changes, why, what could break, how it
# was tested, how to undo it, and the steps someone else could follow. The
# records are the trail later agents read to learn why things are the way
# they are. A record gates and runs nothing: the change goes ahead as
# ordinary calls.
#
# Applying, testing and rolling back are not this plugin's job: when they are
# automated they are a job (the jobs plugin) the record links with `job` and
# `rollback_job`; running the rollback is job.run on that job.
manifest: 1
plugin: change
version: 0.7.0
title: Change records
doc: "Lasting changes get a record (what, why, risk, testing, rollback, steps); searchable, linked to project, task, workers and caps."
package: workbench
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook

records:
  change:
    fields:
      what: { type: str, required: true, doc: "What changes, in a line." }
      why: { type: str, required: true }
      risk: { type: str, doc: What could break. }
      testing: { type: markdown, doc: "How it was (or will be) tested." }
      rollback: { type: markdown, doc: "How to undo it, or why it can't be undone." }
      steps: { type: markdown, doc: "The steps, so someone else could follow them." }
      category: { type: str, doc: "deploy, config, database, plugin, update, ... (free text, for finding similar changes)." }
      project: { type: str, doc: The project it is for. }
      task: { type: str, doc: The task this change is for. }
      workers: { type: list, items: { type: str }, doc: The workers it touches. }
      caps: { type: list, items: { type: str }, doc: The caps it calls. }
      job: { type: str, doc: "The job that applies and tests it, when that is automated." }
      rollback_job: { type: str, doc: "The job that undoes it (job.run it to roll back)." }
      outcome: { type: str, doc: "How it went, written afterwards (change.update)." }
    index: [project, task, category]
    search: [what, why, risk, testing, rollback, steps, category, outcome]
    history: true
    caps: [list, get, search, create, update, history]

docs: { manual: docs/manual.md }
