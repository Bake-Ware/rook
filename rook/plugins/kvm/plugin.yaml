# PiKVM as an appliance: scripts/kvm.py runs on the hub and sends kvmd REST
# requests over a TLS stream from a delegate worker that can reach the PiKVM;
# the host and credentials belong to the appliance instance.
manifest: 1
plugin: kvm
version: 0.6.0
title: PiKVM
doc: Drive a PiKVM (screen, keyboard, mouse, ATX power) over its REST API.
package: devices
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
runs_on: hub
uses: [net.open, stream.read, stream.write, stream.close]
appliance:
  discover:
    - http: { url: "https://{{host}}/api/info", match: kvmd }
  settings:
    user: { default: admin, doc: PiKVM web user. }
    password: { secret: true, setup: Ask the user for the PiKVM web password. }
    verify_tls: { type: bool, default: false, doc: Check the PiKVM's certificate (it ships self-signed). }
caps:
  screen.capture:
    on: worker
    run: scripts/kvm.py:screen_capture
    doc: The PiKVM's captured screen as a JPEG, full size by default (its pixels are what hid.click's x and y mean); preview=true is kvmd's small thumbnail.
    risk: read
    scope: local
    effects: [sensitive]
    idempotent: true
    args:
      preview: { type: bool, default: false, doc: "true: kvmd's small thumbnail (cheap to look at; not click coordinates)." }
      quality: { type: int, min: 1, max: 100, doc: "JPEG quality; blank: the PiKVM's default." }
    result: { type: file, doc: A JPEG. }
  hid.type:
    on: worker
    run: scripts/kvm.py:type_
    doc: Type text on the PiKVM's keyboard (newlines press Enter). slow=true types slowly, for machines that drop keys.
    risk: exec
    scope: local
    effects: [physical]
    args:
      text: { type: str, required: true }
      enter: { type: bool, default: false, doc: Press Enter after the text. }
      slow: { type: bool, default: false }
  hid.key:
    on: worker
    run: scripts/kvm.py:key
    doc: Press and release a key with modifiers held (kvmd presses them in order and releases in reverse).
    risk: exec
    scope: local
    effects: [physical]
    args:
      key:
        type: str
        required: true
        pattern: "^[A-Za-z0-9]{1,24}$"
        doc: "enter, escape, tab, backspace, space, delete, insert, home, end, pageup, pagedown, up, down, left, right, printscreen, menu, f1..f12, a letter or digit; or a kvmd key name (KeyA, NumpadEnter)."
      mods:
        type: list
        items: { type: str, enum: [ctrl, shift, alt, meta] }
        default: []
  hid.move:
    on: worker
    run: scripts/kvm.py:move
    doc: Move the pointer to an absolute position in PiKVM units (-32768..32767 across the captured frame, 0 is the centre).
    risk: exec
    scope: local
    effects: [physical]
    args:
      x: { type: int, required: true, min: -32768, max: 32767 }
      y: { type: int, required: true, min: -32768, max: 32767 }
  hid.click:
    on: worker
    doc: Click a mouse button. With x and y, first move the pointer to that pixel of the captured screen (top-left origin).
    risk: exec
    scope: local
    effects: [physical]
    timeout: 20s
    args:
      x: { type: int, min: 0 }
      y: { type: int, min: 0 }
      button: { type: str, enum: [left, right, middle], default: left }
    run: scripts/kvm.py:click
  power.on:
    on: worker
    run: scripts/kvm.py:power_on
    doc: Press the ATX power button to turn the machine on (nothing happens when it is already on).
    risk: exec
    scope: local
    effects: [physical]
  power.off:
    on: worker
    run: scripts/kvm.py:power_off
    doc: Turn the machine off with a short ATX power press (the OS shuts down); force=true holds the button (hard off, unsaved work is lost).
    risk: exec
    scope: local
    effects: [destructive, physical]
    args:
      force: { type: bool, default: false, doc: Hold the power button instead of a short press. }
  power.reset:
    on: worker
    run: scripts/kvm.py:power_reset
    doc: Press the ATX reset button (hard reset, unsaved work is lost).
    risk: exec
    scope: local
    effects: [destructive, physical]
  power.status:
    on: worker
    run: scripts/kvm.py:power_status
    doc: "ATX state: power and hdd LEDs, and whether a button press is in progress."
    risk: read
    scope: local
    idempotent: true
    result:
      type: map
      fields: { power: { type: bool }, hdd: { type: bool }, busy: { type: bool } }
  api_get:
    on: worker
    doc: GET any /api/ endpoint on the PiKVM. JSON and text bodies come back decoded, anything else as a file.
    risk: read
    scope: local
    effects: [sensitive]
    timeout: 30s
    args:
      path: { type: str, required: true, pattern: "^/api/[A-Za-z0-9_./-]*$", doc: "An /api/ path, e.g. /api/info." }
      query: { type: json, doc: "Query parameters as an object of strings, numbers or bools." }
    run: scripts/kvm.py:api_get
  api_post:
    on: worker
    doc: POST to any /api/ endpoint on the PiKVM. The body is `body` (text) or `body_b64` (bytes).
    risk: exec
    scope: local
    effects: [destructive, physical]
    timeout: 30s
    args:
      path: { type: str, required: true, pattern: "^/api/[A-Za-z0-9_./-]*$", doc: "An /api/ path, e.g. /api/hid/events/send_key." }
      query: { type: json, doc: "Query parameters as an object of strings, numbers or bools." }
      body: { type: str }
      body_b64: { type: str }
      body_type: { type: str, default: application/json, pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+(; *[A-Za-z0-9_-]+=[A-Za-z0-9_.-]+)*$" }
    run: scripts/kvm.py:api_post
provides: [screen.capture, hid.type, hid.key, hid.click, power.off]
docs: { manual: docs/manual.md }
