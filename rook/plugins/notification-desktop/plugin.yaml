# Runs on the hub; the worker only runs the desktop's own tool (shell.exec).
# The text and title reach it as data: an argv slot after "--" on Linux,
# environment variables the Windows script reads (never spliced into its text).
manifest: 1
plugin: notification-desktop
version: 0.6.0
title: Desktop notifications
doc: Pop up a notification on a worker's desktop.
package: devices
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
runs_on: hub
platforms: [linux, windows]
uses: [shell.exec]
caps:
  notification.post:
    doc: Show a notification on this worker's desktop.
    on: worker
    risk: write
    scope: local
    args:
      text: { type: str, required: true }
      title: { type: str, default: Rook }
    run: scripts/notify.py:post
provides: [notification.post]
docs: { manual: docs/manual.md }
