# The notify.send contract's provider (castling-attention, castling-agents
# "Reaching the user"): one send service that gets a message to a person on
# a channel that reaches them. Channels: phone (notification.post on the
# person's device, a target contract), telegram and discord (their plugins'
# send caps, to the person's linked account). The house agent picks the
# channel by passing one; otherwise the person's own order, else the hub's.
# Code: scripts/notify.py.
manifest: 1
plugin: notify
version: 0.5.0
title: Notify
doc: Get a message to a person on the channel that reaches them (phone, Telegram, Discord).
package: core
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
# The channels it may reach, as the caller (*.notification.post: a device's
# provider of the contract, by the provider naming convention).
uses: [notification.post, "*.notification.post", telegram.send, telegram.status, discord.send, discord.status]

settings:
  channels:
    type: list
    items: { type: str, enum: [phone, telegram, discord] }
    default: [phone, telegram, discord]
    where: hub
    doc: The channels to try, first choice first, for people who haven't set their own.
  reach:
    type: list
    items: { type: str, enum: [phone, telegram, discord] }
    where: person
    doc: "How you want to be reached, first choice first; blank: the hub's order."
  phone:
    type: str
    where: person
    doc: Your phone's worker name (or any device that takes notification.post), for the phone channel.

caps:
  send:
    doc: "Get a message to a person (blank: the hub's owners) on the first channel that reaches them, or the one named."
    on: hub
    risk: write
    scope: external
    timeout: 1m
    run: scripts/notify.py:send
    args:
      text: { type: str, required: true, doc: The message. }
      to: { type: str, doc: "The person to reach (their name); blank: the hub's owners." }
      title: { type: str, doc: "A short heading, where the channel shows one." }
      channel:
        type: str
        enum: [phone, telegram, discord, all]
        doc: "Only this channel (all: every channel they have); blank: the first that works."
    result:
      type: map
      fields:
        sent: { type: list, items: { type: map }, doc: "{to, channel} for each delivery." }
        errors: { type: map, doc: "person -> {channel: why it didn't go}." }
  channels:
    doc: The hub's channels in order and whether each can reach a person now (linked, connected).
    on: hub
    risk: read
    scope: multi-user
    idempotent: true
    run: scripts/notify.py:channels
    args:
      to: { type: str, doc: "The person (their name); blank: you." }
    result: { type: map }

provides:
  notify.send: notify.send
docs: { manual: docs/manual.md }
