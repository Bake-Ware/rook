# Torrents through Deluge's own console client, run on the hub: the worker
# only runs deluge-console (shell.exec).
#
# deluge-console re-parses its one command argument, so the arg patterns are
# the injection guard: no ';', quotes, backslashes, control characters or a
# leading '-' (which would read as an option, rm --remove_data).
manifest: 1
plugin: torrent
version: 0.6.0
title: Torrents (Deluge)
doc: Manage a worker's Deluge torrent client through deluge-console.
package: devices
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
runs_on: hub
platforms: [linux, windows]
uses: [shell.exec]
settings:
  console:
    type: str
    where: hub
    default: deluge-console
    doc: The deluge-console program (a name on PATH or a full path).
caps:
  version:
    on: worker
    run: scripts/torrent.py:version
    doc: The deluge-console and libtorrent versions. Needs no daemon.
    risk: read
    scope: local
    idempotent: true
    result: { type: map, fields: { deluge: { type: str }, libtorrent: { type: str } } }
  status:
    on: worker
    run: scripts/torrent.py:status
    doc: The daemon's session summary (transfer rates, DHT nodes, torrents per state). Fails when the daemon isn't reachable.
    risk: read
    scope: local
    idempotent: true
    result:
      type: map
      fields:
        upload: { type: str, doc: Total upload rate. }
        download: { type: str, doc: Total download rate. }
        dht_nodes: { type: int }
        torrents: { type: int }
        downloading: { type: int }
        seeding: { type: int }
        paused: { type: int }
        queued: { type: int }
        checking: { type: int }
        error: { type: int }
  list:
    on: worker
    run: scripts/torrent.py:list_
    doc: "Current torrents: state letter (S seeding, D downloading, P paused, Q queued, C checking, E error, M moving, U allocating), progress, name, id."
    risk: read
    scope: local
    idempotent: true
    result:
      type: list
      items:
        type: map
        fields:
          state: { type: str }
          progress: { type: float }
          name: { type: str }
          id: { type: str }
  get:
    on: worker
    run: scripts/torrent.py:get
    doc: One torrent in detail (save path and files); read the files with file.read.
    risk: read
    scope: local
    idempotent: true
    args:
      torrent_id:
        type: str
        required: true
        pattern: '^([0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f*-][^\s;''"\\\x00-\x1f\x7f]*)$'
        doc: Hash (or prefix), several hashes separated by spaces, or a name without spaces.
  add:
    on: worker
    run: scripts/torrent.py:add
    doc: Add a torrent by magnet link, .torrent URL or local path.
    risk: write
    scope: local
    timeout: 45s
    undo: torrent.remove
    args:
      torrent:
        type: str
        required: true
        pattern: '^[^\s;''"\\\x00-\x1f\x7f-][^\s;''"\\\x00-\x1f\x7f]*$'
        doc: Magnet link, .torrent URL or local path (no spaces, quotes or backslashes).
  pause:
    on: worker
    run: scripts/torrent.py:pause
    doc: Pause a torrent by id or name, or every torrent with `*`.
    risk: write
    scope: local
    idempotent: true
    undo: torrent.resume
    args:
      torrent_id:
        type: str
        default: "*"
        pattern: '^(\*|[0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f*-][^\s;''"\\\x00-\x1f\x7f]*)$'
        doc: Hash (or prefix), several hashes separated by spaces, a name without spaces, or `*` for all.
  resume:
    on: worker
    run: scripts/torrent.py:resume
    doc: Resume a torrent by id or name, or every torrent with `*`.
    risk: write
    scope: local
    idempotent: true
    undo: torrent.pause
    args:
      torrent_id:
        type: str
        default: "*"
        pattern: '^(\*|[0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f*-][^\s;''"\\\x00-\x1f\x7f]*)$'
        doc: Hash (or prefix), several hashes separated by spaces, a name without spaces, or `*` for all.
  remove:
    on: worker
    run: scripts/torrent.py:remove
    doc: Remove a torrent from Deluge and keep its downloaded files.
    risk: write
    scope: local
    args:
      torrent_id:
        type: str
        required: true
        pattern: '^([0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f*-][^\s;''"\\\x00-\x1f\x7f*]*)$'
        doc: Hash (or prefix), several hashes separated by spaces, or a name without spaces. No `*` anywhere.
  delete:
    on: worker
    run: scripts/torrent.py:delete
    doc: Remove a torrent AND erase its downloaded files for good.
    risk: write
    scope: local
    effects: [destructive]
    args:
      torrent_id:
        type: str
        required: true
        pattern: '^([0-9a-fA-F]{1,40}( [0-9a-fA-F]{1,40})*|[^\s;''"\\\x00-\x1f\x7f*-][^\s;''"\\\x00-\x1f\x7f*]*)$'
        doc: Hash (or prefix), several hashes separated by spaces, or a name without spaces. No `*` anywhere.
docs: { manual: docs/manual.md }
