# Talking to the house agent through a Rook remote (firmware-remote). The
# remote has no microphone of its own: it opens the one in the Bluetooth
# remote paired to it (Google's voice-over-BLE service, ATVV) and sends what
# it hears as remote.voice.part events while it is spoken, then remote.voice.
# This plugin keeps the parts (a hook), and remote-voice.hear, fired by a job
# on remote.voice, decodes them (IMA ADPCM), puts the utterance into a voice
# session (speech.hear) and writes the replies on the remote's screen
# (remote.display). Code: scripts/voice.py.
manifest: 1
plugin: remote-voice
version: 0.2.0
title: Remote voice
doc: Talk to the house agent with a Rook remote's Assistant key; the answer comes back on its screen.
package: devices
runs_on: hub
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
uses: [speech.open, speech.hear, speech.read, remote.display, net.open, stream.read, stream.write, stream.close]

settings:
  agent: { type: str, default: "", doc: "The agent the remote talks to; blank: the speech plugin's own default." }
  voice_url: { type: str, default: "", doc: "A voice server to do the hearing (its POST /api/transcribe, as the phone app uses it), e.g. https://kaiju:8900. Blank: the band's own speech-to-text (voice.stt)." }
  voice_token: { type: str, default: "", secret: true, doc: "That server's key, when it wants one." }
  voice_via: { type: str, default: "", doc: "A worker on the voice server's network to make the request from (its net.open), when the hub itself can't reach it. Blank: straight from the hub." }

caps:
  hear:
    doc: "One utterance from a remote, as a job on remote.voice hands it over (event: {name, payload}). Decodes the audio its remote.voice.part events carried, gives it to the remote's voice session, and shows what was heard and the replies on the remote's screen. Answers {heard, say, reply, audio: {frames, seconds, ...}}."
    risk: write
    scope: multi-user
    timeout: 4m
    run: scripts/voice.py:hear
    args:
      event: { type: map, required: true, doc: "{name, payload}: the remote.voice event." }
    result: { type: map }

hooks:
  on: [ { event: "remote.voice.part", run: scripts/voice.py:on_part } ]
