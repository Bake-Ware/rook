# Runs on the hub. On Linux the first capture tool that works writes a file
# in the worker's temp folder, read back with file.read and removed; on Windows
# PowerShell prints the JPEG as base64.
manifest: 1
plugin: screen-desktop
version: 0.6.0
title: Desktop screenshots
doc: Capture a worker's screen as a JPEG.
package: devices
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
runs_on: hub
platforms: [linux, windows]
uses: [shell.exec, shell.env, file.read]
caps:
  screen.capture:
    doc: The screen (or a region of it) as a JPEG.
    on: worker
    risk: read
    scope: local
    effects: [sensitive]
    timeout: 60s
    args:
      quality: { type: int, default: 85, min: 1, max: 100, doc: JPEG quality. }
      x: { type: int, min: 0, doc: "Region left edge (set x, y, w and h together; not on Windows, spectacle or gnome-screenshot)." }
      y: { type: int, min: 0, doc: Region top edge. }
      w: { type: int, min: 1, doc: Region width. }
      h: { type: int, min: 1, doc: Region height. }
    result: { type: file, doc: A JPEG. }
    run: scripts/screen.py:capture
provides: [screen.capture]
docs: { manual: docs/manual.md }
