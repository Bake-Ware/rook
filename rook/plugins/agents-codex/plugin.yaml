# An agent.backend provider: one agent turn in the Codex CLI on this worker,
# under the ChatGPT subscription it is signed in with (castling-inference:
# "Day one: support Claude Code and Codex as backends"). `codex exec --json`,
# resumed by session id (`codex exec resume <id>`); the prompt goes in on
# stdin. Code: scripts/codex.py.
manifest: 1
plugin: agents-codex
version: 0.5.0
title: Codex backend
doc: Agent turns in the Codex CLI, for the agents package.
package: agents
license: Apache-2.0
source: https://github.com/Bake-Ware/rook
platforms: [linux, macos, windows]
settings:
  codex: { default: codex, doc: "The codex program: a name on PATH or a full path." }
  model: { doc: "System Two's model when the agent names none (a Codex model id); blank: Codex's own default." }
  model_three: { default: gpt-6-luna, doc: "System Three's model (dream cycles): a light one; blank: Codex's own default." }
  sandbox: { enum: [read-only, workspace-write, danger-full-access], doc: "Codex's sandbox for the commands a turn runs; blank: its own default (read-only)." }
  config: { type: list, items: { type: str }, doc: "Extra Codex config overrides, one key=value each (passed as -c), e.g. the Rook MCP door: mcp_servers.rook.url=\"http://hub:8751/mcp\"." }
  isolate: { type: bool, default: true, doc: "Leave out the signed-in user's own Codex config and rules (--ignore-user-config --ignore-rules; sign-in still comes from CODEX_HOME): a turn reaches only what config gives it." }
caps:
  turn:
    doc: One agent turn in Codex; pass session back to continue the conversation.
    risk: exec
    scope: local
    timeout: 30m
    run: scripts/codex.py:turn
    args:
      prompt: { type: str, required: true }
      session: { type: str, doc: "The Codex session id to resume; blank: a new session." }
      cwd: { type: str, doc: "The folder Codex works in; blank: this plugin's work folder." }
      model: { type: str, doc: "A Codex model id, or two/three for System Two/Three; blank: the model setting." }
      effort: { type: str, doc: "Codex's model_reasoning_effort (minimal, low, medium, high, xhigh); blank: its own." }
      system: { type: str, doc: Codex's developer instructions for the turn. }
      timeout: { type: duration, default: 20m, doc: How long the turn may take. }
    result:
      type: map
      fields:
        text: { type: str, required: true }
        session: { type: str, required: true }
        usage: { type: map, items: { type: int } }
provides:
  agent.backend: agents-codex.turn
docs: { manual: docs/manual.md }
