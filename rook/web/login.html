<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Rook</title>
<link rel="stylesheet" href="/account/bands/assets/settings.css">
<link rel="stylesheet" href="/account/bands/assets/theme.css">
</head><body class="standalone-account"><main class="settings-workspace narrow">
<h1>♖ Rook</h1>
<section>
<p class="muted">{{lead}}</p>
{{error|raw}}
<form method="POST" action="/login">
{{user_field|raw}}
<label>Password <input name="pass" type="password" required autocomplete="current-password"{{pass_focus|raw}}></label>
<button type="submit">Sign in</button>
</form>
<p class="muted">The password was shown at the end of the hub's install.</p>
<p><a href="/account/login">Sign in with Google or a personal account instead</a></p>
</section>
</main></body></html>
