<div class="mg">
<div class="mg-bar"><p id="bands-summary" class="mg-sub mg-grow"></p><button id="create-band" type="button" class="mg-btn primary">New band</button></div>
<p id="message" class="mg-status" role="status" aria-live="polite"></p>
<div id="migration-list" class="mg" style="gap:8px"></div>
<div class="mg-split"><div id="bands-list" class="mg-box mg-main"><p class="mg-empty">Loading your bands…</p></div><div id="band-panel" class="mg-box strong mg-side"></div></div>
<div id="migration-history"></div>
<dialog id="band-dialog" class="mg mg-dialog" aria-labelledby="dialog-title">
<form id="band-form">
<h2 id="dialog-title"></h2><p id="dialog-description"></p>
<label id="name-field" class="mg-field">Band name <input id="band-name" maxlength="100" autocomplete="off"></label>
<div id="target-field" class="mg" style="gap:14px"><label class="mg-field" for="target-band">Move to band <select id="target-band"></select></label><label id="new-name-field" class="mg-field" hidden>New band name <input id="new-band-name" maxlength="100" autocomplete="off"></label></div>
<div id="worker-preview" class="mg-sub"></div>
<p id="dialog-error" class="mg-error" role="alert"></p>
<div class="mg-actions end"><button type="button" id="cancel-dialog" class="mg-btn">Cancel</button><button id="submit-band" type="submit" class="mg-btn primary">Save</button></div>
</form></dialog>
</div>
