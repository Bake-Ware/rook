<div class="band-head"><p>Create bands, move workers, and manage access.</p><button id="create-band">Create band</button></div>
<p id="message" role="status" aria-live="polite"></p>
<div id="bands-list"><p class="empty">Loading your bands…</p></div>
<div id="migration-list"></div>
<p class="muted">Moving a worker requires ownership of its current band and access to its destination. Existing workers may need an update before moving. <a href="/account#bands">Manage members, invitations, pairing, and device enrollment</a>.</p>
<dialog id="band-dialog" aria-labelledby="dialog-title">
<form id="band-form">
<h2 id="dialog-title"></h2><p id="dialog-description"></p>
<div id="name-field"><label>Band name <input id="band-name" maxlength="100" autocomplete="off"></label></div>
<div id="target-field"><label for="target-band">Move to band</label><select id="target-band"></select><label id="new-name-field" hidden>New band name <input id="new-band-name" maxlength="100" autocomplete="off"></label></div>
<div id="worker-preview"></div>
<p id="dialog-error" class="error" role="alert"></p>
<div class="dialog-actions"><button type="button" id="cancel-dialog" class="secondary">Cancel</button><button id="submit-band" type="submit">Save</button></div>
</form></dialog>
