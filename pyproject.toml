[project]
name = "rook"
version = "0.1.0"
description = "Self-updating mesh of worker agents over an encrypted band, driven from a web dashboard, a terminal UI, or MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bake-Ware" }]
dependencies = [
    # Encrypted transport. Not on PyPI yet, so it installs from GitHub.
    # 0.3.0 (audit/hub): ROUTE/ADDRESSED channel types + route_id_for for
    # addressed hub routing (SPEC §10.1), bounded Reassembler, linear-time
    # DropReceiver. Pinned to telesthete main at the v0.3.0 tag; move it
    # together with Dockerfile TELESTHETE_REV.
    "telesthete @ git+https://github.com/Bake-Ware/telesthete@f3fc597402a76f78cec9da0487de0725aaf77eb2",
    "pynacl>=1.5",
    "cryptography>=42",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "mcp>=1.27.1,<2",
    "PyJWT[crypto]>=2.13,<3",
    "Pillow>=12.3,<13",
    # Plugin manifests (rook.kit.manifest). Pure-Python fallback, so it
    # installs everywhere a worker runs.
    "pyyaml>=6",
]

[project.optional-dependencies]
# Screen capture on desktop workers (X11 / Windows / macOS).
desktop = [
    "mss>=9.0",
]
# Speech on the hub itself (the voice plugin's engine "here": recognition,
# spoken replies, turn detection). Large: leave it out of a hub that does not
# serve voice, or that forwards voice to a GPU box (engine "remote").
# services/voice/requirements.txt pins the versions the GPU host runs.
voice = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
    "setuptools<81",  # webrtcvad still imports pkg_resources
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "onnxruntime>=1.18",
    "ddgs>=9",
]
# Browser control on a worker (browser.* caps). After installing, fetch the
# browser once: python -m playwright install chromium
browser = [
    "playwright>=1.49",
]
# Validating plugin manifests against the JSON Schema (rook.kit.manifest):
# the hub needs it; workers load hub-signed manifests and don't. Kept out of
# the base install because jsonschema pulls in rpds-py (a Rust extension).
manifest = [
    "jsonschema>=4.18",
]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.18",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6",  # castling/tools/convert.py
]

[project.urls]
Homepage = "https://github.com/Bake-Ware/rook"
Issues = "https://github.com/Bake-Ware/rook/issues"

[project.scripts]
rook = "rook.__main__:main"
rook-worker = "rook.worker.cli:main"
# The hub: dashboard + MCP server in one process (`rook hub serve`).
rook-hub = "rook.hub.serve:main"
# The same two halves as separate processes (compat; retired in a later release).
rook-dashboard = "rook.remote.bootstrap:_cli_main"
rook-mcp = "rook.band_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rook"]

# The agent skill ships inside the package so an installed hub can serve it.
[tool.hatch.build.targets.wheel.force-include]
"skills/rook" = "rook/_skill/rook"
# The Claude Code mod's manifest, for rook_install_claude_code's version check.
"integrations/claude-code/.claude-plugin/plugin.json" = "rook/_claude_code/plugin.json"
# The voice service, so an installed hub can run it in process (voice plugin,
# engine "here"). services/voice stays where it is: the GPU host deploys it
# from there (services/voice/deploy/release.sh).
"services/voice" = "rook/_voice_engine"

# The user manual: the Help page and the knowledge base's "Rook manual" copy.
"docs/manual" = "rook/_manual"

# The plugin manifest schema, for rook.kit.manifest in an installed hub.
"conformance/manifest/manifest.schema.json" = "rook/_conformance/manifest.schema.json"

[tool.hatch.build.targets.sdist]
include = ["rook", "skills", "integrations", "services/voice", "docs/manual", ".claude-plugin", "tests", "conformance", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md", ".env.example"]
# Hatchling reads only the root .gitignore: keep out what Claude Code writes
# beside a loaded mod (its types list the developer's connected MCP servers).
exclude = ["integrations/**/.claude-plugin/types", "**/node_modules"]
