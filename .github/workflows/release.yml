name: Release

# Tag vX.Y.Z (git tag -a v0.5.1 -m ... && git push origin v0.5.1) and this
# builds the one-file worker (worker/, docs/spec/worker-profile.md) for each
# platform and attaches the files to a GitHub release, named exactly as a
# worker announces the file it runs (its facts.artifact):
#
#   rook-worker-linux-x86_64          static (musl): runs on any Linux
#   rook-worker-linux-aarch64         static (musl)
#   rook-worker-windows-x86_64.exe
#
# with a .sha256 beside each. A tag with a pre-release segment (v0.5.1-rc1)
# stays a prerelease.
#
# Installing on a new machine: deploy/castling-worker/install.sh --binary
# <the file's URL>. Rolling it out to workers already on a band: put the
# files in one folder on the hub's machine and call update.rollout
# {source: <folder>, version: "0.5.1"} (docs/castling-updates.md).
#
# The hub itself installs from a checkout (deploy/install/install.sh), the
# desktop app builds in desktop.yml, the phone app with its own Gradle build.
#
# ${{ }} expressions reach shell steps only through env:, never spliced into
# a run: script (inputs.tag is user-supplied).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.5.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Create it if it is not there yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            pre=""
            case "$TAG" in *-*|*rc*|*a[0-9]*|*b[0-9]*) pre="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $pre
          fi

  worker:
    name: rook-worker for ${{ matrix.artifact }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: rook-worker-linux-x86_64
            built: rook-worker
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: rook-worker-linux-aarch64
            built: rook-worker
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rook-worker-windows-x86_64.exe
            built: rook-worker.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10-14
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --manifest-path worker/Cargo.toml --target "$TARGET"
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          BUILT: ${{ matrix.built }}
        run: |
          cp "worker/target/$TARGET/release/$BUILT" "$ARTIFACT"
          if command -v sha256sum >/dev/null; then sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          else shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"; fi
          gh release upload "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" --clobber
