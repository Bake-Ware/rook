name: Release

# Tag vX.Y.Z (git tag -a v0.2.0 -m ... && git push origin v0.2.0) and this
# runs, in order:
#   1. dist     verifies the pinned relay archives (build provenance + the
#               hashes committed in rook/_release.py), builds the sdist + wheel
#               (version from the tag, build name stamped by
#               tools/release_prep.py) and the telesthete wheel they pin;
#   2. publish  a GitHub *prerelease* with those files and SHA256SUMS, with
#               build provenance attestations;
#   3. docker   ghcr.io/bake-ware/rook:<version> for linux/amd64 + linux/arm64;
#   4. e2e      scripts/install-hub.sh --no-systemd against the published
#               release, the path a new user's one-command install takes;
#   5. promote  only when 3 and 4 passed and the version is final: mark the
#               release latest (what the installer installs) and tag :latest.
# A tag with a pre-release segment (v0.3.0rc1, v0.3.0-rc1) stays a prerelease.
#
# ${{ }} expressions reach shell steps only through env:, never spliced into
# a run: script (inputs.tag is user-supplied).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/bake-ware/rook

jobs:
  dist:
    name: Build sdist and wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.prep.outputs.version }}
      build_name: ${{ steps.prep.outputs.build_name }}
      prerelease: ${{ steps.prep.outputs.prerelease }}
      relay: ${{ steps.relay.outputs.relay }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-?(a|b|rc)[0-9]+)?$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0     # build number = git rev-list --count
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build
      # The relay is the telesthete release pinned in rook/_release.py. Its
      # archives must carry telesthete's build provenance, and their hashes
      # (recorded into rook/_release.py when not pinned yet, else checked)
      # are what installers and the image verify downloads against.
      - name: Verify the pinned relay release
        id: relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          relay="$(python -c 'import rook._release as r; print(r.RELAY)')"
          gh release download "$relay" --repo Bake-Ware/telesthete -D relay-dist \
            -p 'telesthete-hub-*-linux.tar.gz' -p 'telesthete-hub-*-linux.tar.gz.sha256'
          for f in relay-dist/*.tar.gz; do
            gh attestation verify "$f" --repo Bake-Ware/telesthete
          done
          echo "relay=$relay" >> "$GITHUB_OUTPUT"
      # The release wheel must not pin telesthete as git+https (pip would need
      # git to install it): build the pinned commit into a wheel, ship it as a
      # release asset, and point the requirement at that asset by URL + sha256.
      - name: Build the pinned telesthete wheel
        id: telesthete
        run: |
          pin="$(python tools/release_prep.py --print-telesthete-pin)"
          python -m pip wheel --no-deps -w telesthete-dist \
            "telesthete @ git+https://github.com/Bake-Ware/telesthete@${pin}"
          whl="$(ls telesthete-dist/*.whl)"
          {
            echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$whl")"
            echo "sha256=$(sha256sum "$whl" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      # tools/release_prep.py refuses a release whose user manual is out of
      # date (tools/manual_check.py --release); the check reads the settings
      # schema and plugin list, so it needs Rook's dependencies.
      - name: Install Rook for the user-manual release gate
        run: python -m pip install -e .
      - name: Stamp version, build name, telesthete and relay pins
        id: prep
        env:
          TELESTHETE_URL: ${{ steps.telesthete.outputs.url }}
          TELESTHETE_SHA256: ${{ steps.telesthete.outputs.sha256 }}
          RELAY: ${{ steps.relay.outputs.relay }}
        run: |
          python tools/release_prep.py --tag "$TAG" \
            --telesthete-wheel-url "$TELESTHETE_URL" --telesthete-wheel-sha256 "$TELESTHETE_SHA256" \
            --pin-relay "$RELAY" --relay-dir relay-dist
          version="$(python -c 'import rook._release as r; print(r.VERSION)')"
          name="$(python -c 'import rook._release as r; print(r.NAME)')"
          pre=false
          case "$version" in *a*|*b*|*rc*|*dev*) pre=true ;; esac
          {
            echo "version=$version"
            echo "build_name=$name"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel
        run: |
          python -m build -o dist
          cp telesthete-dist/*.whl dist/
          (cd dist && sha256sum ./* | sed 's#  \./#  #' > SHA256SUMS && cat SHA256SUMS)
      - name: Check the wheel is self-contained and carries the relay pin
        run: |
          unzip -p dist/rook-*.whl 'rook-*.dist-info/METADATA' | tee /dev/stderr \
            | grep -q '^Requires-Dist: telesthete @ https://.*#sha256='
          if unzip -p dist/rook-*.whl 'rook-*.dist-info/METADATA' | grep -q 'git+'; then
            echo "::error::the wheel still has a git+ requirement"; exit 1
          fi
          unzip -l dist/rook-*.whl | grep -q 'rook/_skill/rook/SKILL.md'
          unzip -p dist/rook-*.whl rook/_release.py | python -c \
            'import ast,sys; t={n.targets[0].id: ast.literal_eval(n.value) for n in ast.parse(sys.stdin.read()).body if isinstance(n, ast.Assign)}; assert {"x86_64","aarch64"} <= set(t["RELAY_SHA256"]), t'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      # The Docker job builds from exactly this stamped tree.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stamped
          path: |
            pyproject.toml
            Dockerfile
            rook/__init__.py
            rook/_release.py
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write       # build provenance attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.dist.outputs.version }}
      BUILD_NAME: ${{ needs.dist.outputs.build_name }}
      RELAY: ${{ needs.dist.outputs.relay }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      # Always a prerelease first: `latest` (what the installer and
      # releases/latest resolve) moves only in the promote job, after the
      # image and the install test passed.
      - name: Create or update the release
        run: |
          notes="Rook ${VERSION}, build ${BUILD_NAME}.

          Install a hub: \`curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/${TAG}/scripts/install-hub.sh | bash\`
          Docker: \`${IMAGE}:${VERSION}\` (relay: telesthete ${RELAY}).
          Verify a download: \`gh attestation verify <file> -R ${GH_REPO}\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --prerelease \
              --title "Rook ${VERSION} (${BUILD_NAME})" --notes "$notes" --generate-notes
          fi

  docker:
    name: Docker image (amd64, arm64)
    # The image pip-installs the stamped tree, whose telesthete requirement is
    # the wheel URL published above.
    needs: [dist, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.dist.outputs.version }}
      RELAY: ${{ needs.dist.outputs.relay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stamped
          path: .
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.dist.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.dist.outputs.version }}
            io.github.bake-ware.rook.build=${{ needs.dist.outputs.build_name }}
            io.github.bake-ware.telesthete.relay=${{ needs.dist.outputs.relay }}
      # Build amd64 into the local daemon first and smoke-test it, so a broken
      # image is never pushed; the push below reuses its cache.
      - name: Build (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rook-smoke:latest
          build-args: TELESTHETE_RELAY_VERSION=${{ needs.dist.outputs.relay }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm -e WANT="$VERSION" rook-smoke:latest python -c \
            'import os, rook, rook._release as r; assert rook.__version__ == os.environ["WANT"], rook.__version__; print(r.NAME, r.RELAY)'
          docker run --rm rook-smoke:latest rook-hub --help >/dev/null
          docker run --rm -e HUB_BIND=127.0.0.1:7474 rook-smoke:latest \
            timeout --preserve-status -s TERM 2 telesthete-hub
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TELESTHETE_RELAY_VERSION=${{ needs.dist.outputs.relay }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  e2e:
    name: One-command install from the release
    needs: [dist, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # --no-systemd: GitHub runners have no usable user systemd instance.
      - name: Install the published release with scripts/install-hub.sh
        run: |
          bash scripts/install-hub.sh --user --no-systemd --yes \
            --version "$TAG" --data-dir "$RUNNER_TEMP/rook-data" --bind 127.0.0.1
      - name: The dashboard answers
        run: |
          curl -fsS http://127.0.0.1:7005/health
          grep -q '^ROOK_WEB_PASS=' "$RUNNER_TEMP/rook-data/secrets.env"
          test "$(stat -c %a "$RUNNER_TEMP/rook-data/secrets.env")" = 600
      - name: Uninstall
        if: always()
        run: bash scripts/install-hub.sh --user --no-systemd --yes --uninstall --purge

  promote:
    name: Mark latest
    needs: [dist, docker, e2e]
    if: needs.dist.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.dist.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Release becomes latest, image gets :latest
        run: |
          gh release edit "$TAG" --prerelease=false --latest
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${VERSION}"
