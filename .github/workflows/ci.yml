name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: worker-bundle builds derive their build number from
          # `git rev-list --count HEAD`, like a real hub checkout.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/requirements-voice.txt
      # rook[dev] pulls telesthete from the commit pyproject.toml pins (git+https).
      # tests/requirements-voice.txt adds the voice service's light deps so the
      # tests/test_voice_*.py suites run here instead of skipping.
      - name: Install rook[dev] and the voice-test deps
        run: python -m pip install -e ".[dev]" -r tests/requirements-voice.txt
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider -rfE --junitxml=pytest-results.xml
      # Failures as annotations: readable via the check-runs API even where
      # the log download (blob storage) is not reachable.
      - name: Annotate failures
        if: failure()
        run: python tools/ci_annotate.py pytest-results.xml

  checks:
    name: conformance vectors, generated manifests, JS syntax, installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install rook
        run: python -m pip install -e ".[manifest]"
      - name: conformance vectors are up to date
        run: python conformance/core-v2/generate.py --check
      - name: the single-file worker's embedded manifests are up to date
        run: python worker/gen_script_manifests.py --check
      - name: node --check the hub site's and the plugins' JavaScript
        # rook-scene.js is a vendored, minified bundle.
        run: find rook/core2/hub rook/plugins -name '*.js' ! -name 'rook-scene.js' -print0 | xargs -0 -n1 node --check
      - name: shellcheck the installers
        run: shellcheck --severity=warning deploy/install/install.sh deploy/castling-sidecar/install.sh deploy/castling-worker/install.sh

  worker:
    name: Rust worker (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10-14
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  manual:
    # Advisory on pull requests: the manual's pages and links are also checked
    # in pytest (tests/test_manual05.py).
    name: user manual (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install rook
        run: python -m pip install -e ".[manifest]"
      - name: The 0.5 manual is consistent
        run: python tools/manual05_check.py
