name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: worker-bundle builds derive their build number from
          # `git rev-list --count HEAD`, like a real hub checkout.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/requirements-voice.txt
      # rook[dev] pulls telesthete from the commit pyproject.toml pins (git+https).
      # tests/requirements-voice.txt adds the voice service's light deps so the
      # tests/test_voice_*.py suites run here instead of skipping.
      - name: Install rook[dev] and the voice-test deps
        run: python -m pip install -e ".[dev]" -r tests/requirements-voice.txt
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider -rfE --junitxml=pytest-results.xml
      # Failures as annotations: readable via the check-runs API even where
      # the log download (blob storage) is not reachable.
      - name: Annotate failures
        if: failure()
        run: python tools/ci_annotate.py pytest-results.xml

  checks:
    name: generated docs, conformance vectors, JS syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install rook
        run: python -m pip install -e .
      - name: docs/operations/settings-reference.md is up to date
        run: python tools/gen_settings_reference.py --check
      - name: skills/rook/references/tools.md is up to date
        run: python tools/gen_skill_reference.py --check
      - name: conformance vectors are up to date
        run: python conformance/generate.py --check
      - name: node --check the dashboard's JavaScript
        run: find rook/web -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: shellcheck the hub installer
        run: shellcheck scripts/install-hub.sh scripts/local-hub.sh

  manual:
    # Advisory on pull requests: features without a manual page and CHANGELOG
    # bullets that name none are reported here but never block a merge (page
    # parsing and links are in pytest). tools/release_prep.py runs the same
    # check with --release and refuses to cut a release with a stale manual.
    name: user manual coverage (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install rook
        run: python -m pip install -e .
      - name: The manual covers every feature and the CHANGELOG names its pages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python tools/manual_check.py --base "origin/$BASE_REF"
          else
            python tools/manual_check.py
          fi
