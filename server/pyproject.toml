[project]
name = "rook-kvm"
version = "0.1.0"
description = "MCP server for Rook KVM Bridge — control air-gapped machines via ESP32-S3 USB HID/serial"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rook-kvm = "rook_kvm.server:main"
